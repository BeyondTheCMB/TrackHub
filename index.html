                              <div style={{ fontSize: 11, color: "#4a6080", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
                              <input
                                type="number" min="0" max="10" step="0.1"
                                value={adv[key] ?? ""}
                                placeholder="—"
                                onChange={e => setAdv(key, e.target.value)}
                                onBlur={e => { if (e.target.value !== "") setAdv(key, e.target.value); }}
                                style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "7px 10px", color: "#e2c97e", fontSize: 15, fontFamily: "'DM Mono', monospace", fontWeight: 600, textAlign: "center", boxSizing: "border-box" }}
                                onFocus={e => e.target.style.borderColor = "#e2c97e44"}
                                onBlurCapture={e => e.target.style.borderColor = "#1a2535"}
                              />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* BGG link */}
                <div style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 12, color: "#3d526a", marginBottom: 2 }}>BGG ID</div>
                    <div style={{ color: "#60a5fa", fontSize: 14, fontWeight: 600, fontFamily: "'DM Mono', monospace" }}>#{entry.id}</div>
                  </div>
                  <a href={`https://boardgamegeek.com/boardgame/${entry.id}`} target="_blank" rel="noopener noreferrer"
                    style={{ color: "#60a5fa", fontSize: 13, textDecoration: "none", background: "#0a1929", border: "1px solid #1e3a5f", borderRadius: 6, padding: "5px 12px" }}>
                    View on BGG ↗
                  </a>
                </div>
              </div>
            </div>

            <div style={{ padding: "16px 28px", borderTop: "1px solid #1a2535", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
              <button onClick={() => onDelete(entry.id)} style={{ background: "transparent", border: "1px solid #3d1515", color: "#f87171", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 13 }}>Remove</button>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={onClose} style={{ background: "transparent", border: "1px solid #1a2535", color: "#64748b", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                <button onClick={() => onSave(edit)} style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "8px 22px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>Save</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Stats Panel ──────────────────────────────────────────────────────────
    function StatsPanel({ collection }) {
      const [bggFilter, setBggFilter] = React.useState("all");
      const [bggDiffFilter, setBggDiffFilter] = React.useState(null); // null | "higher" | "similar" | "lower"
      const scored  = collection.filter(g => g.score != null);
      const avgScore = scored.length ? (scored.reduce((a,g) => a + g.score, 0) / scored.length).toFixed(1) : "—";

      // ── helpers ──────────────────────────────────────────────────────────────
      const fmt = (n) => Number.isInteger(n) ? String(n) : n?.toFixed(1);
      const card = (children, mb = 20) => (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: 24, marginBottom: mb }}>
          {children}
        </div>
      );
      const sectionTitle = (t) => (
        <h3 style={{ margin: "0 0 18px", fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.1em" }}>{t}</h3>
      );

      if (collection.length === 0) return (
        <div style={{ textAlign: "center", padding: "60px 20px", color: "#6b8199" }}>
          <div style={{ fontSize: 60, marginBottom: 16 }}>🎲</div>
          <div>Add some games to see your stats</div>
        </div>
      );

      // ── 1. Summary tiles ─────────────────────────────────────────────────────
      const tiles = [
        { icon: "🎲", label: "Total Games",   value: collection.length },
        { icon: "🎮", label: "Base Games",    value: collection.filter(g => !g.isExpansion).length },
        { icon: "🔗", label: "Expansions",    value: collection.filter(g => g.isExpansion).length },
        { icon: "⭐", label: "Avg Score",     value: avgScore },
        { icon: "✓",  label: "Have Played",   value: collection.filter(g => { const s = migrateStatus(g).status; return s.playStatus === "played" || s.hasPlayed; }).length },
        { icon: "🏠", label: "Owned",         value: collection.filter(g => migrateStatus(g).status.ownership === "owned").length },
        { icon: "🔖", label: "Wishlist",    value: collection.filter(g => migrateStatus(g).status.ownership === "plan_to_buy").length },
      ];

      // ── 2. Collection growth by buy year ─────────────────────────────────────
      const buyYears = collection.filter(g => g.buyYear).map(g => g.buyYear);
      const byYearMap = {};
      buyYears.forEach(y => byYearMap[y] = (byYearMap[y] || 0) + 1);
      const byYearKeys = Object.keys(byYearMap).map(Number).sort((a,b) => a - b);

      // ── 3. Score distribution ─────────────────────────────────────────────────
      const scoreBuckets = Array.from({length:10}, (_,i) => ({
        n: i+1,
        count: scored.filter(g => Math.floor(g.score) === i+1).length
      }));
      const maxBucket = Math.max(...scoreBuckets.map(b => b.count), 1);

      // ── 4. Scored vs unscored ─────────────────────────────────────────────────
      const scoredPct = collection.length ? Math.round(scored.length / collection.length * 100) : 0;

      // ── 5. Harshest & most generous ──────────────────────────────────────────
      const sortedScored = [...scored].sort((a,b) => a.score - b.score);
      const bottom3 = sortedScored.slice(0, 3);
      const top3    = sortedScored.slice(-3).reverse();

      // ── 6. Score vs BGG avg ───────────────────────────────────────────────────
      const scoredWithBgg = scored.filter(g => g.bggAvg);

      // ── 7. Games by release year & avg score ────────────────────────────────
      const releaseYearMap = {};
      collection.forEach(g => {
        const y = parseInt(g.year);
        if (!y || y < 1900 || y > 2030) return;
        if (!releaseYearMap[y]) releaseYearMap[y] = { count: 0, scores: [] };
        releaseYearMap[y].count++;
        if (g.score != null) releaseYearMap[y].scores.push(g.score);
      });
      const releaseYearKeys = Object.keys(releaseYearMap).map(Number).sort((a,b) => a-b);
      const maxReleaseCount = Math.max(...releaseYearKeys.map(y => releaseYearMap[y].count), 1);

      // ── 8. Games by buy year & avg score ────────────────────────────────────
      const buyYearScoreMap = {};
      collection.forEach(g => {
        if (!g.buyYear) return;
        if (!buyYearScoreMap[g.buyYear]) buyYearScoreMap[g.buyYear] = { count: 0, scores: [] };
        buyYearScoreMap[g.buyYear].count++;
        if (g.score != null) buyYearScoreMap[g.buyYear].scores.push(g.score);
      });
      const buyYearScoreKeys = Object.keys(buyYearScoreMap).map(Number).sort((a,b) => a-b);
      const maxBuyCount = Math.max(...buyYearScoreKeys.map(y => buyYearScoreMap[y].count), 1);

      // ── 9. Spider chart data ──────────────────────────────────────────────────
      const ADV_FIELDS = [
        { key: "mechanics",     label: "Mechanics" },
        { key: "theme",         label: "Theme" },
        { key: "strategy",      label: "Strategy" },
        { key: "replayability", label: "Replayability" },
        { key: "accessibility", label: "Accessibility" },
        { key: "fun_factor",    label: "Fun Factor" },
      ];
      const spiderGames = collection.filter(g => g.advScores && ADV_FIELDS.some(f => g.advScores[f.key] != null));
      const spiderAvgs = ADV_FIELDS.map(f => {
        const vals = spiderGames.map(g => g.advScores?.[f.key]).filter(v => v != null);
        return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
      });

      // Spider SVG helper
      const spiderPoint = (value, index, total, cx, cy, r) => {
        const angle = (Math.PI * 2 * index / total) - Math.PI / 2;
        const dist  = (value / 10) * r;
        return [cx + dist * Math.cos(angle), cy + dist * Math.sin(angle)];
      };

      return (
        <div>
          {/* ── Summary tiles ── */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 12, marginBottom: 24 }}>
            {tiles.map(s => (
              <div key={s.label} style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "16px 20px", display: "flex", alignItems: "center", gap: 14 }}>
                <span style={{ fontSize: 24 }}>{s.icon}</span>
                <div>
                  <div style={{ fontSize: 24, fontWeight: 600, color: "#e2c97e", fontFamily: "'DM Mono', monospace", lineHeight: 1 }}>{s.value}</div>
                  <div style={{ fontSize: 10, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 3 }}>{s.label}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>

            {/* ── Score distribution ── */}
            {card(<>
              {sectionTitle("Score Distribution")}
              <div style={{ display: "flex", alignItems: "flex-end", gap: 5, height: 90 }}>
                {scoreBuckets.map(({ n, count }) => (
                  <div key={n} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                    {count > 0 && <div style={{ fontSize: 12, color: "#8899aa", fontFamily: "'DM Mono', monospace" }}>{count}</div>}
                    <div style={{ width: "100%", height: Math.max((count / maxBucket) * 65, count > 0 ? 4 : 2), background: count > 0 ? "#e2c97e" : "#1a2535", borderRadius: "3px 3px 0 0" }} />
                    <div style={{ fontSize: 12, color: "#6b8199", fontFamily: "'DM Mono', monospace" }}>{n}</div>
                  </div>
                ))}
              </div>
            </>, 0)}

            {/* ── Scored vs unscored ── */}
            {card(<>
              {sectionTitle("Scoring Coverage")}
              <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 36, fontWeight: 700, color: "#e2c97e", fontFamily: "'DM Mono', monospace", lineHeight: 1 }}>{scoredPct}%</div>
                <div style={{ fontSize: 13, color: "#6b8199" }}>of collection scored<br/><span style={{ color: "#e2e8f0" }}>{scored.length}</span> of {collection.length} games</div>
              </div>
              <div style={{ background: "#080f18", borderRadius: 6, height: 10, overflow: "hidden" }}>
                <div style={{ width: `${scoredPct}%`, height: "100%", background: "linear-gradient(90deg, #e2c97e, #60a5fa)", borderRadius: 6, transition: "width 0.5s" }} />
              </div>
              <div style={{ marginTop: 8, fontSize: 11, color: "#4a6080" }}>{collection.length - scored.length} game{collection.length - scored.length !== 1 ? "s" : ""} still unscored</div>
            </>, 0)}
          </div>

          {/* ── Collection growth + Shelf of Shame ── */}
          {byYearKeys.length > 0 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
              {card(<>
                {sectionTitle("Collection Growth by Buy Year")}
                <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 90 }}>
                  {byYearKeys.map(y => {
                    const count = byYearMap[y];
                    const max = Math.max(...Object.values(byYearMap), 1);
                    return (
                      <div key={y} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                        <div style={{ fontSize: 12, color: "#8899aa", fontFamily: "'DM Mono', monospace" }}>{count}</div>
                        <div style={{ width: "100%", height: Math.max((count / max) * 65, 4), background: "#60a5fa", borderRadius: "3px 3px 0 0" }} />
                        <div style={{ fontSize: 11, color: "#6b8199", fontFamily: "'DM Mono', monospace" }}>{y}</div>
                      </div>
                    );
                  })}
                </div>
              </>, 0)}
              {(()=> {
                const owned = collection.filter(g => migrateStatus(g).status.ownership === "owned");
                const unplayed = owned.filter(g => { const s = migrateStatus(g).status; return s.playStatus !== "played" && !s.hasPlayed; });
                const pct = owned.length ? Math.round(unplayed.length / owned.length * 100) : 0;
                return card(<>
                  {sectionTitle("Shelf of Shame")}
                  <div style={{ display: "flex", alignItems: "flex-end", gap: 20, marginBottom: 16 }}>
                    <div>
                      <div style={{ fontSize: 42, fontWeight: 700, color: "#f87171", fontFamily: "'DM Mono', monospace", lineHeight: 1 }}>{pct}%</div>
                      <div style={{ fontSize: 11, color: "#6b8199", marginTop: 4 }}>of owned games never played</div>
                    </div>
                    <div style={{ fontSize: 13, color: "#7a90a8", paddingBottom: 4 }}>
                      <span style={{ color: "#e2e8f0", fontWeight: 600 }}>{unplayed.length}</span> of {owned.length} owned
                    </div>
                  </div>
                  <div style={{ background: "#080f18", borderRadius: 6, height: 10, overflow: "hidden", marginBottom: 12 }}>
                    <div style={{ width: `${pct}%`, height: "100%", background: "linear-gradient(90deg, #f87171, #fb923c)", borderRadius: 6 }} />
                  </div>
                </>, 0);
              })()}
            </div>
          )}

          {/* ── Harshest & most generous ── */}
          {scored.length >= 3 && card(<>
            {sectionTitle("Harshest & Most Generous")}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
              <div>
                <div style={{ fontSize: 11, color: "#e2c97e", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10, fontWeight: 700 }}>Top 3</div>
                {top3.map((g) => (

                  <div style={{ fontSize: 10, color: "#3d526a", textTransform: "uppercase", letterSpacing: "0.08em", paddingBottom: 8, borderBottom: "1px solid #1a2535", textAlign: "center" }}>BGG</div>
                  <div style={{ fontSize: 10, color: "#3d526a", textTransform: "uppercase", letterSpacing: "0.08em", paddingBottom: 8, borderBottom: "1px solid #1a2535", textAlign: "center" }}>Diff</div>
                  {(() => {
                    const diffFiltered = bggDiffFilter
                      ? filtered.filter(g => {
                          const d = g.score - g.bggAvg;
                          if (bggDiffFilter === "higher")  return d > 0.5;
                          if (bggDiffFilter === "lower")   return d < -0.5;
                          return d >= -0.5 && d <= 0.5;
                        })
                      : filtered;
                    const rows = [...diffFiltered].sort((a,b) => Math.abs(b.score - b.bggAvg) - Math.abs(a.score - a.bggAvg));
                    const show = bggDiffFilter ? rows : rows.slice(0, 10);
                    return show.map(g => {
                      const diff = g.score - g.bggAvg;
                      const color = diff > 0.5 ? "#4ade80" : diff < -0.5 ? "#f87171" : "#60a5fa";

          {/* ── Spider chart ── */}
          {spiderGames.length > 0 && card(<>
            {sectionTitle(`Taste Profile — Advanced Scores (${spiderGames.length} games)`)}
            <div style={{ display: "flex", alignItems: "center", gap: 32 }}>
              <svg viewBox="0 0 200 200" width={180} height={180} style={{ flexShrink: 0 }}>

                  const pts = ADV_FIELDS.map((_, i) => spiderPoint(v, i, ADV_FIELDS.length, 100, 100, 80)).map(([x,y]) => `${x},${y}`).join(" ");
                  return <polygon key={v} points={pts} fill="none" stroke="#1a2535" strokeWidth="1" />;
                })}
                {/* Axis lines */}
                {ADV_FIELDS.map((_, i) => {
                  const [x, y] = spiderPoint(10, i, ADV_FIELDS.length, 100, 100, 80);
                  return <line key={i} x1="100" y1="100" x2={x} y2={y} stroke="#1a2535" strokeWidth="1" />;
                })}
                {/* Data polygon */}
                <polygon
                  points={spiderAvgs.map((v, i) => spiderPoint(v, i, ADV_FIELDS.length, 100, 100, 80).join(",")).join(" ")}
                  fill="#e2c97e22" stroke="#e2c97e" strokeWidth="2" />
                {/* Data points */}
                {spiderAvgs.map((v, i) => {
                  const [x, y] = spiderPoint(v, i, ADV_FIELDS.length, 100, 100, 80);

                {ADV_FIELDS.map((f, i) => {

                {ADV_FIELDS.map((f, i) => (
                  <div key={f.key} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>

                    <div style={{ flex: 1, background: "#080f18", borderRadius: 4, height: 6, overflow: "hidden" }}>
                      <div style={{ width: `${(spiderAvgs[i] / 10) * 100}%`, height: "100%", background: "#e2c97e", borderRadius: 4 }} />
                    </div>
                    <span style={{ width: 28, fontSize: 12, color: "#e2c97e", fontFamily: "'DM Mono', monospace", textAlign: "right" }}>{spiderAvgs[i].toFixed(1)}</span>

                ))}
              </div>
            </div>
          </>)}

          {/* ── Complexity & Playtime ── */}
          {(()=>{
            const withComplexity = collection.filter(g => g.complexity);
            const withTime = collection.filter(g => g.minPlaytime || g.maxPlaytime);
            if (!withComplexity.length && !withTime.length) return null;
            const avgComplexity = withComplexity.length ? (withComplexity.reduce((a,g) => a + g.complexity, 0) / withComplexity.length).toFixed(2) : null;
            const avgTime = withTime.length ? Math.round(withTime.reduce((a,g) => a + (g.maxPlaytime || g.minPlaytime), 0) / withTime.length) : null;
            // Complexity buckets 1-5
            const cBuckets = [1,2,3,4,5].map(n => ({ n, count: withComplexity.filter(g => Math.floor(g.complexity) === n || (n === 5 && g.complexity >= 4.5)).length }));
            const maxC = Math.max(...cBuckets.map(b => b.count), 1);
            const complexityLabels = ["1 Light","2","3 Medium","4","5 Heavy"];
            return (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
                {withComplexity.length > 0 && card(<>
                  {sectionTitle("Complexity Distribution")}
                  <div style={{ fontSize: 11, color: "#6b8199", marginBottom: 14 }}>Avg weight: <span style={{ color: "#e2c97e", fontWeight: 700 }}>{avgComplexity}</span> / 5</div>
                  <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 70 }}>
                    {cBuckets.map(({ n, count }) => (
                      <div key={n} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                        {count > 0 && <div style={{ fontSize: 11, color: "#8899aa", fontFamily: "'DM Mono', monospace" }}>{count}</div>}
                        <div style={{ width: "100%", height: Math.max((count / maxC) * 50, count > 0 ? 4 : 2), background: count > 0 ? "#60a5fa" : "#1a2535", borderRadius: "3px 3px 0 0" }} />
                        <div style={{ fontSize: 9, color: "#6b8199", textAlign: "center" }}>{complexityLabels[n-1]}</div>
                      </div>
                    ))}
                  </div>
                </>, 0)}
                {withTime.length > 0 && card(<>
                  {sectionTitle("Play Time")}
                  <div style={{ fontSize: 11, color: "#6b8199", marginBottom: 14 }}>Avg play time: <span style={{ color: "#e2c97e", fontWeight: 700 }}>{avgTime} min</span></div>
                  {[["< 30min", g => (g.maxPlaytime||g.minPlaytime) < 30],
                    ["30–60min", g => { const t = g.maxPlaytime||g.minPlaytime; return t >= 30 && t <= 60; }],
                    ["60–120min", g => { const t = g.maxPlaytime||g.minPlaytime; return t > 60 && t <= 120; }],
                    ["2–3h", g => { const t = g.maxPlaytime||g.minPlaytime; return t > 120 && t <= 180; }],
                    ["> 3h", g => (g.maxPlaytime||g.minPlaytime) > 180],
                  ].map(([label, fn]) => {
                    const count = withTime.filter(fn).length;
                    const pct = (count / withTime.length) * 100;
                    return (
                      <div key={label} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                        <span style={{ width: 60, fontSize: 11, color: "#6b8199", flexShrink: 0 }}>{label}</span>
                        <div style={{ flex: 1, background: "#080f18", borderRadius: 4, height: 7, overflow: "hidden" }}>
                          <div style={{ width: `${pct}%`, height: "100%", background: "#34d399", borderRadius: 4 }} />
                        </div>
                        <span style={{ width: 20, fontSize: 11, color: "#7a90a8", fontFamily: "'DM Mono', monospace", textAlign: "right", flexShrink: 0 }}>{count}</span>
                      </div>
                    );
                  })}
                </>, 0)}
              </div>
            );
          })()}

          {/* ── Categories, Mechanics, Designers ── */}
          {(()=>{
            const topN = (items, n = 8) => {
              const map = {};
              for (const g of collection) {
                const list = g[items] || [];
                const score = g.score;
                for (const item of list) {
                  if (!map[item]) map[item] = { count: 0, scores: [] };
                  map[item].count++;
                  if (score != null) map[item].scores.push(score);
                }
              }
              return Object.entries(map)
                .sort((a, b) => b[1].count - a[1].count)
                .slice(0, n)
                .map(([name, { count, scores }]) => ({
                  name,
                  count,
                  avg: scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : null,
                }));
            };
            const maxCount = (items) => Math.max(...items.map(i => i.count), 1);
            const renderList = (items, color) => {
              const max = maxCount(items);
              return items.map(({ name, count, avg }) => (
                <div key={name} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, color: "#e2e8f0", marginBottom: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{name}</div>
                    <div style={{ background: "#080f18", borderRadius: 3, height: 5, overflow: "hidden" }}>
                      <div style={{ width: `${(count/max)*100}%`, height: "100%", background: color, borderRadius: 3 }} />
                    </div>
                  </div>
                  <span style={{ fontSize: 11, color: "#6b8199", fontFamily: "'DM Mono', monospace", flexShrink: 0, width: 16, textAlign: "right" }}>{count}</span>
                  {avg && <span style={{ fontSize: 11, color: "#e2c97e", fontFamily: "'DM Mono', monospace", flexShrink: 0, width: 28, textAlign: "right" }}>⭐{avg}</span>}
                </div>
              ));
            };
            const cats = topN("categories"); const mechs = topN("mechanics"); const desgs = topN("designers", 6);
            if (!cats.length && !mechs.length && !desgs.length) return null;
            return (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 20, marginBottom: 20 }}>
                {cats.length > 0 && card(<>{sectionTitle("Top Categories")}{renderList(cats, "#c084fc")}</>, 0)}
                {mechs.length > 0 && card(<>{sectionTitle("Top Mechanics")}{renderList(mechs, "#fb923c")}</>, 0)}
                {desgs.length > 0 && card(<>{sectionTitle("Top Designers")}{renderList(desgs, "#60a5fa")}</>, 0)}
              </div>
            );
          })()}

        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────
    // ─── BGG token editor (MeepleLog Settings tab) ───────────────────────────
    function MlTokenEditor({ currentToken, onSaved }) {
      const [editing,    setEditing]    = React.useState(false);
      const [token,      setToken]      = React.useState(currentToken || "");
      const [validating, setValidating] = React.useState(false);
      const [error,      setError]      = React.useState(null);
      const [saved,      setSaved]      = React.useState(false);

      const save = async () => {
        setError(null); setSaved(false);
        if (!token.trim()) { setError("Enter a token."); return; }
        setValidating(true);
        const { valid, error: err } = await validateBggToken(token.trim());
        setValidating(false);
        if (!valid) { setError(`Could not validate: ${err}`); return; }
        await saveMlConfig({ bgg_token: token.trim() });
        onSaved(token.trim());
        setEditing(false); setSaved(true);
        setTimeout(() => setSaved(false), 3000);
      };
      const remove = async () => {
        await saveMlConfig({ bgg_token: null });
        onSaved(null); setToken(""); setEditing(false);
      };

      if (!editing) return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 200, background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "9px 14px", fontFamily: "'DM Mono', monospace", fontSize: 13, color: currentToken ? "#4a6080" : "#1e2d3d" }}>
            {currentToken ? "••••••••" + currentToken.slice(-6) : "No token — using public BGG API"}
          </div>
          <button onClick={() => { setToken(currentToken || ""); setEditing(true); setError(null); setSaved(false); }}
            style={{ background: "transparent", color: "#e2c97e", border: "1px solid #e2c97e44", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}
            onMouseEnter={e => e.currentTarget.style.borderColor = "#e2c97e"}
            onMouseLeave={e => e.currentTarget.style.borderColor = "#e2c97e44"}>
            {currentToken ? "Change" : "Add token"}
          </button>
          {currentToken && <button onClick={remove} style={{ background: "transparent", color: "#f87171", border: "1px solid #f8717133", borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}>Remove</button>}
          {saved && <span style={{ color: "#4ade80", fontSize: 13 }}>✓ Saved</span>}
        </div>
      );

      return (
        <div>
          <input type="password" value={token} onChange={e => setToken(e.target.value)}
            onKeyDown={e => e.key === "Enter" && save()} placeholder="paste BGG token…" autoFocus
            style={{ width: "100%", background: "#080f18", border: "1px solid #1e2d3d", borderRadius: 8, padding: "10px 14px", color: "#e2e8f0", fontSize: 14, fontFamily: "'DM Mono', monospace", marginBottom: 10 }}
            onFocus={e => e.target.style.borderColor = "#e2c97e66"}
            onBlur={e => e.target.style.borderColor = "#1e2d3d"} />
          {error && <div style={{ color: "#f87171", fontSize: 12, marginBottom: 10 }}>{error}</div>}
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={save} disabled={validating}
              style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "9px 18px", cursor: validating ? "default" : "pointer", fontWeight: 700, fontSize: 13, opacity: validating ? 0.6 : 1 }}>
              {validating ? "Validating…" : "Save"}
            </button>
            <button onClick={() => { setEditing(false); setError(null); }}
              style={{ background: "transparent", color: "#7a90a8", border: "1px solid #1e2d3d", borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}>
              Cancel
            </button>
          </div>
        </div>
      );
    }

    // ─── BGG API key setup screen (first run) ─────────────────────────────────
    function BggApiKeySetup({ onSaved, onSkip }) {
      const [token,      setToken]      = React.useState("");
      const [validating, setValidating] = React.useState(false);
      const [error,      setError]      = React.useState(null);

      const save = async () => {
        setError(null);
        if (!token.trim()) { setError("Enter a BGG API token, or skip below."); return; }
        setValidating(true);
        const { valid, error: err } = await validateBggToken(token.trim());
        setValidating(false);
        if (!valid) { setError(`Could not validate: ${err}. You can skip and add it later in Settings.`); return; }
        await saveMlConfig({ bgg_token: token.trim() });
        onSaved(token.trim());
      };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #060d14 0%, #0d1825 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 18, padding: "40px 44px", width: 520, boxShadow: "0 40px 120px rgba(0,0,0,0.7)" }}>
            <div style={{ textAlign: "center", marginBottom: 28 }}>
              <div style={{ fontSize: 44, marginBottom: 6 }}>🎲</div>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 32, letterSpacing: "-0.02em", margin: 0 }}>
                <span style={{ color: "#e2c97e" }}>Meeple</span><span style={{ color: "#60a5fa" }}>Log</span>
              </h1>
              <div style={{ color: "#4a6080", fontSize: 13, fontStyle: "italic", marginTop: 4 }}>Your board game collection</div>
            </div>
            <h2 style={{ fontSize: 15, color: "#e2e8f0", marginBottom: 10, fontWeight: 600 }}>One-time setup</h2>
            <p style={{ color: "#7a90a8", fontSize: 13, lineHeight: 1.6, marginBottom: 6 }}>
              Add your BoardGameGeek API token to search and import games automatically.
            </p>
            <p style={{ color: "#4a6080", fontSize: 12, lineHeight: 1.6, marginBottom: 18 }}>
              Get a free token at <code style={{ background: "#080f18", padding: "1px 6px", borderRadius: 3, color: "#60a5fa", fontFamily: "'DM Mono', monospace" }}>boardgamegeek.com</code> → Account → Preferences → API Token.
            </p>
            <label style={{ display: "block", fontSize: 11, color: "#3d526a", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>BGG API Token</label>
            <input type="password" value={token} onChange={e => setToken(e.target.value)}
              onKeyDown={e => e.key === "Enter" && save()} placeholder="paste your token here…"
              style={{ width: "100%", background: "#080f18", border: "1px solid #1e2d3d", borderRadius: 10, padding: "11px 14px", color: "#e2e8f0", fontSize: 14, fontFamily: "'DM Mono', monospace" }}
              onFocus={e => e.target.style.borderColor = "#e2c97e66"}
              onBlur={e => e.target.style.borderColor = "#1e2d3d"} />
            {error && <div style={{ marginTop: 12, padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 13 }}>{error}</div>}
            <button onClick={save} disabled={validating}
              style={{ width: "100%", marginTop: 18, background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 10, padding: "12px 20px", cursor: validating ? "default" : "pointer", fontWeight: 700, fontSize: 14, opacity: validating ? 0.6 : 1 }}>
              {validating ? "Validating…" : "Save & start logging"}
            </button>
            <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "20px 0 16px" }}>
              <div style={{ flex: 1, height: 1, background: "#1a2535" }} />
              <span style={{ fontSize: 10, color: "#3d526a", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>or</span>
              <div style={{ flex: 1, height: 1, background: "#1a2535" }} />
            </div>
            <button onClick={() => { saveMlConfig({ bgg_token: null }); onSkip(); }}
              style={{ width: "100%", background: "transparent", color: "#7a90a8", border: "1px solid #1e2d3d", borderRadius: 10, padding: "11px 20px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "#3d526a"; e.currentTarget.style.color = "#94a3b8"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "#1e2d3d"; e.currentTarget.style.color = "#7a90a8"; }}>
              Skip — add token later in Settings
            </button>
          </div>
        </div>
      );
    }

    function App({ logoSlot }) {
      const [bggToken,       setBggToken]       = useState(null);
      const [setupDone,      setSetupDone]      = useState(false);
      const [collection,     setCollection]     = useState([]);
      const [customSubcolls, setCustomSubcolls] = useState([]);
      const [activeSubcoll,  setActiveSubcoll]  = useState("all");
      const [showSearch,     setShowSearch]     = useState(false);

      useEffect(() => {
        (async () => {
          try {
            const [col, subcollData, cfg] = await Promise.all([
              loadCollection(),
              _sb.from("ml_subcollections").select("data").eq("user_id", _sbUser.id).single(),
              loadMlConfig(),
            ]);
            setCollection(col);
            setSubcollections(subcollData.data?.data || []);
            setBggToken(cfg.bgg_token || null);
            setSetupDone(cfg.bgg_token !== undefined);
          } catch(e) { console.error("ML load error:", e); }
          finally { setMlLoading(false); }
        })();
      }, []);
      const [searchAsWishlist, setSearchAsWishlist] = useState(false);
      const [showExport,     setShowExport]     = useState(false);
      const [selectedEntry,  setSelectedEntry]  = useState(null);
      const [sortBy,         setSortBy]         = useState("name");
      const [sortDir,        setSortDir]        = useState("asc");
      const [filterQ,        setFilterQ]        = useState("");
      const [activeTab,      setActiveTab]      = useState("collection");
      const [newSubcollName, setNewSubcollName] = useState("");
      const [renamingId,     setRenamingId]     = useState(null);
      const [renameVal,      setRenameVal]      = useState("");
      const [confirmDelete,  setConfirmDelete]  = useState(null);
      const [statusFilter,   setStatusFilter]   = useState(null); // null | "owned" | "played"
      const [activeWishlistTag, setActiveWishlistTag] = useState(null);
      const [newWishlistTag, setNewWishlistTag]   = useState("");

      useEffect(() => {
        setCollection(loadCollection());
        setCustomSubcolls(loadSubcollections());
      }, []);

      const isFirstRender = useRef(true);
      useEffect(() => {
        if (isFirstRender.current) { isFirstRender.current = false; return; }
        saveCollection(collection);
      }, [collection]);

      useEffect(() => {
        saveSubcollections(customSubcolls);
      }, [customSubcolls]);

      const addGame        = (game)  => setCollection((c) => {
        const idx = c.findIndex(g => g.id === game.id);
        if (idx === -1) return [game, ...c];
        // Upsert — merge full details into existing placeholder
        const updated = [...c];
        updated[idx] = { ...updated[idx], ...game };
        return updated;
      });
      const saveEntry      = (updated) => { setCollection((c) => c.map((g) => g.id === updated.id ? updated : g)); setSelectedEntry(null); };
      const deleteEntry    = (id) => {
        setCollection((c) => c.filter((g) => g.id !== id));
        setCustomSubcolls((cs) => cs.map(sc => ({ ...sc, gameIds: sc.gameIds.filter(gid => gid !== id) })));
        setSelectedEntry(null);
      };
      const [refreshing, setRefreshing] = useState(false);
      const [refreshProgress, setRefreshProgress] = useState(null);

      const handleImport = (games, mode) => {
        if (mode === "replace") { setCollection(games); return; }
        setCollection((cur) => {
          const map = new Map(cur.map(g => [g.id, g]));
          for (const g of games) if (!map.has(g.id)) map.set(g.id, g);
          return Array.from(map.values());
        });
      };

      const refreshAllFromBGG = async () => {
        const toFetch = collection.filter(g => !g.id.startsWith("custom-"));
        if (!toFetch.length) return;
        setRefreshing(true);
        setRefreshProgress(0);
        for (let i = 0; i < toFetch.length; i += 20) {
          const batch = toFetch.slice(i, i + 20);
          try {
            const ids = batch.map(g => g.id).join(",");
            const xml = await bggRequest(`/thing?id=${ids}&stats=1&type=boardgame,boardgameexpansion`);
            setCollection(cur => cur.map(g => {
              const blockM = xml.match(new RegExp(`<item[^>]+id="${g.id}"[^>]*>[\\s\\S]*?<\\/item>`, "i"));
              if (!blockM) return g;
              return { ...g, ...parseThingItem(blockM[0], g) };
            }));
          } catch(e) { console.warn("Refresh batch error:", e); }
          setRefreshProgress(Math.round(((i + 20) / toFetch.length) * 100));
          if (i + 20 < toFetch.length) await new Promise(r => setTimeout(r, 400));
        }
        setRefreshing(false);
        setRefreshProgress(null);
      };

      // Subcollection CRUD
      const createSubcoll = () => {
        const name = newSubcollName.trim();
        if (!name) return;
        const id = "custom_" + Date.now();
        setCustomSubcolls(cs => [...cs, { id, name, gameIds: [] }]);
        setNewSubcollName("");
        setActiveSubcoll(id);
      };
      const renameSubcoll = (id) => {
        const val = renameVal.trim();
        if (val) setCustomSubcolls(cs => cs.map(sc => sc.id === id ? { ...sc, name: val } : sc));
        setRenamingId(null);
      };
      const deleteSubcoll = (id) => {
        setCustomSubcolls(cs => cs.filter(sc => sc.id !== id));
        if (activeSubcoll === id) setActiveSubcoll("all");
        setConfirmDelete(null);
      };
      const toggleGameInSubcoll = (subcollId, gameId) => {
        setCustomSubcolls(cs => cs.map(sc => {
          if (sc.id !== subcollId) return sc;
          const has = sc.gameIds.includes(gameId);
          return { ...sc, gameIds: has ? sc.gameIds.filter(id => id !== gameId) : [...sc.gameIds, gameId] };
        }));
      };

      // Filtering
      const builtinFns = {
        all:            (g) => migrateStatus(g).status.ownership !== "plan_to_buy",
        shelf_of_shame: (g) => { const s = migrateStatus(g).status; return s.ownership === "owned" && s.playStatus !== "played" && !s.hasPlayed; },
        wishlist:       (g) => migrateStatus(g).status.ownership === "plan_to_buy",
        base_game:      (g) => !g.isExpansion && migrateStatus(g).status.ownership !== "plan_to_buy",
        expansion:      (g) => !!g.isExpansion && migrateStatus(g).status.ownership !== "plan_to_buy",
        have_played:    (g) => { const s = migrateStatus(g).status; return (s.playStatus === "played" || s.hasPlayed) && s.ownership !== "plan_to_buy"; },
        owned:          (g) => migrateStatus(g).status.ownership === "owned",
        plan_to_buy:    (g) => migrateStatus(g).status.ownership === "plan_to_buy",
      };
      const activeCustom = customSubcolls.find(s => s.id === activeSubcoll);
      const activeIds    = activeCustom ? new Set(activeCustom.gameIds) : null;

      const showStatusFilter = activeSubcoll === "base_game" || activeSubcoll === "expansion";
      const isWishlistView   = activeSubcoll === "wishlist";

      // All tags across wishlist games, sorted by frequency
      const allWishlistTags = React.useMemo(() => {
        const counts = {};
        collection.filter(g => migrateStatus(g).status.ownership === "plan_to_buy").forEach(g => {
          (g.wishlistTags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
        });
        return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([t]) => t);
      }, [collection]);

      React.useEffect(() => {
        if (!showStatusFilter) setStatusFilter(null);
      }, [activeSubcoll]);

      React.useEffect(() => {
        if (!isWishlistView) setActiveWishlistTag(null);
      }, [activeSubcoll]);

      let filtered = collection.filter((g) => {
        if (builtinFns[activeSubcoll]) return builtinFns[activeSubcoll](g);
        const sc = customSubcolls.find(s => s.id === activeSubcoll);
        return sc ? sc.gameIds.includes(g.id) : true;
      }).filter((g) => !filterQ || g.name.toLowerCase().includes(filterQ.toLowerCase()))
        .filter((g) => {
          if (!showStatusFilter || !statusFilter) return true;
          const s = migrateStatus(g).status;
          if (statusFilter === "owned")  return s.ownership === "owned";
          if (statusFilter === "played") return s.playStatus === "played" || s.hasPlayed;
          return true;
        })
        .filter((g) => {
          if (!isWishlistView || !activeWishlistTag) return true;
          return (g.wishlistTags || []).includes(activeWishlistTag);
        });

      filtered = [...filtered].sort((a, b) => {
        let cmp = 0;
        if (sortBy === "name")    cmp = a.name.localeCompare(b.name);
        if (sortBy === "score")   cmp = (a.score || 0) - (b.score || 0);
        if (sortBy === "buyYear") cmp = (a.buyYear || 0) - (b.buyYear || 0);
        if (sortBy === "year")    cmp = parseInt(a.year) - parseInt(b.year);
        if (sortBy === "bgg")     cmp = (b.bggRank ? 1/b.bggRank : 0) - (a.bggRank ? 1/a.bggRank : 0);
        return sortDir === "asc" ? cmp : -cmp;
      });

      const subcollCount = (id) => {
        if (builtinFns[id]) return collection.filter(builtinFns[id]).length;
        const sc = customSubcolls.find(s => s.id === id);
        return sc ? sc.gameIds.length : 0;
      };


      const BUILTINS = [
        { id: "all",            label: "All" },
        { id: "shelf_of_shame", label: "Shelf of Shame" },
        { id: "wishlist",       label: "Wishlist" },
        { id: "base_game",      label: "Base Games" },
        { id: "expansion",      label: "Expansions" },
        { id: "have_played",    label: "Have Played" },
        { id: "owned",          label: "Owned" },
      ];

      if (mlLoading) return (
        <div style={{ minHeight: "100vh", background: "#060d14", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ color: "#3d526a", fontSize: 14 }}>Loading collection…</div>
        </div>
      );

      if (!setupDone) return (
        <BggApiKeySetup
          onSaved={token => { setBggToken(token); setSetupDone(true); }}
          onSkip={() => setSetupDone(true)}
        />
      );

      return (
        <div style={{ minHeight: "100vh", background: "#060d14" }}>

          {/* ── Nav ── */}
          <nav style={{ background: "#080f18", borderBottom: "1px solid #1a2535", padding: "0 28px", display: "flex", alignItems: "center", height: 58, position: "sticky", top: 0, zIndex: 100 }}>
            {logoSlot}
            <div style={{ display: "flex", gap: 2 }}>
              {[["collection","Collection"],["stats","Stats"],["settings","Settings"]].map(([key, label]) => (
                <button key={key} onClick={() => setActiveTab(key)}
                  style={{ background: "none", border: "none", padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600, color: activeTab === key ? "#e2c97e" : "#3d526a", borderRadius: 6 }}>
                  {label}
                </button>
              ))}
            </div>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ color: "#3d526a", fontSize: 13 }}>{collection.filter(g => migrateStatus(g).status.ownership !== "plan_to_buy").length} in collection</span>
              {refreshing && (
                <span style={{ fontSize: 12, color: "#60a5fa" }}>🔄 Refreshing… {refreshProgress}%</span>
              )}
              {!refreshing && collection.some(g => !g.id.startsWith("custom-")) && (
                <button onClick={refreshAllFromBGG}
                  style={{ background: "transparent", color: "#4a6080", border: "1px solid #1a2535", borderRadius: 8, padding: "7px 14px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}
                  onMouseEnter={(e) => { e.currentTarget.style.borderColor = "#60a5fa"; e.currentTarget.style.color = "#60a5fa"; }}
                  onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#1a2535"; e.currentTarget.style.color = "#4a6080"; }}
                  title="Re-fetch images, players, playtime, complexity, categories and mechanics for all games">
                  ↻ Refresh from BGG
                </button>
              )}
              <button onClick={() => setShowExport(true)}
                style={{ background: "transparent", color: "#60a5fa", border: "1px solid #1e3a5f", borderRadius: 8, padding: "7px 14px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#60a5fa"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#1e3a5f"}>
                ⬆ Export / Import
              </button>
              <button onClick={() => { setSearchAsWishlist(false); setShowSearch(true); }}
                style={{ background: "transparent", color: "#e2c97e", border: "1px solid #e2c97e44", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}
                onMouseEnter={(e) => (e.currentTarget.style.borderColor = "#e2c97e")}
                onMouseLeave={(e) => (e.currentTarget.style.borderColor = "#e2c97e44")}>
                + Add to Collection
              </button>
              <button onClick={() => { setSearchAsWishlist(true); setShowSearch(true); }}
                style={{ background: "transparent", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}
                onMouseEnter={(e) => (e.currentTarget.style.borderColor = "#c084fc")}
                onMouseLeave={(e) => (e.currentTarget.style.borderColor = "#c084fc44")}>
                + Add to Wishlist
              </button>
            </div>
          </nav>

          {/* ── Body ── */}
          {activeTab === "settings" ? (
            <main style={{ maxWidth: 720, margin: "0 auto", padding: "36px 28px 60px" }}>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 28, color: "#e2c97e", marginBottom: 28 }}>Settings</h1>
              <section style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 14, padding: "24px 28px", marginBottom: 20 }}>
                <h2 style={{ fontSize: 14, color: "#94a3b8", fontWeight: 700, marginBottom: 16, textTransform: "uppercase", letterSpacing: "0.07em" }}>BoardGameGeek API Token</h2>
                <p style={{ color: "#4a6080", fontSize: 13, lineHeight: 1.6, marginBottom: 16 }}>
                  Your personal BGG token for searching and importing games. Get one at <code style={{ background: "#080f18", padding: "1px 6px", borderRadius: 3, color: "#60a5fa", fontFamily: "'DM Mono', monospace" }}>boardgamegeek.com</code> → Account → Preferences → API Token.
                </p>
                <MlTokenEditor currentToken={bggToken} onSaved={t => setBggToken(t)} />
              </section>

              <section style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 14, padding: "24px 28px", marginBottom: 20 }}>
                <h2 style={{ fontSize: 14, color: "#94a3b8", fontWeight: 700, marginBottom: 16, textTransform: "uppercase", letterSpacing: "0.07em" }}>Backup &amp; Import</h2>
                <p style={{ color: "#4a6080", fontSize: 13, lineHeight: 1.6, marginBottom: 16 }}>Export your full collection to CSV or XML, or restore from a backup.</p>
                <button onClick={() => setShowExport(true)}
                  style={{ background: "transparent", color: "#60a5fa", border: "1px solid #1e3a5f", borderRadius: 8, padding: "9px 18px", cursor: "pointer", fontWeight: 600, fontSize: 13 }}
                  onMouseEnter={(e) => e.currentTarget.style.borderColor = "#60a5fa"}
                  onMouseLeave={(e) => e.currentTarget.style.borderColor = "#1e3a5f"}>
                  ⬆ Export / Import
                </button>
              </section>
              <section style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 14, padding: "24px 28px" }}>
                <h2 style={{ fontSize: 14, color: "#94a3b8", fontWeight: 700, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.07em" }}>Collection</h2>
                <div style={{ fontSize: 13, color: "#4a6080", fontFamily: "'DM Mono', monospace", lineHeight: 2 }}>
                  <div>{collection.filter(g => migrateStatus(g).status.ownership !== "plan_to_buy").length} games in collection</div>
                  <div>{collection.filter(g => migrateStatus(g).status.ownership === "plan_to_buy").length} on wishlist</div>
                  <div style={{ marginTop: 8, fontSize: 11, color: "#1e2d3d" }}>Synced to Supabase ·  {_sbUser.email}</div>
                </div>
              </section>
            </main>
          ) : activeTab === "stats" ? (
            <main style={{ maxWidth: 1320, margin: "0 auto", padding: "28px 28px 60px" }}>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, color: "#e2c97e", marginBottom: 24 }}>Your Stats</h1>
              <StatsPanel collection={collection} />
            </main>
          ) : (
            <div style={{ display: "flex", minHeight: "calc(100vh - 58px)" }}>

              {/* ── Sidebar ── */}
              <aside style={{ width: 210, flexShrink: 0, background: "#080f18", borderRight: "1px solid #0f1923", padding: "20px 0", display: "flex", flexDirection: "column", gap: 1, position: "sticky", top: 58, height: "calc(100vh - 58px)", overflowY: "auto" }}>

                {/* All */}
                {(()=>{ const active = activeSubcoll === "all"; return (
                  <button onClick={() => setActiveSubcoll("all")}
                    style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px", padding: "8px 12px", borderRadius: 8, border: "none", cursor: "pointer", background: active ? "#e2c97e18" : "transparent", color: active ? "#e2c97e" : "#7a90a8", fontSize: 13, fontWeight: active ? 700 : 500, textAlign: "left" }}
                    onMouseEnter={e => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                    onMouseLeave={e => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                    <span>All</span>
                    <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.55 }}>{collection.filter(g => migrateStatus(g).status.ownership !== "plan_to_buy").length}</span>
                  </button>
                );})()}
                {(()=>{ const active = activeSubcoll === "shelf_of_shame"; const count = subcollCount("shelf_of_shame"); return (
                  <button onClick={() => setActiveSubcoll("shelf_of_shame")}
                    style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px", padding: "8px 12px", borderRadius: 8, border: "none", cursor: "pointer", background: active ? "#f8717118" : "transparent", color: active ? "#f87171" : "#7a90a8", fontSize: 13, fontWeight: active ? 700 : 500, textAlign: "left" }}
                    onMouseEnter={e => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                    onMouseLeave={e => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                    <span>Shelf of Shame</span>
                    <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.55 }}>{count}</span>
                  </button>
                );})()}
                {(()=>{ const active = activeSubcoll === "wishlist"; const count = subcollCount("wishlist"); return (
                  <button onClick={() => setActiveSubcoll("wishlist")}
                    style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px", padding: "8px 12px", borderRadius: 8, border: "none", cursor: "pointer", background: active ? "#c084fc18" : "transparent", color: active ? "#c084fc" : "#7a90a8", fontSize: 13, fontWeight: active ? 700 : 500, textAlign: "left" }}
                    onMouseEnter={e => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                    onMouseLeave={e => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                    <span>Wishlist</span>
                    <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.55 }}>{count}</span>
                  </button>
                );})()}

                {/* Type subcollections — indented */}
                <div style={{ padding: "10px 12px 4px 16px", fontSize: 10, color: "#2d3f55", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Type</div>
                {[
                  { id: "base_game",  label: "Base Games" },
                  { id: "expansion",  label: "Expansions" },
                ].map(({ id, label }) => {
                  const active = activeSubcoll === id;
                  return (
                    <button key={id} onClick={() => setActiveSubcoll(id)}

    // ─── PlotTwist module ─────────────────────────────────────────────────────

    const listsByBook = (lists) => {

      }
      return m;
    };

    function collectionToCSV(library, lists) {
      const lookup = listsByBook(lists);
      const esc = (v) => {
        const s = v == null ? "" : String(v);
        return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const rows = [CSV_FIELDS.join(",")];
      for (const b of library) {
        const m = migrateStatus(b);
        rows.push([
          esc(b.id),
          esc(b.title),
          esc((b.authors || []).join("; ")),
          esc(b.year ?? ""),
          b.pageCount ?? "",
          esc(b.language ?? ""),
          esc(b.publisher ?? ""),
          esc(b.isbn13 ?? ""),
          esc(b.isbn10 ?? ""),

          esc(b.startDate ?? ""),
          esc(b.endDate ?? ""),
          b.price ?? "",
          esc(b.notes ?? ""),
          esc((b.categories || []).join("; ")),
          esc(b.advScores ? JSON.stringify(b.advScores) : ""),
          esc(b.addedAt ?? ""),
          esc((lookup[b.id] || []).join("; ")),
        ].join(","));
      }
      return rows.join("\n");
    }

    function collectionToXML(library, lists) {
      const lookup = listsByBook(lists);
      const esc = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      const escCDATA = (v) => `<![CDATA[${String(v ?? "").replace(/]]>/g, "]]]]><![CDATA[>")}]]>`;
      const out = [
        '<?xml version="1.0" encoding="UTF-8"?>',
        `<plottwist exported="${new Date().toISOString()}" count="${library.length}" listCount="${(lists || []).length}">`,
        '  <books>'
      ];
      for (const b of library) {
        const m = migrateStatus(b);
        out.push("    <book>");
        out.push(`      <id>${esc(b.id)}</id>`);
        out.push(`      <title>${esc(b.title)}</title>`);
        if (b.subtitle)      out.push(`      <subtitle>${esc(b.subtitle)}</subtitle>`);
        out.push(`      <authors>${esc((b.authors || []).join("; "))}</authors>`);
        if (b.year)          out.push(`      <year>${esc(b.year)}</year>`);
        if (b.pageCount)     out.push(`      <pageCount>${b.pageCount}</pageCount>`);
        if (b.language)      out.push(`      <language>${esc(b.language)}</language>`);
        if (b.publisher)     out.push(`      <publisher>${esc(b.publisher)}</publisher>`);
        if (b.isbn13)        out.push(`      <isbn13>${esc(b.isbn13)}</isbn13>`);
        if (b.isbn10)        out.push(`      <isbn10>${esc(b.isbn10)}</isbn10>`);
        out.push(`      <reading_status>${esc(m.status.reading)}</reading_status>`);
        out.push(`      <ownership>${esc(m.status.ownership)}</ownership>`);
        if (b.rating != null)    out.push(`      <rating>${b.rating}</rating>`);
        if (b.startDate)         out.push(`      <startDate>${esc(b.startDate)}</startDate>`);
        if (b.endDate)           out.push(`      <endDate>${esc(b.endDate)}</endDate>`);
        if (b.price != null)     out.push(`      <price>${b.price}</price>`);
        if (b.notes)             out.push(`      <notes>${escCDATA(b.notes)}</notes>`);
        if (b.description)       out.push(`      <description>${escCDATA(b.description)}</description>`);
        if ((b.categories || []).length) out.push(`      <categories>${esc(b.categories.join("; "))}</categories>`);
        if (b.advScores)         out.push(`      <advScores>${escCDATA(JSON.stringify(b.advScores))}</advScores>`);
        if (b.image)             out.push(`      <image>${escCDATA(b.image)}</image>`);
        if (b.addedAt)           out.push(`      <addedAt>${esc(b.addedAt)}</addedAt>`);
        const inLists = lookup[b.id];
        if (inLists && inLists.length) out.push(`      <lists>${esc(inLists.join("; "))}</lists>`);
        out.push("    </book>");

      out.push("  <lists>");

        out.push(`    <list id="${esc(l.id)}" name="${esc(l.name)}" />`);

      const a    = document.createElement("a");

    // Parse a CSV row honoring quoted fields ("a, b" stays one cell).
    function parseCSVRow(line) {

        } else if (ch === ',' && !inQ) { out.push(cur); cur = ""; }

      return out;
    }

    // Parse a full CSV document into rows. Properly handles quoted fields
    // containing commas AND newlines (which can happen with notes that span
    // multiple lines). We tokenise the whole document as a character stream
    // instead of splitting by "\n" first.
    function parseCSVDocument(text) {
      const rows = []; let row = []; let cur = ""; let inQ = false;
      const src = text.replace(/\r\n/g, "\n");
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (ch === '"') {
          if (inQ && src[i+1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === ',' && !inQ) {
          row.push(cur); cur = "";
        } else if (ch === '\n' && !inQ) {
          row.push(cur); cur = "";
          // Skip empty rows
          if (!(row.length === 1 && row[0] === "")) rows.push(row);
          row = [];
        } else {
          cur += ch;
        }
      }
      // Flush trailing field/row
      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        if (!(row.length === 1 && row[0] === "")) rows.push(row);
      }
      return rows;
    }

    // Read back a row dict into an internal book + the names of lists it belongs to
    function rowToBook(row, headers) {
      const idx = (n) => headers.indexOf(n);
      const get = (n) => { const i = idx(n); return i < 0 ? "" : (row[i] ?? ""); };
      const num = (s) => { const n = parseFloat(s); return isNaN(n) ? null : n; };
      const intN = (s) => { const n = parseInt(s, 10); return isNaN(n) ? null : n; };
      const arrSemi = (s) => s ? s.split(";").map(x => x.trim()).filter(Boolean) : [];
      const reading   = get("reading_status") || "unread";
      const ownership = get("ownership") || "wanted";
      const adv = (() => { try { const v = get("advScores"); return v ? JSON.parse(v) : null; } catch { return null; } })();
      const id = get("id") || ("manual_" + uuid());
      return {
        book: {
          id,
          title:        get("title"),
          authors:      arrSemi(get("authors")),
          year:         get("year") || null,
          pageCount:    intN(get("pageCount")),
          language:     get("language") || null,
          publisher:    get("publisher") || null,
          isbn13:       get("isbn13") || null,
          isbn10:       get("isbn10") || null,
          status:       { reading, ownership },
          rating:       num(get("rating")),
          startDate:    get("startDate") || null,
          endDate:      get("endDate")   || null,
          price:        num(get("price")),
          notes:        get("notes")     || "",
          categories:   arrSemi(get("categories")),
          advScores:    adv,
          addedAt:      get("addedAt")   || new Date().toISOString(),
          // image not present in CSV — leave it undefined; existing data may be preserved on merge
        },
        listNames: arrSemi(get("lists")),
      };
    }

    function importFromCSV(text) {
      const rows = parseCSVDocument(text);
      if (rows.length < 2) return { books: [], listAssignments: {} };
      const headers = rows[0].map(h => h.trim());
      const books = []; const listAssignments = {};
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.every(c => c.trim() === "")) continue;
        const { book, listNames } = rowToBook(row, headers);
        if (!book.title) continue;
        books.push(book);
        if (listNames.length) listAssignments[book.id] = listNames;
      }
      return { books, listAssignments };
    }

    function importFromXML(text) {
      const parser = new DOMParser();
      const doc    = parser.parseFromString(text, "text/xml");
      const err    = doc.querySelector("parsererror");
      if (err) throw new Error("Invalid XML");
      const get    = (el, tag) => el.querySelector(tag)?.textContent ?? "";
      const num    = (s) => { const n = parseFloat(s); return isNaN(n) ? null : n; };
      const intN   = (s) => { const n = parseInt(s, 10); return isNaN(n) ? null : n; };
      const arrSemi = (s) => s ? s.split(";").map(x => x.trim()).filter(Boolean) : [];

      const books = []; const listAssignments = {};
      const bookEls = Array.from(doc.querySelectorAll("book"));
      for (const el of bookEls) {
        const id = get(el, "id") || ("manual_" + uuid());
        const reading   = get(el, "reading_status") || "unread";
        const ownership = get(el, "ownership") || "wanted";
        const adv = (() => { try { const v = get(el, "advScores"); return v ? JSON.parse(v) : null; } catch { return null; } })();
        const book = {
          id,
          title:        get(el, "title"),
          subtitle:     get(el, "subtitle") || null,
          authors:      arrSemi(get(el, "authors")),
          year:         get(el, "year") || null,
          pageCount:    intN(get(el, "pageCount")),
          language:     get(el, "language") || null,
          publisher:    get(el, "publisher") || null,
          isbn13:       get(el, "isbn13") || null,
          isbn10:       get(el, "isbn10") || null,
          status:       { reading, ownership },
          rating:       num(get(el, "rating")),
          startDate:    get(el, "startDate") || null,
          endDate:      get(el, "endDate")   || null,
          price:        num(get(el, "price")),
          notes:        get(el, "notes")     || "",
          description:  get(el, "description") || null,
          categories:   arrSemi(get(el, "categories")),
          advScores:    adv,
          image:        get(el, "image") || null,
          addedAt:      get(el, "addedAt") || new Date().toISOString(),
        };
        if (!book.title) continue;
        books.push(book);
        const ln = arrSemi(get(el, "lists"));
        if (ln.length) listAssignments[book.id] = ln;
      }
      return { books, listAssignments };
    }

    // Merge imported books into an existing library + lists.
    // mode = "merge"   → existing kept, imported overrides matching ids, new appended
    //        "replace" → existing wiped
    function applyImport({ books, listAssignments }, currentLibrary, currentLists, mode) {
      let library;
      if (mode === "replace") {
        library = books.slice();
      } else {
        const byId = Object.fromEntries(currentLibrary.map(b => [b.id, b]));
        for (const nb of books) {
          if (byId[nb.id]) {
            // Preserve existing image if the imported one is missing (CSV doesn't carry covers)
            byId[nb.id] = { ...byId[nb.id], ...nb, image: nb.image || byId[nb.id].image };
          } else {
            byId[nb.id] = nb;
          }
        }
        library = Object.values(byId);
      }

      // Rebuild lists. Lists are referenced by NAME in the export (not id), so we
      // map name → existing list (or create new ones).
      let lists;
      if (mode === "replace") {
        // Start fresh, then create lists from the import's assignments
        lists = [];
      } else {
        lists = currentLists.map(l => ({ ...l, bookIds: l.bookIds.slice() }));
      }
      const findOrCreateList = (name) => {
        let l = lists.find(x => x.name === name);
        if (!l) {
          l = { id: "list_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, bookIds: [] };
          lists.push(l);
        }
        return l;
      };
      for (const [bookId, names] of Object.entries(listAssignments)) {
        for (const n of names) {
          const l = findOrCreateList(n);
          if (!l.bookIds.includes(bookId)) l.bookIds.push(bookId);
        }
      }
      // Drop list memberships that point to non-existent books (cleanup)
      const validIds = new Set(library.map(b => b.id));
      lists = lists.map(l => ({ ...l, bookIds: l.bookIds.filter(id => validIds.has(id)) }));

      return { library, lists };
    }


    // ─── Profiles index ──────────────────────────────────────────────────────
    const loadProfiles = async () => {
      const { data } = await _sb.from("pt_profiles").select("data").eq("user_id", _sbUser.id).single();
      return (data && data.data) ? data.data : [];

    const saveProfiles = async (profiles) => {
      await _sb.from("pt_profiles").upsert({ user_id: _sbUser.id, data: profiles }, { onConflict: "user_id" });
    };
    const deleteProfileData = async (profileId) => {
      await Promise.all([
        _sb.from("pt_library").delete().eq("user_id", _sbUser.id).eq("profile_id", profileId),
        _sb.from("pt_lists").delete().eq("user_id", _sbUser.id).eq("profile_id", profileId),
      ]);

    // (legacy NW.js migration removed for web build)

    // Normalize status for older records — two-axis model:
    //   reading:   "unread" | "reading"  | "read"
    //   ownership: "owned"  | "not_owned" | "wanted"
    //
    // ownership values:
    //   - owned     : you have a copy
    //   - wanted    : you don't have it but you'd like to (Wishlist)
    //   - not_owned : you don't have it and have no plans to. Useful for read
    //                 books you don't own (borrowed, library, sold, gifted away,
    //                 read but didn't want to keep).
    //
    // Legacy v0.2 migration:
    //   status.reading === "wishlist" → { reading: "unread",  ownership: "wanted" }
    //   status.reading === "reading"  → { reading: "reading", ownership: "owned"  }
    //   status.reading === "read"     → { reading: "read",    ownership: "owned"  }
    const migrateStatus = (b) => {
      if (!b) return b;
      const s = b.status;
      const validOwnership = ["owned", "wanted", "not_owned"];
      const validReading   = ["unread", "reading", "read", "onhold"];
      // Already in current format
      if (s && typeof s === "object" && validReading.includes(s.reading) && validOwnership.includes(s.ownership)) {
        return b;
      }
      // Legacy v0.2 → new
      let reading = "unread", ownership = "wanted";
      if (s && typeof s === "object") {
        if (s.reading === "reading") { reading = "reading"; ownership = "owned"; }
        else if (s.reading === "read") { reading = "read"; ownership = "owned"; }
        else if (s.reading === "wishlist") { reading = "unread"; ownership = "wanted"; }
      }
      return { ...b, status: { reading, ownership } };
    };

    // Given a book, return its effective "bucket" for filtering + badge.
    // Note: an unread+not_owned book is grouped with Wishlist (it's a book
    // you don't have, you just don't want it strongly). The Wishlist bucket
    // therefore covers all unread+non-owned regardless of intent.
    const effectiveBucket = (b) => {
      const s = migrateStatus(b).status;
      if (s.reading === "reading") return "reading";
      if (s.reading === "read")    return "read";
      if (s.reading === "onhold")  return "onhold";
      // reading === "unread"
      return s.ownership === "owned" ? "sleeping" : "wishlist";
    };

    // ─── Google Books API ─────────────────────────────────────────────────────
    const GB_BASE = "https://www.googleapis.com/books/v1/volumes";

    async function gbFetch(url) {
      const res = await fetch(url);
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`HTTP ${res.status}: ${body.slice(0, 200)}`);
      }
      return res.json();
    }

    // Upgrade Google Books cover URL from thumbnail (zoom=1, ~128px)
    // to medium (zoom=3, ~575px) — much sharper in the grid + modal.
    // Also strip &edge=curl which adds a fake page-curl artifact.
    //
    // Example:
    //   input:  books.google.com/books/content?id=X&printsec=frontcover&img=1&zoom=1&edge=curl
    //   output: books.google.com/books/content?id=X&printsec=frontcover&img=1&zoom=3
    const upgradeCoverUrl = (url) => {
      if (!url || typeof url !== "string") return url;
      // Only touch Google Books content URLs — leave user-pasted covers alone
      if (!/books\.google\.com\/books\/content/.test(url)) return url;
      let out = url.replace(/([?&])zoom=\d+/, "$1zoom=3");
      if (!/[?&]zoom=/.test(out)) out += (out.includes("?") ? "&" : "?") + "zoom=3";
      out = out.replace(/&edge=curl/g, "");
      return out;
    };

    // Google Books serves the same cover at different zoom levels but the numbering
    // is not monotonic: 6=~1280px, 4=~800px, 3=~575px, 2=~300px, 1=~128px, 5=~80px.
    // If the current size 404s, step down through what's likely to still exist.
    // We don't step UP (to 4/6) — if medium is missing, larger sizes almost never exist either.
    const COVER_FALLBACK_CHAIN = [3, 2, 1, 5];

    // Given a cover URL currently showing zoom=N, return the same URL at the next smaller
    // size in the chain, or null if we've exhausted the chain.
    const tryDowngradeCover = (url) => {
      if (!url || !/books\.google\.com\/books\/content/.test(url)) return null;
      const m = url.match(/[?&]zoom=(\d+)/);
      if (!m) return null;
      const current = parseInt(m[1], 10);
      const idx = COVER_FALLBACK_CHAIN.indexOf(current);
      // If current isn't in the chain (odd URL), start from the top
      const nextIdx = idx === -1 ? 0 : idx + 1;
      if (nextIdx >= COVER_FALLBACK_CHAIN.length) return null;
      return url.replace(/([?&])zoom=\d+/, `$1zoom=${COVER_FALLBACK_CHAIN[nextIdx]}`);
    };

    // Shared onError handler for all <img> covers — walks the fallback chain,
    // hides the img once exhausted so the parent's placeholder/background shows through.
    const handleCoverError = (e) => {
      const next = tryDowngradeCover(e.target.src);
      if (next) {
        e.target.src = next;
      } else {
        e.target.style.display = "none";
      }
    };

    // Normalize a Google Books volume → internal book entry
    function normalizeVolume(item) {
      const info = item.volumeInfo || {};
      const ids  = info.industryIdentifiers || [];
      const isbn13 = ids.find(i => i.type === "ISBN_13")?.identifier || null;
      const isbn10 = ids.find(i => i.type === "ISBN_10")?.identifier || null;
      // Prefer the largest size the API returned directly, then upgrade the URL via zoom param.
      // API only returns smallThumbnail and thumbnail in the LITE projection by default,
      // so we usually upgrade the thumbnail.
      let cover = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || null;
      if (cover) {
        cover = cover.replace(/^http:/, "https:");
        cover = upgradeCoverUrl(cover);
      }
      return {
        id:            item.id,                  // Google Books volume ID = canonical id
        googleBooksId: item.id,
        isbn13, isbn10,
        title:         info.title || "Untitled",
        subtitle:      info.subtitle || null,
        authors:       info.authors || [],
        publisher:     info.publisher || null,
        publishedDate: info.publishedDate || null,
        year:          (info.publishedDate || "").slice(0, 4) || null,
        pageCount:     info.pageCount || null,
        language:      info.language || null,
        categories:    info.categories || [],
        description:   info.description || null,
        image:         cover,
        avgRating:     info.averageRating || null,
        ratingsCount:  info.ratingsCount || null,
        infoLink:      info.infoLink || null,
      };
    }

    async function gbSearch(query, apiKey, { maxResults = 20, langRestrict = null } = {}) {
      if (!query || !query.trim()) return [];
      const params = new URLSearchParams({
        q: query.trim(),
        maxResults: String(maxResults),
        printType: "books",
        key: apiKey,
      });
      if (langRestrict) params.append("langRestrict", langRestrict);
      const data = await gbFetch(`${GB_BASE}?${params.toString()}`);
      return (data.items || []).map(normalizeVolume);
    }

    async function gbGetVolume(volumeId, apiKey) {
      const data = await gbFetch(`${GB_BASE}/${volumeId}?key=${apiKey}`);
      return normalizeVolume(data);
    }

    async function validateApiKey(key) {
      try {
        const res = await fetch(`${GB_BASE}?q=dune&maxResults=1&key=${key}`);
        if (res.status === 400 || res.status === 403) {
          const body = await res.json().catch(() => ({}));
          return { valid: false, error: body.error?.message || `HTTP ${res.status}` };
        }
        if (!res.ok) return { valid: false, error: `HTTP ${res.status}` };
        return { valid: true };
      } catch (e) {
        return { valid: false, error: e.message };
      }
    }

    // UUID helper for custom (manual) entries
    const uuid = () => "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });

    const todayISO = () => new Date().toISOString().slice(0, 10);

    // ─── SearchModal ──────────────────────────────────────────────────────────
    // Clean up an ISBN: strip spaces, hyphens, "ISBN" prefix; uppercase final X.
    // Returns cleaned digits/X (10 or 13 long) if valid, otherwise null.
    const normalizeISBN = (raw) => {
      if (!raw) return null;
      const cleaned = String(raw).replace(/[\s\-]/g, "").replace(/^ISBN[:\s]*/i, "").toUpperCase();
      if (/^\d{13}$/.test(cleaned)) return cleaned;
      if (/^\d{9}[\dX]$/.test(cleaned)) return cleaned;
      return null;
    };

    // ─── ManualBookForm ───────────────────────────────────────────────────────
