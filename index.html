<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060d14; color: #e2e8f0; font-family: 'DM Sans', sans-serif; }
    input, select, textarea { font-family: inherit; color-scheme: dark; outline: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a2535; border-radius: 3px; }
    select option { background: #0d1825; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ─── Error boundary ───────────────────────────────────────────────────────
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(e) { return { error: e }; }
      componentDidCatch(e, info) { console.error("TrackHub error:", e, info); }
      render() {
        if (this.state.error) return (
          <div style={{ minHeight: "100vh", background: "#060d14", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
            <div style={{ background: "#1a0a0a", border: "1px solid #5a2a30", borderRadius: 14, padding: "28px 32px", maxWidth: 640, width: "100%" }}>
              <div style={{ color: "#f87171", fontWeight: 700, fontSize: 16, marginBottom: 12 }}>Something went wrong</div>
              <pre style={{ color: "#f87171", fontSize: 12, whiteSpace: "pre-wrap", wordBreak: "break-all", fontFamily: "'DM Mono', monospace", opacity: 0.8 }}>
                {this.state.error.message}
              </pre>
              {this.state.error.stack && (
                <pre style={{ color: "#8baabf", fontSize: 12, whiteSpace: "pre-wrap", wordBreak: "break-all", fontFamily: "'DM Mono', monospace", marginTop: 12, maxHeight: 200, overflow: "auto" }}>
                  {this.state.error.stack}
                </pre>
              )}
              <div style={{ marginTop: 16, padding: "10px 14px", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 8, color: "#7a90a8", fontSize: 12, lineHeight: 1.6 }}>
                Please contact an admin if the error persists.
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button onClick={() => window.location.reload()} style={{ background: "#1a2535", border: "1px solid #8baabf", borderRadius: 8, padding: "8px 18px", color: "#94a3b8", cursor: "pointer", fontSize: 13 }}>Reload</button>
                <button onClick={() => window.location.href = "/"} style={{ background: "#1a2535", border: "1px solid #e2c97e44", borderRadius: 8, padding: "8px 18px", color: "#e2c97e", cursor: "pointer", fontSize: 13 }}>Go to main page</button>
              </div>
            </div>
          </div>
        );
        return this.props.children;
      }
    }

    // ─── Supabase client ──────────────────────────────────────────────────────
    const _sb = supabase.createClient(
      "https://kedjdmfmvrgdkyikgrqe.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZGpkbWZtdnJnZGt5aWtncnFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODkzOTcsImV4cCI6MjA5MzQ2NTM5N30.y4grDiMpPWi9KVdTJ8d_Rh06iwPZllUZiw0Vd0V1IDU"
    );
    // _sbUser is set after auth and accessed inside module IIFEs via closure
    let _sbUser = null;

    // ─── Module registry ──────────────────────────────────────────────────────
    const MODULE_REGISTRY = [
      { id: "meeplelog", label: "MeepleLog", icon: "🎲", accentA: "#e2c97e", accentB: "#60a5fa" },
      { id: "plottwist", label: "PlotTwist", icon: "📖", accentA: "#e2c97e", accentB: "#60a5fa" },
      { id: "spendlog",  label: "SpendLog",  icon: "💰", accentA: "#4ade80", accentB: "#22d3ee" },
    ];

    // ─── Auth helpers ─────────────────────────────────────────────────────────
    const toFakeEmail = (username) => `${username.toLowerCase().trim()}@trackhub.app`;
    const checkUsernameAvailable = async (username) => {
      const { data } = await _sb.from("user_profiles").select("username").eq("username", username.toLowerCase().trim()).single();
      return !data;
    };
    const createUserProfile = async (userId, username, email = null) => {
      await _sb.from("user_profiles").insert({ user_id: userId, username: username.toLowerCase().trim(), email });
    };
    const getUsernameForUser = async (userId) => {
      const { data } = await _sb.from("user_profiles").select("username").eq("user_id", userId).single();
      return data ? data.username : null;
    };

    // ─── Auth screen ──────────────────────────────────────────────────────────
    // Look up a user's real email by username (for login + password reset)
    const getEmailForUsername = async (username) => {
      const { data } = await _sb.from("user_profiles")
        .select("email")
        .eq("username", username.toLowerCase().trim())
        .single();
      // Fall back to fake email if no real email stored
      return (data && data.email) ? data.email : toFakeEmail(username);
    };

    function AuthScreen({ onAuth }) {
      const [mode,     setMode]     = useState("login");
      const [username, setUsername] = useState("");
      const [email,    setEmail]    = useState("");
      const [password, setPassword] = useState("");
      const [loading,  setLoading]  = useState(false);
      const [error,    setError]    = useState(null);
      const [info,     setInfo]     = useState(null);

      const validate = () => {
        if (mode === "reset") {
          if (!username.trim()) { setError("Enter your username."); return false; }
          return true;
        }
        if (!username.trim()) { setError("Choose a username."); return false; }
        if (!/^[a-zA-Z0-9_-]{2,20}$/.test(username.trim())) { setError("Username: 2–20 chars, letters/numbers/_ or -"); return false; }
        if (!password) { setError("Enter a password."); return false; }
        if (mode === "signup" && password.length < 6) { setError("Password must be at least 6 characters."); return false; }
        if (mode === "signup" && email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) {
          setError("Enter a valid email address."); return false;
        }
        return true;
      };

      const handle = async () => {
        setError(null); setInfo(null);
        if (!validate()) return;
        setLoading(true);
        try {
          if (mode === "reset") {
            // Look up real email for this username, then send reset
            const userEmail = await getEmailForUsername(username);
            if (userEmail === toFakeEmail(username)) {
              // No real email stored — can't reset
              throw new Error("No email address on file for this username. Contact an admin to reset your password.");
            }
            const { error: e } = await _sb.auth.resetPasswordForEmail(userEmail, {
              redirectTo: window.location.origin,
            });
            if (e) throw e;
            setInfo("Password reset link sent! Check your email.");
          } else if (mode === "signup") {
            const available = await checkUsernameAvailable(username);
            if (!available) { setError("That username is already taken."); setLoading(false); return; }
            // Use real email if provided, otherwise fake email
            const authEmail = email.trim() ? email.trim().toLowerCase() : toFakeEmail(username);
            const { data, error: e } = await _sb.auth.signUp({ email: authEmail, password });
            if (e) throw e;
            // Store username + real email in profile
            await _sb.from("user_profiles").insert({
              user_id: data.user.id,
              username: username.toLowerCase().trim(),
              email: email.trim() ? email.trim().toLowerCase() : null,
            });
            _sbUser = data.user; onAuth(data.user);
          } else {
            // Login: look up their real email by username
            const authEmail = await getEmailForUsername(username);
            const { data, error: e } = await _sb.auth.signInWithPassword({ email: authEmail, password });
            if (e) { if (e.message.includes("Invalid login")) throw new Error("Incorrect username or password."); throw e; }
            _sbUser = data.user; onAuth(data.user);
          }
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const inputStyle = { width: "100%", background: "#080f18", border: "1px solid #7a90a8", borderRadius: 10, padding: "11px 14px", color: "#e2e8f0", fontSize: 14 };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #060d14 0%, #0d1825 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 18, padding: "40px 44px", width: 420, boxShadow: "0 40px 120px rgba(0,0,0,0.7)" }}>
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <div style={{ fontSize: 44, marginBottom: 8 }}>🗃️</div>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 30, letterSpacing: "-0.02em", margin: 0, color: "#e2e8f0" }}>TrackHub</h1>
              <div style={{ color: "#8baabf", fontSize: 13, fontStyle: "italic", marginTop: 4 }}>Your personal collection suite</div>
            </div>

            {mode !== "reset" && (
              <div style={{ display: "flex", gap: 4, marginBottom: 28, background: "#080f18", borderRadius: 10, padding: 4 }}>
                {[["login","Sign in"],["signup","Create account"]].map(([m, label]) => (
                  <button key={m} onClick={() => { setMode(m); setError(null); setInfo(null); }}
                    style={{ flex: 1, background: mode === m ? "#1a2535" : "transparent", border: "none", borderRadius: 8, padding: "8px 12px", cursor: "pointer", color: mode === m ? "#e2e8f0" : "#7a90a8", fontWeight: 600, fontSize: 13 }}>
                    {label}
                  </button>
                ))}
              </div>
            )}

            {mode === "reset" && (
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 15, color: "#e2e8f0", fontWeight: 600, marginBottom: 6 }}>Reset password</div>
                <div style={{ fontSize: 13, color: "#8baabf", lineHeight: 1.6 }}>Enter your username and we'll send a reset link to your registered email.</div>
              </div>
            )}

            <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>Username</label>
            <input type="text" value={username} onChange={e => setUsername(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handle()} placeholder="yourname"
              autoComplete="username" autoCapitalize="none" spellCheck={false}
              style={{ ...inputStyle, marginBottom: 14, fontFamily: "'DM Mono', monospace" }}
              onFocus={e => e.target.style.borderColor = "#e2c97e66"}
              onBlur={e => e.target.style.borderColor = "#7a90a8"} />

            {mode === "signup" && (
              <>
                <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                  Email <span style={{ color: "#7a90a8", textTransform: "none", fontSize: 12 }}>(optional — needed for password recovery)</span>
                </label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handle()} placeholder="you@example.com"
                  autoComplete="email"
                  style={{ ...inputStyle, marginBottom: 14 }}
                  onFocus={e => e.target.style.borderColor = "#e2c97e66"}
                  onBlur={e => e.target.style.borderColor = "#7a90a8"} />
              </>
            )}

            {mode !== "reset" && (
              <>
                <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handle()} placeholder="••••••••"
                  autoComplete={mode === "signup" ? "new-password" : "current-password"}
                  style={{ ...inputStyle, marginBottom: 20 }}
                  onFocus={e => e.target.style.borderColor = "#e2c97e66"}
                  onBlur={e => e.target.style.borderColor = "#7a90a8"} />
              </>
            )}

            {error && <div style={{ marginBottom: 16, padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 13 }}>{error}</div>}
            {info  && <div style={{ marginBottom: 16, padding: "10px 14px", background: "#0a1f0a", border: "1px solid #1a3d1a", borderRadius: 8, color: "#4ade80", fontSize: 13 }}>{info}</div>}

            <button onClick={handle} disabled={loading}
              style={{ width: "100%", background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 10, padding: "12px 20px", cursor: loading ? "default" : "pointer", fontWeight: 700, fontSize: 14, opacity: loading ? 0.6 : 1 }}>
              {loading ? "…" : mode === "login" ? "Sign in" : mode === "signup" ? "Create account" : "Send reset link"}
            </button>

            <div style={{ marginTop: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              {mode === "login" && (
                <button onClick={() => { setMode("reset"); setError(null); setInfo(null); }}
                  style={{ background: "none", border: "none", color: "#7a90a8", cursor: "pointer", fontSize: 12, padding: 0 }}
                  onMouseEnter={e => e.currentTarget.style.color = "#60a5fa"}
                  onMouseLeave={e => e.currentTarget.style.color = "#7a90a8"}>
                  Forgot password?
                </button>
              )}
              {mode === "reset" && (
                <button onClick={() => { setMode("login"); setError(null); setInfo(null); }}
                  style={{ background: "none", border: "none", color: "#7a90a8", cursor: "pointer", fontSize: 12, padding: 0 }}>
                  ← Back to sign in
                </button>
              )}
              {mode === "signup" && (
                <div style={{ fontSize: 12, color: "#7a90a8" }}>2–20 chars · letters, numbers, _ or -</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Shared profile system ───────────────────────────────────────────────
    const PROFILE_COLORS_SHELL = [
      { id: "gold",   value: "#e2c97e" }, { id: "blue",   value: "#60a5fa" },
      { id: "green",  value: "#4ade80" }, { id: "rose",   value: "#fb7185" },
      { id: "purple", value: "#a78bfa" }, { id: "orange", value: "#fb923c" },
      { id: "teal",   value: "#2dd4bf" }, { id: "slate",  value: "#94a3b8" },
    ];
    const profileColorOf = (cid) => (PROFILE_COLORS_SHELL.find(c => c.id === cid) || PROFILE_COLORS_SHELL[1]).value;

    const loadSharedProfiles = async () => {
      const { data } = await _sb.from("trackhub_profiles").select("*").eq("user_id", _sbUser.id).order("created_at");
      return data || [];
    };
    const saveSharedProfile = async (profile) => {
      await _sb.from("trackhub_profiles").upsert({ user_id: _sbUser.id, ...profile }, { onConflict: "user_id,id" });
    };
    const deleteSharedProfile = async (profileId) => {
      await _sb.from("trackhub_profiles").delete().eq("user_id", _sbUser.id).eq("id", profileId);
    };
    const saveShellActiveProfile = async (profileId) => {
      await _sb.from("ml_config").upsert({ user_id: _sbUser.id, active_profile_id: profileId }, { onConflict: "user_id" });
    };
    const loadShellActiveProfile = async () => {
      const { data } = await _sb.from("ml_config").select("active_profile_id").eq("user_id", _sbUser.id).single();
      return data?.active_profile_id || null;
    };

    function ShellProfilePicker({ profiles, activeProfileId, onSelect, onCreate, onDelete }) {
      const [creating,   setCreating]   = useState(profiles.length === 0);
      const [newName,    setNewName]    = useState("");
      const [colorId,    setColorId]    = useState("blue");
      const [confirmDel, setConfirmDel] = useState(null);
      const create = () => {
        const name = newName.trim(); if (!name) return;
        onCreate({ id: "profile_" + Date.now(), name, color: colorId });
        setNewName(""); setColorId("blue"); setCreating(false);
      };
      return (
        <div>
          {profiles.length > 0 && (
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center", marginBottom: 18 }}>
              {profiles.map(p => {
                const color = profileColorOf(p.color); const isActive = p.id === activeProfileId;
                return (
                  <div key={p.id} style={{ textAlign: "center" }}>
                    <button onClick={() => onSelect(p.id)}
                      style={{ width: 52, height: 52, borderRadius: "50%", background: color + "22", border: `2px solid ${isActive ? color : color + "44"}`, color, fontWeight: 700, fontSize: 20, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {p.name.charAt(0).toUpperCase()}
                    </button>
                    <div style={{ fontSize: 12, color: isActive ? color : "#8baabf", marginTop: 5, fontWeight: isActive ? 700 : 400 }}>{p.name}</div>
                    {profiles.length > 1 && (
                      <button onClick={() => setConfirmDel(p.id)} style={{ background: "none", border: "none", color: "#7a90a8", cursor: "pointer", fontSize: 12, marginTop: 2 }}
                        onMouseEnter={e => e.currentTarget.style.color = "#f87171"} onMouseLeave={e => e.currentTarget.style.color = "#7a90a8"}>remove</button>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          {confirmDel && (
            <div style={{ background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 10, padding: "12px 16px", marginBottom: 14, fontSize: 13, color: "#f87171" }}>
              Remove "{profiles.find(p => p.id === confirmDel)?.name}"? All their data will be deleted.
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button onClick={() => { onDelete(confirmDel); setConfirmDel(null); }} style={{ background: "#f87171", color: "#0f172a", border: "none", borderRadius: 6, padding: "5px 12px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>Remove</button>
                <button onClick={() => setConfirmDel(null)} style={{ background: "transparent", color: "#94a3b8", border: "1px solid #8baabf", borderRadius: 6, padding: "5px 12px", cursor: "pointer", fontSize: 12 }}>Cancel</button>
              </div>
            </div>
          )}
          {!creating ? (
            <button onClick={() => setCreating(true)} style={{ background: "transparent", color: "#7a90a8", border: "1px dashed #1a2535", borderRadius: 8, padding: "6px 14px", cursor: "pointer", fontSize: 12, width: "100%" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = "#7a90a8"} onMouseLeave={e => e.currentTarget.style.borderColor = "#1a2535"}>
              + Add profile
            </button>
          ) : (
            <div style={{ background: "#080f18", borderRadius: 10, padding: "14px 16px" }}>
              <input value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === "Enter" && create()} placeholder="Profile name" autoFocus
                style={{ width: "100%", background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 8, padding: "9px 12px", color: "#e2e8f0", fontSize: 14, marginBottom: 10 }}
                onFocus={e => e.target.style.borderColor = "#e2c97e66"} onBlur={e => e.target.style.borderColor = "#7a90a8"} />
              <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                {PROFILE_COLORS_SHELL.map(c => (
                  <button key={c.id} onClick={() => setColorId(c.id)} style={{ width: 22, height: 22, borderRadius: "50%", background: c.value + "33", border: `2px solid ${colorId === c.id ? c.value : "transparent"}`, cursor: "pointer" }} />
                ))}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={create} disabled={!newName.trim()}
                  style={{ flex: 1, background: newName.trim() ? profileColorOf(colorId) : "#1a2535", color: newName.trim() ? "#0f172a" : "#7a90a8", border: "none", borderRadius: 8, padding: "8px", cursor: newName.trim() ? "pointer" : "default", fontWeight: 700, fontSize: 13 }}>
                  Create
                </button>
                {profiles.length > 0 && (
                  <button onClick={() => { setCreating(false); setNewName(""); }} style={{ background: "transparent", color: "#7a90a8", border: "1px solid #7a90a8", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function HomeScreen({ username, profiles, activeProfileId, onSelect, onSignOut, onProfileCreate, onProfileDelete, onProfileSelect }) {
      const cards = [
        { id: "meeplelog", icon: "🎲", accentA: "#e2c97e", accentB: "#60a5fa", label: "MeepleLog", labelSplit: 6, desc: "Board game collection & wishlist" },
        { id: "plottwist", icon: "📖", accentA: "#e2c97e", accentB: "#60a5fa", label: "PlotTwist", labelSplit: 4, desc: "Book library & reading list" },
        { id: "spendlog",  icon: "💰", accentA: "#4ade80", accentB: "#22d3ee", label: "SpendLog",  labelSplit: 5, desc: "Expenses & subscriptions" },
      ];
      const [creating,   setCreating]   = React.useState(profiles.length === 0);
      const [newName,    setNewName]    = React.useState("");
      const [colorId,    setColorId]    = React.useState("blue");
      const [confirmDel, setConfirmDel] = React.useState(null);
      const [stats,      setStats]      = React.useState(null); // { games: { total, played, wishlist }, books: { total, reading, read } }
      const canEnter = !!activeProfileId && profiles.some(p => p.id === activeProfileId);
      const hour = new Date().getHours();
      const greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";

      // Fetch stats for the active profile whenever it changes
      React.useEffect(() => {
        if (!activeProfileId || !_sbUser) { setStats(null); return; }
        setStats(null);
        const pid = activeProfileId;
        Promise.all([
          _sb.from("ml_collection").select("data").eq("user_id", _sbUser.id).eq("profile_id", pid),
          _sb.from("pt_library").select("data").eq("user_id", _sbUser.id).eq("profile_id", pid).single(),
        ]).then(([mlRes, ptRes]) => {
          // Games
          const games = (mlRes.data || []).map(r => r.data);
          const gTotal    = games.length;
          const gPlayed   = games.filter(g => { const s = (g.status || {}); return s.playStatus === "played" || s.hasPlayed; }).length;
          const gOwned    = games.filter(g => (g.status || {}).ownership === "owned").length;
          const gWishlist = games.filter(g => (g.status || {}).ownership === "plan_to_buy").length;
          // Books
          const books = Array.isArray(ptRes.data?.data) ? ptRes.data.data : (Array.isArray(ptRes.data) ? ptRes.data : []);
          const bTotal   = books.length;
          const bReading = books.filter(b => (b.status || {}).reading === "reading").length;
          const bRead    = books.filter(b => (b.status || {}).reading === "read").length;

    // ─── MeepleLog module ─────────────────────────────────────────────────────
    const MeepleLogApp = (() => {
    // ─── ML config (BGG token) ────────────────────────────────────────────────
    const ML_CONFIG_KEY = "meeplelog_config";
    const loadMlConfig = async () => {
      const { data } = await _sb.from("ml_config").select("bgg_token").eq("user_id", _sbUser.id).single();
      return { bggToken: data?.bgg_token || null };
    };
    const saveMlConfig = async (cfg) => {
      await _sb.from("ml_config").upsert({ user_id: _sbUser.id, bgg_token: cfg.bggToken ?? null }, { onConflict: "user_id" });
    };

    // ─── BGG API (proxied via /api/bgg) ──────────────────────────────────────
    async function bggRequest(path) {
      const { bggToken } = await loadMlConfig();
      const qs = `path=${encodeURIComponent(path)}${bggToken ? `&token=${encodeURIComponent(bggToken)}` : ""}`;
      const url = `/api/bgg?${qs}`;
      let attempts = 0;
      while (attempts < 8) {
        const res = await fetch(url);
        if (res.status === 202) {
          await new Promise(r => setTimeout(r, 2000));
          attempts++; continue;
        }
        if (!res.ok) throw new Error(`BGG HTTP ${res.status}`);
        return await res.text();
      }
      throw new Error("BGG timeout after retries");
    }

    // Parse a <thing> item block from BGG XML into a game entry
    function decodeEntities(str) {
      return str
        .replace(/&amp;/g,  "&")
        .replace(/&lt;/g,   "<")
        .replace(/&gt;/g,   ">")
        .replace(/&quot;/g, '"')
        .replace(/&#(\d+);/g, (_, c) => String.fromCharCode(c))
        .replace(/&apos;/g, "'");
    }
    function parseThingItem(itemXml, existingEntry = {}) {
      const getAttrFromTag = (tag, attr) => { const m = tag.match(new RegExp(`\\b${attr}="([^"]*)"`, "i")); return m ? m[1] : ""; };
      const getVal  = (tag)  => { const m = itemXml.match(new RegExp(`<${tag}[^>]+value="([^"]*)"`, "i")); return m ? m[1].trim() : ""; };
      const getPrimary = () => {
        const m = itemXml.match(/<name[^>]+type="primary"[^>]+value="([^"]+)"/i)
                || itemXml.match(/<name[^>]+value="([^"]+)"[^>]+type="primary"/i);
        return m ? m[1] : "";
      };
      const getLinks = (linkType) => {
        const re = new RegExp(`<link[^>]+type="${linkType}"[^>]+value="([^"]+)"`, "gi");
        const results = []; let m;
        while ((m = re.exec(itemXml)) !== null) results.push(m[1]);
        return results;
      };

      const itemTagM = itemXml.match(/<item\s[^>]*>/i);
      const itemTag  = itemTagM ? itemTagM[0] : "";
      const id       = getAttrFromTag(itemTag, "id") || existingEntry.id;
      const isExp    = getAttrFromTag(itemTag, "type") === "boardgameexpansion";

      const name        = decodeEntities(getPrimary() || existingEntry.name || "");
      const year        = getVal("yearpublished") || existingEntry.year || "?";
      const minP        = parseInt(getVal("minplayers")) || null;
      const maxP        = parseInt(getVal("maxplayers")) || null;
      const minTime     = parseInt(getVal("minplaytime")) || null;
      const maxTime     = parseInt(getVal("maxplaytime")) || null;
      const avgM        = itemXml.match(/<average[^>]+value="([^"]+)"/i);
      const bggAvg      = avgM ? parseFloat(parseFloat(avgM[1]).toFixed(2)) : existingEntry.bggAvg || null;
      const weightM     = itemXml.match(/<averageweight[^>]+value="([^"]+)"/i);
      const complexity  = weightM ? parseFloat(parseFloat(weightM[1]).toFixed(2)) : null;
      const rankM       = itemXml.match(/<rank[^>]+name="boardgame"[^>]+value="([^"]+)"/i)
                       || itemXml.match(/<rank[^>]+value="([^"]+)"[^>]+name="boardgame"/i);
      const bggRank     = rankM && rankM[1] !== "Not Ranked" ? parseInt(rankM[1]) : null;
      const categories  = getLinks("boardgamecategory").map(decodeEntities);
      const mechanics   = getLinks("boardgamemechanic").map(decodeEntities);
      const designers   = getLinks("boardgamedesigner").map(decodeEntities).filter(d => d !== "(Uncredited)");

      let image = existingEntry.image || null;
      const imgM = itemXml.match(/<image>\s*(\/\/[^<\s]+|https?:\/\/[^<\s]+)\s*<\/image>/i);
      if (imgM) {
        let url = imgM[1].trim();
        if (url.startsWith("//")) url = "https:" + url;
        image = url;
      }

      return {
        ...existingEntry,
        id: String(id),
        name,
        year: year || "?",
        bggRank,
        bggAvg,
        isExpansion: isExp,
        minPlayers: minP,
        maxPlayers: maxP,
        minPlaytime: minTime,
        maxPlaytime: maxTime,
        complexity,
        categories,
        mechanics,
        designers,
        image,
      };
    }

    // Search BGG — returns array of lightweight result objects
    async function bggSearch(query) {
      try {
        const xml = await bggRequest(`/search?query=${encodeURIComponent(query)}&type=boardgame,boardgameexpansion&exact=0`);
        const items = [];
        // Match each <item> block — type and id can be in any order
        const itemRe = /<item\s[^>]*>/gi;
        let m;
        while ((m = itemRe.exec(xml)) !== null) {
          const tag = m[0];
          const idM   = tag.match(/\bid="(\d+)"/);
          const typeM = tag.match(/\btype="([^"]+)"/);
          if (!idM) continue;
          // Find this item's content up to </item>
          const start = m.index + tag.length;
          const end   = xml.indexOf("</item>", start);
          const block = end >= 0 ? xml.slice(start, end) : "";
          // Prefer primary name, fall back to any name value
          const primaryM = block.match(/<name\s[^>]*type="primary"[^>]*value="([^"]+)"/i);
          const anyNameM = block.match(/<name\s[^>]*value="([^"]+)"/i);
          const name = primaryM ? primaryM[1] : anyNameM ? anyNameM[1] : null;
          if (!name) continue;
          const yearM = block.match(/<yearpublished\s[^>]*value="([^"]+)"/i);
          items.push({
            id:          idM[1],
            name:        decodeEntities(name),
            year:        yearM ? yearM[1] : "?",
            isExpansion: typeM ? typeM[1] === "boardgameexpansion" : false,
          });
        }
        console.log("[BGG] Parsed", items.length, "results");
        return items;
      } catch(e) {
        console.warn("bggSearch error:", e);
        return [];
      }
    }

    // Fetch full details for a single game by ID
    async function bggThing(id) {
      try {
        const xml = await bggRequest(`/thing?id=${id}&stats=1&type=boardgame,boardgameexpansion`);
        const itemM = xml.match(/<item[\s\S]*?<\/item>/i);
        if (!itemM) return null;
        return parseThingItem(itemM[0]);
      } catch(e) {
        console.warn("bggThing error:", e);
        return null;
      }
    }

    // ─── Collection storage ───────────────────────────────────────────────────
    // ─── MeepleLog Supabase storage ──────────────────────────────────────────
    async function loadCollection(pid) {
      const { data, error } = await _sb.from("ml_collection").select("data").eq("user_id", _sbUser.id).eq("profile_id", pid || "default");
      if (error) { console.error("loadCollection:", error); return []; }
      return data ? data.map(r => r.data) : [];
    }
    async function saveCollection(col, pid) {
      pid = pid || "default";
      if (!col.length) { await _sb.from("ml_collection").delete().eq("user_id", _sbUser.id).eq("profile_id", pid); return; }
      const rows = col.map(g => ({ user_id: _sbUser.id, profile_id: pid, game_id: String(g.id), data: g }));
      await _sb.from("ml_collection").upsert(rows, { onConflict: "user_id,profile_id,game_id" });
      const ids = col.map(g => String(g.id));
      const { data: existing } = await _sb.from("ml_collection").select("game_id").eq("user_id", _sbUser.id).eq("profile_id", pid);
      if (existing) {
        const toDelete = existing.map(r => r.game_id).filter(id => !ids.includes(id));
        if (toDelete.length) await _sb.from("ml_collection").delete().eq("user_id", _sbUser.id).eq("profile_id", pid).in("game_id", toDelete);
      }
    }

    // ─── Export / Import ──────────────────────────────────────────────────────
    const CSV_FIELDS = ["id","name","year","bggRank","bggAvg","isExpansion","playStatus","ownership","score","buyYear","notes","advScores","minPlayers","maxPlayers"];

    function collectionToCSV(collection) {
      const esc = (v) => {
        const s = v == null ? "" : String(v);
        return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const rows = [CSV_FIELDS.join(",")];
      for (const g of collection) {
        const m = migrateStatus(g);
        rows.push([
          g.id, esc(g.name), g.year ?? "", g.bggRank ?? "", g.bggAvg ?? "",
          g.isExpansion ? 1 : 0,
          m.status.playStatus ?? "",
          m.status.ownership ?? "",
          g.score ?? "", g.buyYear ?? "",
          esc(g.notes ?? ""),
          esc(g.advScores ? JSON.stringify(g.advScores) : ""),
          g.minPlayers ?? "", g.maxPlayers ?? "",
        ].join(","));
      }
      return rows.join("\n");
    }

    function collectionToXML(collection) {
      const esc = (v) => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      const lines = ['<?xml version="1.0" encoding="UTF-8"?>', `<meeplelog exported="${new Date().toISOString()}" count="${collection.length}">` ];
      for (const g of collection) {
        const m = migrateStatus(g);
        lines.push("  <game>");
        lines.push(`    <id>${esc(g.id)}</id>`);
        lines.push(`    <name>${esc(g.name)}</name>`);
        lines.push(`    <year>${esc(g.year)}</year>`);
        lines.push(`    <bggRank>${esc(g.bggRank)}</bggRank>`);
        lines.push(`    <bggAvg>${esc(g.bggAvg)}</bggAvg>`);
        lines.push(`    <isExpansion>${g.isExpansion ? 1 : 0}</isExpansion>`);
        lines.push(`    <playStatus>${esc(m.status.playStatus)}</playStatus>`);
        lines.push(`    <ownership>${esc(m.status.ownership)}</ownership>`);
        lines.push(`    <score>${esc(g.score)}</score>`);
        lines.push(`    <buyYear>${esc(g.buyYear)}</buyYear>`);
        lines.push(`    <notes>${esc(g.notes)}</notes>`);
        lines.push(`    <advScores>${esc(g.advScores ? JSON.stringify(g.advScores) : "")}</advScores>`);
        lines.push(`    <minPlayers>${g.minPlayers ?? ""}</minPlayers>`);
        lines.push(`    <maxPlayers>${g.maxPlayers ?? ""}</maxPlayers>`);
        lines.push("  </game>");
      }
      lines.push("</meeplelog>");
      return lines.join("\n");
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importFromCSV(text) {
      const lines = text.trim().split("\n");
      if (lines.length < 2) return [];
      const parseRow = (line) => {
        const result = []; let cur = "", inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
          else if (ch === ',' && !inQ) { result.push(cur); cur = ""; }
          else cur += ch;
        }
        result.push(cur); return result;
      };
      const headers = parseRow(lines[0]).map(h => h.trim());
      const idx = (n) => headers.indexOf(n);
      const games = [];
      for (let i = 1; i < lines.length; i++) {
        const r = parseRow(lines[i].trim());
        if (!r[idx("id")]) continue;
        games.push({
          id:          r[idx("id")],
          name:        r[idx("name")] ?? "",
          year:        r[idx("year")] || "?",
          bggRank:     parseInt(r[idx("bggRank")]) || null,
          bggAvg:      parseFloat(r[idx("bggAvg")]) || null,
          isExpansion: r[idx("isExpansion")] === "1",
          status: {
            playStatus: r[idx("playStatus")] || (r[idx("hasPlayed")] === "1" ? "played" : null),
            ownership: r[idx("ownership")] || null,
          },
          score:  parseFloat(r[idx("score")]) || null,
          buyYear: parseInt(r[idx("buyYear")]) || null,
          notes:  r[idx("notes")] ?? "",
          image:  r[idx("image")] ?? null,
          advScores: (() => { try { const v = r[idx("advScores")]; return v ? JSON.parse(v) : null; } catch { return null; } })(),
          minPlayers: parseInt(r[idx("minPlayers")]) || null,
          maxPlayers: parseInt(r[idx("maxPlayers")]) || null,
        });
      }
      return games;
    }

    function importFromXML(text) {
      const parser = new DOMParser();
      const doc    = parser.parseFromString(text, "text/xml");
      const get    = (el, tag) => el.querySelector(tag)?.textContent ?? "";
      return Array.from(doc.querySelectorAll("game")).map(g => ({
        id:          get(g, "id"),
        name:        get(g, "name"),
        year:        get(g, "year") || "?",
        bggRank:     parseInt(get(g, "bggRank")) || null,
        bggAvg:      parseFloat(get(g, "bggAvg")) || null,
        isExpansion: get(g, "isExpansion") === "1",
        status: {
          playStatus: get(g, "playStatus") || (get(g, "hasPlayed") === "1" ? "played" : null),
          ownership: get(g, "ownership") || null,
        },
        score:  parseFloat(get(g, "score")) || null,
        buyYear: parseInt(get(g, "buyYear")) || null,
        notes:  get(g, "notes"),
        image:  get(g, "image") || null,
        advScores: (() => { try { const v = get(g, "advScores"); return v ? JSON.parse(v) : null; } catch { return null; } })(),
        minPlayers: parseInt(get(g, "minPlayers")) || null,
        maxPlayers: parseInt(get(g, "maxPlayers")) || null,
      }));
    }

    // ─── Export/Import Modal ──────────────────────────────────────────────────

      const [importError, setImportError] = useState(null);
      const [mergeMode,   setMergeMode]  = useState("merge");
      const [exported,    setExported]   = useState(null); // { filename, fmt }
      const fileRef = useRef();
      const now = new Date();
      const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}-${String(now.getMinutes()).padStart(2,"0")}`;

      const handleExport = (fmt) => {
        const filename = `meeplelog-${ts}.${fmt}`;
        const content  = fmt === "csv" ? collectionToCSV(collection) : collectionToXML(collection);
        const mime     = fmt === "csv" ? "text/csv" : "application/xml";
        downloadFile(content, filename, mime);
        setExported({ filename, fmt });
      };

      const handleImportFile = (file) => {
        if (!file) return;
        setImportError(null); setImportData(null);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text  = e.target.result;
            let games   = file.name.endsWith(".xml") ? importFromXML(text) : importFromCSV(text);
            if (!games.length) { setImportError("No games found in file."); return; }
            // Mark all non-custom games for BGG re-fetch (image + players)
            games = games.map(g => ({
              ...g,
              image: (g.image && g.image.startsWith("data:")) ? null : g.image,
              _needsApiFetch: !g.id.startsWith("custom-"),
            }));
            setImportData({ games, filename: file.name });
          } catch (err) { setImportError(`Could not parse file: ${err.message}`); }
        };
        reader.readAsText(file);
      };

      const confirmImport = async () => {
        if (!importData) return;
        onImport(importData.games, mergeMode);
        onClose();

        // Re-fetch image + players from BGG for all imported games
        const toFetch = importData.games.filter(g => g._needsApiFetch);
        console.log("[Import] Re-fetching", toFetch.length, "games from BGG");
        for (let i = 0; i < toFetch.length; i += 20) {
          const batch = toFetch.slice(i, i + 20);
          try {
            const ids = batch.map(g => g.id).join(",");
            console.log("[Import] Fetching batch", Math.floor(i/20) + 1, "—", batch.length, "games");
            const xml = await bggRequest(`/thing?id=${ids}&stats=1&type=boardgame,boardgameexpansion`);
            let updated = 0;
            for (const g of batch) {
              const blockM = xml.match(new RegExp(`<item[^>]+id="${g.id}"[^>]*>[\\s\\S]*?<\\/item>`, "i"));
              if (!blockM) continue;
              const details = parseThingItem(blockM[0], g);
              onUpdateGame({ ...g, ...details, _needsApiFetch: undefined });
              updated++;

            console.log("[Import] Batch updated", updated, "games");
          } catch(e) { console.warn("[Import] Batch error:", e); }

              {tab === "import" && (

    // ─── Subcollections storage ───────────────────────────────────────────────
    // Built-in subcollections filter by status fields.
    // Custom subcollections: { id, name, gameIds: Set/Array }
    // subcollections stored as single jsonb blob

    const BUILTIN_SUBCOLLECTIONS = [
      { id: "all",          label: "All",          builtin: true },
      { id: "have_played",  label: "Have Played",  builtin: true },
      { id: "owned",        label: "Owned",        builtin: true },
      { id: "plan_to_buy",  label: "Wishlist",  builtin: true },
    ];

    function loadSubcollections() {
      try {
        const r = storage.get(SUBCOLL_KEY);
        if (!r) return [];
        return JSON.parse(r.value); // [{id, name, gameIds:[]}]
      } catch { return []; }
    }
    async function saveSubcollections(list, pid) {
      await _sb.from("ml_subcollections").upsert({ user_id: _sbUser.id, profile_id: pid || "default", data: list }, { onConflict: "user_id,profile_id" });
    }

    function filterBySubcollection(collection, subcollId, customSubcolls) {
      if (subcollId === "all") return collection;
      if (subcollId === "have_played") return collection.filter(g => { const s = migrateStatus(g).status; return s.playStatus === "played" || s.hasPlayed; });
      if (subcollId === "owned")       return collection.filter(g => migrateStatus(g).status.ownership === "owned");
      if (subcollId === "plan_to_buy") return collection.filter(g => migrateStatus(g).status.ownership === "plan_to_buy");
      const sc = customSubcolls.find(s => s.id === subcollId);
      if (!sc) return collection;
      const ids = new Set(sc.gameIds);
      return collection.filter(g => ids.has(g.id));
    }

    // ─── Status model ─────────────────────────────────────────────────────────
    const DEFAULT_STATUS = { playStatus: null, ownership: null };

    function getStatusBadges(status = {}) {
      const badges = [];
      if (status.hasPlayed || status.playStatus === "played") badges.push({ label: "Have Played", color: "#4ade80" });
      if (status.ownership === "owned")                       badges.push({ label: "Owned",       color: "#fb923c" });
      if (status.ownership === "plan_to_buy")                 badges.push({ label: "Wishlist",    color: "#c084fc" });
      return badges;
    }

    function getPrimaryBadge(status = {}) {
      const badges = getStatusBadges(status);
      return badges[0] || { label: "–", color: "#475569" };
    }

    function migrateStatus(entry) {
      if (entry.status && typeof entry.status === "object") {
        const s = entry.status;
        if (s.playStatus === undefined) {
          return { ...entry, status: { ...s, playStatus: s.hasPlayed ? "played" : null } };
        }
        return entry;
      }
      const s = entry.status || "";
      let st = { playStatus: null, ownership: null };
      if (s === "playing" || s === "completed") st = { playStatus: "played", ownership: "owned" };
      else if (s === "owned")                   st = { playStatus: null,     ownership: "owned" };
      else if (s === "on_hold")                 st = { playStatus: "played", ownership: "owned" };
      else if (s === "dropped")                 st = { playStatus: "played", ownership: null };
      return { ...entry, status: st };
    }

    // ─── Score Input ──────────────────────────────────────────────────────────
    function ScoreInput({ value, onChange, compact = false }) {
      const [hoverWhole, setHoverWhole] = useState(null);
      const [showDecimal, setShowDecimal] = useState(false);

      const handleWholeClick = (n) => {
        if (value === n) { onChange(null); setShowDecimal(false); return; }
        const whole = Math.floor(value ?? 0);
        if (whole === n && value !== n) { setShowDecimal(true); return; }
        onChange(n);
        setShowDecimal(n < 10);
      };

      const wholeSelected = value != null ? Math.ceil(value) : null;
      const displayWhole  = value != null ? Math.floor(value) : null;

      const decimals = displayWhole != null && displayWhole < 10
        ? Array.from({ length: 10 }, (_, i) => parseFloat((displayWhole + i * 0.1).toFixed(1)))
        : [];

      const btnSize = compact ? 24 : 30;
      const btnFont = compact ? 10 : 12;

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: compact ? 6 : 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: compact ? 6 : 10 }}>
            <div style={{ display: "flex", gap: compact ? 2 : 3 }}>
              {Array.from({ length: 10 }, (_, i) => i + 1).map((n) => {
                const filled  = n <= (hoverWhole ?? displayWhole ?? 0);
                const isBase  = displayWhole === n && value !== n;
                return (
                  <button key={n}
                    onClick={() => handleWholeClick(n)}
                    onMouseEnter={() => setHoverWhole(n)}
                    onMouseLeave={() => setHoverWhole(null)}
                    style={{
                      width: btnSize, height: btnSize, borderRadius: 5, border: isBase ? "1px solid #e2c97e88" : "none",
                      cursor: "pointer", fontSize: btnFont, fontWeight: 700,
                      background: filled ? "#e2c97e" : "#0f1923",
                      color: filled ? "#0f172a" : "#334155",
                      transition: "all 0.1s",
                      transform: hoverWhole === n ? "scale(1.15)" : "scale(1)",
                      opacity: isBase ? 0.75 : 1,
                    }}>
                    {n}
                  </button>
                );
              })}
            </div>
            <span style={{ minWidth: compact ? 28 : 36, color: "#e2c97e", fontWeight: 600, fontSize: compact ? 14 : 18, fontFamily: "'DM Mono', monospace" }}>
              {value ?? "–"}
            </span>
          </div>

          {showDecimal && decimals.length > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, paddingLeft: 2 }}>
              <span style={{ fontSize: 12, color: "#7a90a8", width: 52, flexShrink: 0 }}>decimal:</span>
              <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
                {decimals.map((v) => {
                  const isActive = value === v;
                  return (
                    <button key={v} onClick={() => { onChange(v); }}
                      style={{
                        width: 34, height: 24, borderRadius: 4, border: `1px solid ${isActive ? "#e2c97e" : "#1a2535"}`,
                        cursor: "pointer", fontSize: 12, fontWeight: 600, fontFamily: "'DM Mono', monospace",
                        background: isActive ? "#e2c97e22" : "#080f18",
                        color: isActive ? "#e2c97e" : "#8baabf",
                        transition: "all 0.1s",
                      }}>
                      {v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)}
                    </button>
                  );
                })}
              </div>
              <button onClick={() => setShowDecimal(false)} style={{ background: "none", border: "none", color: "#2a3a4a", cursor: "pointer", fontSize: 14, marginLeft: 2 }}>✕</button>
            </div>
          )}
        </div>
      );
    }

    function Tag({ label, color = "#0a1929", text = "#60a5fa" }) {
      return <span style={{ background: color, border: `1px solid ${text}33`, borderRadius: 20, padding: "3px 11px", fontSize: 12, color: text, whiteSpace: "nowrap" }}>{label}</span>;
    }

    // ─── Game Card ────────────────────────────────────────────────────────────
    function GameCard({ entry, onSelect, inSubcoll }) {
      const scoreDisplay = entry.score != null
        ? (Number.isInteger(entry.score) ? String(entry.score) : entry.score.toFixed(1))
        : null;
      return (
        <div onClick={(e) => onSelect(e)}
          style={{ cursor: "pointer", borderRadius: 10, overflow: "hidden", background: "#0f1923", border: "1px solid #1a2535", transition: "transform 0.18s, box-shadow 0.18s, border-color 0.18s", width: "100%", position: "relative" }}
          onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-5px)"; e.currentTarget.style.boxShadow = "0 16px 40px rgba(0,0,0,0.6)"; e.currentTarget.style.borderColor = "#8baabf"; }}
          onMouseLeave={(e) => { e.currentTarget.style.transform = "none"; e.currentTarget.style.boxShadow = "none"; e.currentTarget.style.borderColor = "#1a2535"; }}>
          {/* Square image: padding-top 100% = same as width */}
          <div style={{ position: "relative", width: "100%", paddingTop: "100%", background: "#080f18", overflow: "hidden" }}>
            <div style={{ position: "absolute", inset: 0 }}>
              {entry.image
                ? <img src={entry.image} alt={entry.name} style={{ width: "100%", height: "100%", objectFit: "contain", display: "block" }} />
                : <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 44, background: "linear-gradient(135deg, #0d1b2a, #1a2d40)" }}>🎲</div>
              }
            </div>
          </div>
          <div style={{ padding: "8px 10px 9px", display: "flex", alignItems: "center", gap: 8, height: 84, boxSizing: "border-box" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#e2e8f0", lineHeight: 1.3, fontFamily: "'Playfair Display', serif", marginBottom: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {entry.name}{entry.year && entry.year !== "?" ? <span style={{ fontWeight: 400, fontSize: 12, color: "#7a90a8" }}> ({entry.year})</span> : ""}
              </div>
              {(() => {
                const ico = (path, color, vb="0 0 24 24") => (
                  <svg width="11" height="11" viewBox={vb} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                    {path}
                  </svg>
                );
                const starIco   = ico(<><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></>, "#e2c97e");
                const playersIco= ico(<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>, "#60a5fa");
                const timeIco   = ico(<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>, "#34d399");
                const weightIco = ico(<><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></>, "#f87171");
                const row = (icon, val) => <><div style={{ width: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>{icon}</div><span style={{ fontSize: 12, color: val === "–" ? "#8baabf" : "#7a90a8" }}>{val}</span></>;
                const players = (entry.minPlayers || entry.maxPlayers) ? (entry.minPlayers && entry.maxPlayers && entry.minPlayers !== entry.maxPlayers ? `${entry.minPlayers}–${entry.maxPlayers}` : (entry.minPlayers || entry.maxPlayers)) : "–";
                const time    = (entry.minPlaytime || entry.maxPlaytime) ? (entry.minPlaytime && entry.maxPlaytime && entry.minPlaytime !== entry.maxPlaytime ? `${entry.minPlaytime}–${entry.maxPlaytime}m` : `${entry.minPlaytime || entry.maxPlaytime}m`) : "–";
                return (
                  <div style={{ display: "grid", gridTemplateColumns: "14px 1fr 14px 1fr", gap: "3px 4px", alignItems: "center" }}>
                    {row(starIco,    entry.bggAvg ?? "–")}
                    {row(playersIco, players)}
                    {row(timeIco,    time)}
                    {row(weightIco,  entry.complexity ? `${entry.complexity.toFixed(1)}/5` : "–")}
                  </div>
                );
              })()}
            </div>
            <div style={{ flexShrink: 0, width: 36, height: 36, borderRadius: 7, background: scoreDisplay ? "#e2c97e" : "#0a1520", border: scoreDisplay ? "none" : "1px solid #1a2535", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {scoreDisplay ? <span style={{ fontFamily: "'DM Mono', monospace", fontWeight: 700, fontSize: 13, color: "#0f172a" }}>{scoreDisplay}</span>
                            : <span style={{ fontSize: 13, opacity: 0.25 }}>–</span>}
            </div>
          </div>
        </div>
      );
    }

    // ─── Search Modal (API version) ───────────────────────────────────────────
    function SearchModal({ onAdd, existingIds, defaultWishlist, onClose }) {
      const [query,     setQuery]    = useState("");
      const [results,   setResults]  = useState([]);
      const [thumbs,    setThumbs]   = useState({}); // id → url
      const [added,     setAdded]    = useState(new Set(existingIds));
      const [searching, setSearching] = useState(false);
      const [adding,    setAdding]   = useState(new Set());
      const inputRef   = useRef();
      const timerRef   = useRef();
      const thumbTimer = useRef();
      useEffect(() => { inputRef.current?.focus(); }, []);

      // Debounced search — 400ms after typing stops
      useEffect(() => {
        clearTimeout(timerRef.current);
        clearTimeout(thumbTimer.current);
        if (!query.trim() || query.trim().length < 2) { setResults([]); setThumbs({}); return; }
        timerRef.current = setTimeout(async () => {
          setSearching(true);
          setThumbs({});
          const res = await bggSearch(query.trim());
          setResults(res);
          setSearching(false);

          // Fetch thumbnails for all results in batches of 20
          if (res.length > 0) {
            const newThumbs = {};
            for (let i = 0; i < res.length; i += 20) {
              const batch = res.slice(i, i + 20);
              try {
                const ids = batch.map(g => g.id).join(",");
                const xml = await bggRequest(`/thing?id=${ids}&type=boardgame,boardgameexpansion`);
                for (const g of batch) {
                  const blockM = xml.match(new RegExp(`<item[^>]+id="${g.id}"[^>]*>[\\s\\S]*?<\\/item>`, "i"));
                  if (!blockM) continue;
                  const imgM = blockM[0].match(/<thumbnail>\s*(\/\/[^<\s]+|https?:\/\/[^<\s]+)\s*<\/thumbnail>/i);
                  if (imgM) {
                    let url = imgM[1].trim();
                    if (url.startsWith("//")) url = "https:" + url;
                    newThumbs[g.id] = url;
                  }
                }
              } catch(e) { /* skip batch */ }
            }
            setThumbs(newThumbs);
          }
        }, 1000); // 1 second pause before searching + fetching
        return () => { clearTimeout(timerRef.current); clearTimeout(thumbTimer.current); };
      }, [query]);

      const handleAdd = async (result, asWishlist = false) => {
        const sid = String(result.id);
        if (added.has(sid) || adding.has(sid)) return;
        setAdding(a => new Set([...a, sid]));
        const status = asWishlist
          ? { playStatus: null, ownership: "plan_to_buy" }
          : DEFAULT_STATUS;
        const placeholder = { id: sid, name: result.name, year: result.year || "?", bggRank: null, bggAvg: null, isExpansion: result.isExpansion, status, score: null, buyYear: null, notes: "", image: null, advScores: null, minPlayers: null, maxPlayers: null };
        onAdd(placeholder);
        const full = await bggThing(sid);
        if (full) onAdd({ ...placeholder, ...full });
        setAdded(a => new Set([...a, sid]));
        setAdding(a => { const n = new Set(a); n.delete(sid); return n; });
      };

      const handleAddCustom = () => {
        const name = query.trim() || "Untitled Game";
        const customId = "custom-" + Date.now();
        const entry = { id: customId, name, year: "?", bggRank: null, bggAvg: null, isExpansion: false, status: DEFAULT_STATUS, score: null, buyYear: null, notes: "", image: null, advScores: null, minPlayers: null, maxPlayers: null };
        onAdd(entry);
        setAdded(a => new Set([...a, customId]));
      };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.88)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 18, width: 600, maxHeight: "85vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 40px 120px rgba(0,0,0,0.95)" }}>
            <div style={{ padding: "22px 24px 18px", borderBottom: "1px solid #1a2535" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                <div>
                  <h2 style={{ margin: 0, fontFamily: "'Playfair Display', serif", color: defaultWishlist ? "#c084fc" : "#e2c97e", fontSize: 22 }}>{defaultWishlist ? "🔖 Add to Wishlist" : "Add to Collection"}</h2>
                  <p style={{ margin: "4px 0 0", color: "#7a90a8", fontSize: 13 }}>Pause typing to search · images load for all results</p>
                </div>
                <button onClick={onClose} style={{ background: "#0f1923", border: "1px solid #1a2535", color: "#64748b", borderRadius: 8, width: 32, height: 32, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✕</button>
              </div>
              <input ref={inputRef} value={query} onChange={(e) => setQuery(e.target.value)}
                placeholder="Type to search the full BGG database…"
                style={{ width: "100%", background: "#080f18", border: "1px solid #7a90a8", borderRadius: 10, padding: "12px 16px", color: "#e2e8f0", fontSize: 15, outline: "none", transition: "border-color 0.2s" }}
                onFocus={(e) => (e.target.style.borderColor = "#e2c97e")}
                onBlur={(e)  => (e.target.style.borderColor = "#7a90a8")} />
            </div>
            <div style={{ overflowY: "auto", flex: 1 }}>
              {!query.trim() && (
                <div style={{ padding: "52px 24px", textAlign: "center" }}>
                  <div style={{ fontSize: 52, marginBottom: 12 }}>🔍</div>
                  <div style={{ color: "#7a90a8", fontSize: 14 }}>Start typing to search BGG</div>
                </div>
              )}
              {searching && (
                <div style={{ padding: "40px 24px", textAlign: "center", color: "#7a90a8", fontSize: 14 }}>Searching…</div>
              )}
              {!searching && results.length === 0 && query.trim().length >= 2 && (
                <div style={{ padding: "40px 24px", textAlign: "center", color: "#7a90a8", fontSize: 14 }}>No results for "{query}"</div>
              )}
              {!searching && results.map((g) => {
                const sid     = String(g.id);
                const isAdded = added.has(sid);
                const isAdding = adding.has(sid);
                return (
                  <div key={sid}
                    style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 24px", borderBottom: "1px solid #0d1520", transition: "background 0.15s" }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = "#0a1220")}
                    onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}>
                    <div style={{ width: 40, height: 40, borderRadius: 6, background: "#080f18", border: "1px solid #1a2535", flexShrink: 0, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                      {thumbs[sid]
                        ? <img src={thumbs[sid]} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                        : g.isExpansion ? "🔗" : "🎲"
                      }
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ color: "#e2e8f0", fontWeight: 600, fontSize: 14, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.name}</div>
                      <div style={{ color: "#7a90a8", fontSize: 12, marginTop: 2, display: "flex", gap: 10 }}>
                        {g.year && g.year !== "?" ? <span>{g.year}</span> : null}
                        {g.isExpansion ? <span style={{ color: "#c084fc" }}>Expansion</span> : null}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                      {isAdding ? (
                        <button disabled style={{ background: "#1a2535", color: "#8baabf", border: "none", borderRadius: 8, padding: "7px 16px", fontSize: 13, fontWeight: 700, minWidth: 80 }}>Adding…</button>
                      ) : isAdded ? (
                        <button disabled style={{ background: "#0a1929", color: "#4ade80", border: "1px solid #1a3d1a", borderRadius: 8, padding: "7px 16px", fontSize: 13, fontWeight: 700, minWidth: 80 }}>✓ Added</button>
                      ) : defaultWishlist ? (
                        <button onClick={() => handleAdd(g, true)}
                          style={{ background: "#c084fc18", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "7px 14px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>🔖 Wishlist</button>
                      ) : (
                        <>
                          <button onClick={() => handleAdd(g, false)}
                            style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "7px 14px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>+ Add</button>
                          <button onClick={() => handleAdd(g, true)}
                            style={{ background: "transparent", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "7px 10px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}
                            title="Add to Wishlist">🔖</button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
              {query.trim().length > 0 && !searching && (
                <div
                  style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 24px", borderTop: results.length > 0 ? "1px solid #1a2535" : "none", transition: "background 0.15s", cursor: "pointer" }}
                  onMouseEnter={(e) => (e.currentTarget.style.background = "#0a1220")}
                  onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
                  onClick={handleAddCustom}>
                  <div style={{ width: 40, height: 40, borderRadius: 6, background: "#080f18", border: "1px dashed #8baabf", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: "#7a90a8" }}>✚</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: "#7a90a8", fontSize: 14 }}>
                      Can't find it? Add <span style={{ color: "#e2c97e", fontWeight: 600 }}>"{query.trim()}"</span> manually →
                    </div>
                    <div style={{ color: "#8baabf", fontSize: 12, marginTop: 2 }}>Not in BGG · fill in details after</div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Game Detail Modal ────────────────────────────────────────────────────
    function GameDetailModal({ entry, onSave, onDelete, onClose, customSubcolls, toggleGameInSubcoll, allWishlistTags = [] }) {
      const migrated  = migrateStatus(entry);
      const [edit, setEdit]         = useState({ ...migrated });
      const [imgDragging, setImgDragging] = useState(false);
      const imgInputRef = useRef();
      const set = (k, v) => setEdit((e) => ({ ...e, [k]: v }));

      const togglePlayStatus = (val) => set("status", { ...edit.status, playStatus: edit.status.playStatus === val ? null : val });
      const toggleOwnership  = (val) => set("status", { ...edit.status, ownership: edit.status.ownership === val ? null : val });

      const handleImageFile = (file) => {
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (e) => set("image", e.target.result);
        reader.readAsDataURL(file);
      };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.9)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 18, width: 520, maxHeight: "92vh", overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 40px 120px rgba(0,0,0,0.95)" }}>

            {/* Header with cover art */}
            <div style={{ position: "relative", padding: "22px 28px 20px", background: "linear-gradient(135deg, #0d1825, #0f2035)", borderBottom: "1px solid #1a2535", flexShrink: 0 }}>
              <button onClick={onClose} style={{ position: "absolute", top: 16, right: 16, background: "rgba(0,0,0,0.4)", border: "1px solid #7a90a8", color: "#94a3b8", borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 16 }}>
                {/* Clickable cover */}
                <div
                  style={{ width: 72, height: 96, borderRadius: 8, overflow: "hidden", flexShrink: 0, position: "relative", cursor: "pointer", border: imgDragging ? "2px dashed #e2c97e" : "2px solid #1a2535", transition: "border-color 0.2s" }}
                  onClick={() => imgInputRef.current?.click()}
                  onDragOver={(e) => { e.preventDefault(); setImgDragging(true); }}
                  onDragLeave={() => setImgDragging(false)}
                  onDrop={(e) => { e.preventDefault(); setImgDragging(false); handleImageFile(e.dataTransfer.files[0]); }}>
                  {edit.image
                    ? <img src={edit.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                    : <div style={{ width: "100%", height: "100%", background: "#080f18", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
                        <span style={{ fontSize: 22 }}>{entry.isExpansion ? "🔗" : "🎲"}</span>
                        <span style={{ fontSize: 12, color: "#7a90a8", textAlign: "center", lineHeight: 1.3 }}>Add<br/>cover</span>
                      </div>
                  }
                  <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, transition: "background 0.2s" }}
                    onMouseEnter={(e) => { e.currentTarget.style.background = "rgba(0,0,0,0.55)"; e.currentTarget.firstChild.style.opacity = "1"; }}
                    onMouseLeave={(e) => { e.currentTarget.style.background = "rgba(0,0,0,0)";    e.currentTarget.firstChild.style.opacity = "0"; }}>
                    <span style={{ opacity: 0, transition: "opacity 0.2s" }}>📷</span>
                  </div>
                  <input ref={imgInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleImageFile(e.target.files[0])} />
                </div>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <h2 style={{ margin: "0 0 4px", fontFamily: "'Playfair Display', serif", color: "#e2e8f0", fontSize: 20, lineHeight: 1.2 }}>{entry.name}</h2>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", fontSize: 12, color: "#8baabf" }}>
                    {entry.year  && entry.year !== "?" && <span>{entry.year}</span>}
                    {entry.bggAvg  && <span>⭐ {entry.bggAvg} BGG avg</span>}
                    {(edit.minPlayers || edit.maxPlayers) && (
                      <span>👥 {edit.minPlayers && edit.maxPlayers && edit.minPlayers !== edit.maxPlayers ? `${edit.minPlayers}–${edit.maxPlayers}` : (edit.minPlayers || edit.maxPlayers)}</span>
                    )}
                    {entry.isExpansion && !entry.id.startsWith("custom-") && <span style={{ color: "#c084fc" }}>Expansion</span>}
                    {entry.id.startsWith("custom-") && (
                      <div style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => set("isExpansion", false)}
                          style={{ padding: "2px 10px", borderRadius: 20, border: `1px solid ${!edit.isExpansion ? "#e2c97e" : "#1a2535"}`, background: !edit.isExpansion ? "#e2c97e18" : "transparent", color: !edit.isExpansion ? "#e2c97e" : "#7a90a8", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                          🎲 Base game
                        </button>
                        <button onClick={() => set("isExpansion", true)}
                          style={{ padding: "2px 10px", borderRadius: 20, border: `1px solid ${edit.isExpansion ? "#c084fc" : "#1a2535"}`, background: edit.isExpansion ? "#c084fc18" : "transparent", color: edit.isExpansion ? "#c084fc" : "#7a90a8", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>
                          🔗 Expansion
                        </button>
                      </div>
                    )}
                  </div>
                  <div style={{ marginTop: 8, fontSize: 12, color: "#2a3a4a" }}>
                    Click cover or drop an image to set it
                    {edit.image && <button onClick={() => set("image", null)} style={{ marginLeft: 8, background: "none", border: "none", color: "#f87171", cursor: "pointer", fontSize: 12, padding: 0 }}>✕ Remove</button>}
                  </div>
                </div>
              </div>
            </div>

            <div style={{ overflowY: "auto", flex: 1, padding: "22px 28px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

                {/* Status */}
                <div>
                  <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Status</label>
                  {edit.status.ownership === "plan_to_buy" ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <span style={{ fontSize: 13, color: "#c084fc", background: "#c084fc18", border: "1px solid #c084fc44", borderRadius: 8, padding: "7px 14px", fontWeight: 600 }}>🔖 Wishlisted</span>
                        <button onClick={() => set("status", { playStatus: null, ownership: "owned" })}
                          style={{ padding: "7px 16px", borderRadius: 8, border: "none", background: "#fb923c", color: "#0f172a", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>
                          Move to Collection →
                        </button>
                      </div>
                      {/* Wishlist tags */}
                      <div>
                        <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Wishlist Tags</div>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                          {(edit.wishlistTags || []).map(tag => (
                            <span key={tag} style={{ display: "flex", alignItems: "center", gap: 4, padding: "3px 10px", borderRadius: 20, background: "#c084fc18", border: "1px solid #c084fc44", fontSize: 12, color: "#c084fc" }}>
                              {tag}
                              <button onClick={() => set("wishlistTags", (edit.wishlistTags||[]).filter(t => t !== tag))}
                                style={{ background: "none", border: "none", color: "#c084fc", cursor: "pointer", fontSize: 12, padding: 0, lineHeight: 1, opacity: 0.7 }}>✕</button>
                            </span>
                          ))}
                          {/* Existing tags not yet applied */}
                          {allWishlistTags.filter(t => !(edit.wishlistTags||[]).includes(t)).map(tag => (
                            <button key={tag} onClick={() => set("wishlistTags", [...(edit.wishlistTags||[]), tag])}
                              style={{ padding: "3px 10px", borderRadius: 20, background: "transparent", border: "1px solid #8baabf", fontSize: 12, color: "#7a90a8", cursor: "pointer" }}>
                              + {tag}
                            </button>
                          ))}
                          {/* New tag */}
                          <input
                            placeholder="+ New tag"
                            style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 20, padding: "3px 10px", color: "#e2e8f0", fontSize: 12, width: 90 }}
                            onFocus={e => e.target.style.borderColor = "#c084fc55"}
                            onBlur={e => e.target.style.borderColor = "#1a2535"}
                            onKeyDown={e => {
                              if (e.key === "Enter" && e.target.value.trim()) {
                                const tag = e.target.value.trim();

                            }} />
                        </div>

                          style={{ padding: "7px 18px", borderRadius: 8, border: `1px solid ${active ? color : "#1a2535"}`, background: active ? `${color}20` : "transparent", color: active ? color : "#7a90a8", cursor: "pointer", fontSize: 13, fontWeight: 600, transition: "all 0.15s" }}>

                  </div>

                  {/* Custom lists */}
                  {customSubcolls && customSubcolls.length > 0 && (

                            {customSubcolls.filter(sc => sc.gameIds.includes(entry.id)).length > 0

                        <div style={{ borderTop: "1px solid #1a2535", padding: "6px 0" }}>

                        <span key={b.label} style={{ background: `${b.color}20`, border: `1px solid ${b.color}55`, borderRadius: 20, padding: "2px 10px", fontSize: 12, color: b.color }}>{b.label}</span>

                {/* Score + Buy Year — side by side */}
                {(()=>{

                  const filled = ADV_KEYS.filter(k => adv[k] != null);
                  const advAvg = filled.length > 0
                    ? Math.round((filled.reduce((s,k) => s + adv[k], 0) / filled.length) * 10) / 10
                    : null;
                  const setScore = (raw) => {
                    if (raw === "" || raw === null) { set("score", null); return; }

                    if (isNaN(n)) return;

                  return (
                    <div style={{ display: "flex", gap: 20, alignItems: "flex-start" }}>

                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                            onChange={e => setScore(e.target.value)}

                            onFocus={e => e.target.style.borderColor = "#e2c97e44"}
                            onBlurCapture={e => e.target.style.borderColor = "#1a2535"}
