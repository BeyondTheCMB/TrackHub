          {/* Data summary */}
          <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
            <div style={{ fontSize: 11, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 12 }}>Data (this profile)</div>
            <div style={{ fontSize: 13, color: "#7a90a8", marginBottom: 4 }}>
              Stored locally at <code style={{ background: "#080f18", padding: "1px 6px", borderRadius: 3, color: "#60a5fa", fontFamily: "'DM Mono', monospace", fontSize: 12 }}>plottwist-data/profiles/{activeProfileId}/</code>
            </div>
            <div style={{ fontSize: 12, color: "#4a6080", fontFamily: "'DM Mono', monospace", marginTop: 10 }}>
              {library.length} books · {library.filter(b => effectiveBucket(b) === "read").length} read · {library.filter(b => effectiveBucket(b) === "reading").length} reading · {library.filter(b => effectiveBucket(b) === "onhold").length} on hold · {library.filter(b => effectiveBucket(b) === "sleeping").length} sleeping · {library.filter(b => effectiveBucket(b) === "wishlist").length} wishlist
            </div>
          </div>

          {/* Backup & sharing */}
          <ExportImportPanel
            library={library}
            lists={lists}
            profileName={profiles.find(p => p.id === activeProfileId)?.name}
            onImport={onImport}
          />

          {/* Confirm delete profile modal */}
          {confirmDelete && (() => {
            const p = profiles.find(x => x.id === confirmDelete);
            if (!p) return null;
            return (
              <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,0.88)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
                onClick={(e) => e.target === e.currentTarget && setConfirmDelete(null)}>
                <div style={{ background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 12, padding: 24, width: 440 }}>
                  <div style={{ fontSize: 16, color: "#e2e8f0", marginBottom: 8, fontWeight: 600 }}>Delete profile <span style={{ color: colorOf(p.color), fontFamily: "'Playfair Display', serif" }}>{p.name}</span>?</div>
                  <div style={{ fontSize: 13, color: "#7a90a8", marginBottom: 18, lineHeight: 1.5 }}>
                    All of <strong>{p.name}</strong>'s books, lists and reading data will be permanently deleted. This cannot be undone.
                  </div>
                  <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDelete(null)}
                      style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                    <button onClick={() => { onDeleteProfile(p.id); setConfirmDelete(null); }}
                      style={{ background: "#f87171", border: "none", color: "#0f172a", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>Delete profile</button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

      return App;
    })();
    // ─── Module switcher ──────────────────────────────────────────────────────
    function ModuleSwitcher({ active, modules, onChange }) {
      const [open, setOpen] = useState(false);
      const mod = modules.find(m => m.id === active);
      return (
        <div style={{ position: "relative", marginRight: 28 }}>
          <button onClick={() => setOpen(o => !o)}
            style={{ display: "flex", alignItems: "center", gap: 10, background: "none", border: "none", cursor: "pointer", padding: "4px 8px 4px 0", borderRadius: 8 }}>
            <span style={{ fontSize: 20 }}>{mod.icon}</span>
            <span style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 19, letterSpacing: "-0.02em" }}>
              <span style={{ color: mod.accentA }}>{mod.label.slice(0, Math.ceil(mod.label.length / 2))}</span>
              <span style={{ color: mod.accentB }}>{mod.label.slice(Math.ceil(mod.label.length / 2))}</span>
            </span>
            <span style={{ color: "#2d3f55", fontSize: 10, marginLeft: 2, display: "inline-block", transform: open ? "rotate(180deg)" : "none", transition: "transform 0.15s" }}>▾</span>
          </button>
          {open && (
            <>
              <div onClick={() => setOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 98 }} />
              <div style={{ position: "absolute", top: "calc(100% + 8px)", left: 0, background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: 6, zIndex: 99, minWidth: 200, boxShadow: "0 20px 60px rgba(0,0,0,0.7)" }}>
                <div style={{ padding: "6px 12px 4px", fontSize: 10, color: "#2d3f55", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Switch tracker</div>
                {modules.map(m => {
                  const isActive = m.id === active;
                  return (
                    <button key={m.id} onClick={() => { onChange(m.id); setOpen(false); }}
                      style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", background: isActive ? "#e2c97e12" : "transparent", border: "none", cursor: "pointer", borderRadius: 8, textAlign: "left" }}
                      onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = "#0a1520"; }}
                      onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = "transparent"; }}>
                      <span style={{ fontSize: 18 }}>{m.icon}</span>
                      <span style={{ fontSize: 13, fontWeight: isActive ? 700 : 500, color: isActive ? m.accentA : "#94a3b8" }}>{m.label}</span>
                      {isActive && <span style={{ marginLeft: "auto", color: m.accentA, fontSize: 12 }}>●</span>}
                    </button>
                  );
                })}
                <div style={{ borderTop: "1px solid #1a2535", margin: "6px 0" }} />
                <div style={{ padding: "6px 12px 2px", fontSize: 10, color: "#1e2d3d", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Coming soon</div>
                <div style={{ padding: "8px 12px", fontSize: 12, color: "#1e2d3d", fontStyle: "italic" }}>New trackers will appear here</div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ─── TrackHub shell ────────────────────────────────────────────────────────
    function TrackHub() {
      const [user,        setUser]        = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [activeId,    setActiveId]    = useState("meeplelog");

      useEffect(() => {
        _sb.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) { _sbUser = session.user; setUser(session.user); }
          setAuthLoading(false);
        });
        const { data: { subscription } } = _sb.auth.onAuthStateChange((_event, session) => {
          if (session?.user) { _sbUser = session.user; setUser(session.user); }
          else { _sbUser = null; setUser(null); }
        });
        return () => subscription.unsubscribe();
      }, []);

      if (authLoading) return (
        <div style={{ minHeight: "100vh", background: "#060d14", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ color: "#3d526a", fontSize: 14 }}>Loading…</div>
        </div>
      );

      if (!user) return <AuthScreen onAuth={u => { _sbUser = u; setUser(u); }} />;

      const handleSignOut = async () => { await _sb.auth.signOut(); _sbUser = null; setUser(null); };

      const logoSlot = (
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <ModuleSwitcher active={activeId} modules={MODULE_REGISTRY} onChange={setActiveId} />
          <button onClick={handleSignOut} title="Sign out"
            style={{ background: "none", border: "none", cursor: "pointer", color: "#2d3f55", fontSize: 13, padding: "4px 8px", borderRadius: 6, fontWeight: 600 }}
            onMouseEnter={e => e.currentTarget.style.color = "#f87171"}
            onMouseLeave={e => e.currentTarget.style.color = "#2d3f55"}>
            Sign out
          </button>
        </div>
      );

      return (
        <div style={{ minHeight: "100vh", background: "#060d14" }}>
          {activeId === "meeplelog" && <MeepleLogApp logoSlot={logoSlot} />}
          {activeId === "plottwist" && <PlotTwistApp logoSlot={logoSlot} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TrackHub />);
  </script>
</body>
</html>
