        if (b.subtitle)      out.push(`      <subtitle>${esc(b.subtitle)}</subtitle>`);
        out.push(`      <authors>${esc((b.authors || []).join("; "))}</authors>`);
        if (b.year)          out.push(`      <year>${esc(b.year)}</year>`);
        if (b.pageCount)     out.push(`      <pageCount>${b.pageCount}</pageCount>`);
        if (b.language)      out.push(`      <language>${esc(b.language)}</language>`);
        if (b.publisher)     out.push(`      <publisher>${esc(b.publisher)}</publisher>`);
        if (b.isbn13)        out.push(`      <isbn13>${esc(b.isbn13)}</isbn13>`);
        if (b.isbn10)        out.push(`      <isbn10>${esc(b.isbn10)}</isbn10>`);
        out.push(`      <reading_status>${esc(m.status.reading)}</reading_status>`);
        out.push(`      <ownership>${esc(m.status.ownership)}</ownership>`);
        if (b.rating != null)    out.push(`      <rating>${b.rating}</rating>`);
        if (b.startDate)         out.push(`      <startDate>${esc(b.startDate)}</startDate>`);
        if (b.endDate)           out.push(`      <endDate>${esc(b.endDate)}</endDate>`);
        if (b.price != null)     out.push(`      <price>${b.price}</price>`);
        if (b.notes)             out.push(`      <notes>${escCDATA(b.notes)}</notes>`);
        if (b.description)       out.push(`      <description>${escCDATA(b.description)}</description>`);
        if ((b.categories || []).length) out.push(`      <categories>${esc(b.categories.join("; "))}</categories>`);
        if (b.advScores)         out.push(`      <advScores>${escCDATA(JSON.stringify(b.advScores))}</advScores>`);
        if (b.image)             out.push(`      <image>${escCDATA(b.image)}</image>`);
        if (b.addedAt)           out.push(`      <addedAt>${esc(b.addedAt)}</addedAt>`);
        const inLists = lookup[b.id];
        if (inLists && inLists.length) out.push(`      <lists>${esc(inLists.join("; "))}</lists>`);
        out.push("    </book>");
      }
      out.push("  </books>");
      // Also dump the lists themselves (so empty lists survive a round-trip)
      out.push("  <lists>");
      for (const l of lists || []) {
        out.push(`    <list id="${esc(l.id)}" name="${esc(l.name)}" />`);
      }
      out.push("  </lists>");
      out.push("</plottwist>");
      return out.join("\n");
    }

    // Save a string to disk (NW.js writes to plottwist-exports/, browser triggers download)
    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Parse a CSV row honoring quoted fields ("a, b" stays one cell).
    function parseCSVRow(line) {
      const out = []; let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i+1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === ',' && !inQ) { out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out;
    }

    // Parse a full CSV document into rows. Properly handles quoted fields
    // containing commas AND newlines (which can happen with notes that span
    // multiple lines). We tokenise the whole document as a character stream
    // instead of splitting by "\n" first.
    function parseCSVDocument(text) {
      const rows = []; let row = []; let cur = ""; let inQ = false;
      const src = text.replace(/\r\n/g, "\n");
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (ch === '"') {
          if (inQ && src[i+1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === ',' && !inQ) {
          row.push(cur); cur = "";
        } else if (ch === '\n' && !inQ) {
          row.push(cur); cur = "";
          // Skip empty rows
          if (!(row.length === 1 && row[0] === "")) rows.push(row);
          row = [];
        } else {
          cur += ch;
        }
      }
      // Flush trailing field/row
      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        if (!(row.length === 1 && row[0] === "")) rows.push(row);
      }
      return rows;
    }

    // Read back a row dict into an internal book + the names of lists it belongs to
    function rowToBook(row, headers) {
      const idx = (n) => headers.indexOf(n);
      const get = (n) => { const i = idx(n); return i < 0 ? "" : (row[i] ?? ""); };
      const num = (s) => { const n = parseFloat(s); return isNaN(n) ? null : n; };
      const intN = (s) => { const n = parseInt(s, 10); return isNaN(n) ? null : n; };
      const arrSemi = (s) => s ? s.split(";").map(x => x.trim()).filter(Boolean) : [];
      const reading   = get("reading_status") || "unread";
      const ownership = get("ownership") || "wanted";
      const adv = (() => { try { const v = get("advScores"); return v ? JSON.parse(v) : null; } catch { return null; } })();
      const id = get("id") || ("manual_" + uuid());
      return {
        book: {
          id,
          title:        get("title"),
          authors:      arrSemi(get("authors")),
          year:         get("year") || null,
          pageCount:    intN(get("pageCount")),
          language:     get("language") || null,
          publisher:    get("publisher") || null,
          isbn13:       get("isbn13") || null,
          isbn10:       get("isbn10") || null,
          status:       { reading, ownership },
          rating:       num(get("rating")),
          startDate:    get("startDate") || null,
          endDate:      get("endDate")   || null,
          price:        num(get("price")),
          notes:        get("notes")     || "",
          categories:   arrSemi(get("categories")),
          advScores:    adv,
          addedAt:      get("addedAt")   || new Date().toISOString(),
          // image not present in CSV — leave it undefined; existing data may be preserved on merge
        },
        listNames: arrSemi(get("lists")),
      };
    }

    function importFromCSV(text) {
      const rows = parseCSVDocument(text);
      if (rows.length < 2) return { books: [], listAssignments: {} };
      const headers = rows[0].map(h => h.trim());
      const books = []; const listAssignments = {};
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.every(c => c.trim() === "")) continue;
        const { book, listNames } = rowToBook(row, headers);
        if (!book.title) continue;
        books.push(book);
        if (listNames.length) listAssignments[book.id] = listNames;
      }
      return { books, listAssignments };
    }

    function importFromXML(text) {
      const parser = new DOMParser();
      const doc    = parser.parseFromString(text, "text/xml");
      const err    = doc.querySelector("parsererror");
      if (err) throw new Error("Invalid XML");
      const get    = (el, tag) => el.querySelector(tag)?.textContent ?? "";
      const num    = (s) => { const n = parseFloat(s); return isNaN(n) ? null : n; };
      const intN   = (s) => { const n = parseInt(s, 10); return isNaN(n) ? null : n; };
      const arrSemi = (s) => s ? s.split(";").map(x => x.trim()).filter(Boolean) : [];

      const books = []; const listAssignments = {};
      const bookEls = Array.from(doc.querySelectorAll("book"));
      for (const el of bookEls) {
        const id = get(el, "id") || ("manual_" + uuid());
        const reading   = get(el, "reading_status") || "unread";
        const ownership = get(el, "ownership") || "wanted";
        const adv = (() => { try { const v = get(el, "advScores"); return v ? JSON.parse(v) : null; } catch { return null; } })();
        const book = {
          id,
          title:        get(el, "title"),
          subtitle:     get(el, "subtitle") || null,
          authors:      arrSemi(get(el, "authors")),
          year:         get(el, "year") || null,
          pageCount:    intN(get(el, "pageCount")),
          language:     get(el, "language") || null,
          publisher:    get(el, "publisher") || null,
          isbn13:       get(el, "isbn13") || null,
          isbn10:       get(el, "isbn10") || null,
          status:       { reading, ownership },
          rating:       num(get(el, "rating")),
          startDate:    get(el, "startDate") || null,
          endDate:      get(el, "endDate")   || null,
          price:        num(get(el, "price")),
          notes:        get(el, "notes")     || "",
          description:  get(el, "description") || null,
          categories:   arrSemi(get(el, "categories")),
          advScores:    adv,
          image:        get(el, "image") || null,
          addedAt:      get(el, "addedAt") || new Date().toISOString(),
        };
        if (!book.title) continue;
        books.push(book);
        const ln = arrSemi(get(el, "lists"));
        if (ln.length) listAssignments[book.id] = ln;
      }
      return { books, listAssignments };
    }

    // Merge imported books into an existing library + lists.
    // mode = "merge"   → existing kept, imported overrides matching ids, new appended
    //        "replace" → existing wiped
    function applyImport({ books, listAssignments }, currentLibrary, currentLists, mode) {
      let library;
      if (mode === "replace") {
        library = books.slice();
      } else {
        const byId = Object.fromEntries(currentLibrary.map(b => [b.id, b]));
        for (const nb of books) {
          if (byId[nb.id]) {
            // Preserve existing image if the imported one is missing (CSV doesn't carry covers)
            byId[nb.id] = { ...byId[nb.id], ...nb, image: nb.image || byId[nb.id].image };
          } else {
            byId[nb.id] = nb;
          }
        }
        library = Object.values(byId);
      }

      // Rebuild lists. Lists are referenced by NAME in the export (not id), so we
      // map name → existing list (or create new ones).
      let lists;
      if (mode === "replace") {
        // Start fresh, then create lists from the import's assignments
        lists = [];
      } else {
        lists = currentLists.map(l => ({ ...l, bookIds: l.bookIds.slice() }));
      }
      const findOrCreateList = (name) => {
        let l = lists.find(x => x.name === name);
        if (!l) {
          l = { id: "list_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, bookIds: [] };
          lists.push(l);
        }
        return l;
      };
      for (const [bookId, names] of Object.entries(listAssignments)) {
        for (const n of names) {
          const l = findOrCreateList(n);
          if (!l.bookIds.includes(bookId)) l.bookIds.push(bookId);
        }
      }
      // Drop list memberships that point to non-existent books (cleanup)
      const validIds = new Set(library.map(b => b.id));
      lists = lists.map(l => ({ ...l, bookIds: l.bookIds.filter(id => validIds.has(id)) }));

      return { library, lists };
    }


    // ─── Profiles index ──────────────────────────────────────────────────────
    const loadProfiles = async () => {
      const { data } = await _sb.from("pt_profiles").select("data").eq("user_id", _sbUser.id).single();
      return (data && data.data) ? data.data : [];
    };
    const saveProfiles = async (profiles) => {
      await _sb.from("pt_profiles").upsert({ user_id: _sbUser.id, data: profiles }, { onConflict: "user_id" });
    };
    const deleteProfileData = async (profileId) => {
      await Promise.all([
        _sb.from("pt_library").delete().eq("user_id", _sbUser.id).eq("profile_id", profileId),
        _sb.from("pt_lists").delete().eq("user_id", _sbUser.id).eq("profile_id", profileId),
      ]);
    };

    // (legacy NW.js migration removed for web build)

    // Normalize status for older records — two-axis model:
    //   reading:   "unread" | "reading"  | "read"
    //   ownership: "owned"  | "not_owned" | "wanted"
    //
    // ownership values:
    //   - owned     : you have a copy
    //   - wanted    : you don't have it but you'd like to (Wishlist)
    //   - not_owned : you don't have it and have no plans to. Useful for read
    //                 books you don't own (borrowed, library, sold, gifted away,
    //                 read but didn't want to keep).
    //
    // Legacy v0.2 migration:
    //   status.reading === "wishlist" → { reading: "unread",  ownership: "wanted" }
    //   status.reading === "reading"  → { reading: "reading", ownership: "owned"  }
    //   status.reading === "read"     → { reading: "read",    ownership: "owned"  }
    const migrateStatus = (b) => {
      if (!b) return b;
      const s = b.status;
      const validOwnership = ["owned", "wanted", "not_owned"];
      const validReading   = ["unread", "reading", "read", "onhold"];
      // Already in current format
      if (s && typeof s === "object" && validReading.includes(s.reading) && validOwnership.includes(s.ownership)) {
        return b;
      }
      // Legacy v0.2 → new
      let reading = "unread", ownership = "wanted";
      if (s && typeof s === "object") {
        if (s.reading === "reading") { reading = "reading"; ownership = "owned"; }
        else if (s.reading === "read") { reading = "read"; ownership = "owned"; }
        else if (s.reading === "wishlist") { reading = "unread"; ownership = "wanted"; }
      }
      return { ...b, status: { reading, ownership } };
    };

    // Given a book, return its effective "bucket" for filtering + badge.
    // Note: an unread+not_owned book is grouped with Wishlist (it's a book
    // you don't have, you just don't want it strongly). The Wishlist bucket
    // therefore covers all unread+non-owned regardless of intent.
    const effectiveBucket = (b) => {
      const s = migrateStatus(b).status;
      if (s.reading === "reading") return "reading";
      if (s.reading === "read")    return "read";
      if (s.reading === "onhold")  return "onhold";
      // reading === "unread"
      return s.ownership === "owned" ? "sleeping" : "wishlist";
    };

    // ─── Google Books API ─────────────────────────────────────────────────────
    const GB_BASE = "https://www.googleapis.com/books/v1/volumes";

    async function gbFetch(url) {
      const res = await fetch(url);
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`HTTP ${res.status}: ${body.slice(0, 200)}`);
      }
      return res.json();
    }

    // Upgrade Google Books cover URL from thumbnail (zoom=1, ~128px)
    // to medium (zoom=3, ~575px) — much sharper in the grid + modal.
    // Also strip &edge=curl which adds a fake page-curl artifact.
    //
    // Example:
    //   input:  books.google.com/books/content?id=X&printsec=frontcover&img=1&zoom=1&edge=curl
    //   output: books.google.com/books/content?id=X&printsec=frontcover&img=1&zoom=3
    const upgradeCoverUrl = (url) => {
      if (!url || typeof url !== "string") return url;
      // Only touch Google Books content URLs — leave user-pasted covers alone
      if (!/books\.google\.com\/books\/content/.test(url)) return url;
      let out = url.replace(/([?&])zoom=\d+/, "$1zoom=3");
      if (!/[?&]zoom=/.test(out)) out += (out.includes("?") ? "&" : "?") + "zoom=3";
      out = out.replace(/&edge=curl/g, "");
      return out;
    };

    // Google Books serves the same cover at different zoom levels but the numbering
    // is not monotonic: 6=~1280px, 4=~800px, 3=~575px, 2=~300px, 1=~128px, 5=~80px.
    // If the current size 404s, step down through what's likely to still exist.
    // We don't step UP (to 4/6) — if medium is missing, larger sizes almost never exist either.
    const COVER_FALLBACK_CHAIN = [3, 2, 1, 5];

    // Given a cover URL currently showing zoom=N, return the same URL at the next smaller
    // size in the chain, or null if we've exhausted the chain.
    const tryDowngradeCover = (url) => {
      if (!url || !/books\.google\.com\/books\/content/.test(url)) return null;
      const m = url.match(/[?&]zoom=(\d+)/);
      if (!m) return null;
      const current = parseInt(m[1], 10);
      const idx = COVER_FALLBACK_CHAIN.indexOf(current);
      // If current isn't in the chain (odd URL), start from the top
      const nextIdx = idx === -1 ? 0 : idx + 1;
      if (nextIdx >= COVER_FALLBACK_CHAIN.length) return null;
      return url.replace(/([?&])zoom=\d+/, `$1zoom=${COVER_FALLBACK_CHAIN[nextIdx]}`);
    };

    // Shared onError handler for all <img> covers — walks the fallback chain,
    // hides the img once exhausted so the parent's placeholder/background shows through.
    const handleCoverError = (e) => {
      const next = tryDowngradeCover(e.target.src);
      if (next) {
        e.target.src = next;
      } else {
        e.target.style.display = "none";
      }
    };

    // Normalize a Google Books volume → internal book entry
    function normalizeVolume(item) {
      const info = item.volumeInfo || {};
      const ids  = info.industryIdentifiers || [];
      const isbn13 = ids.find(i => i.type === "ISBN_13")?.identifier || null;
      const isbn10 = ids.find(i => i.type === "ISBN_10")?.identifier || null;
      // Prefer the largest size the API returned directly, then upgrade the URL via zoom param.
      // API only returns smallThumbnail and thumbnail in the LITE projection by default,
      // so we usually upgrade the thumbnail.
      let cover = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || null;
      if (cover) {
        cover = cover.replace(/^http:/, "https:");
        cover = upgradeCoverUrl(cover);
      }
      return {
        id:            item.id,                  // Google Books volume ID = canonical id
        googleBooksId: item.id,
        isbn13, isbn10,
        title:         info.title || "Untitled",
        subtitle:      info.subtitle || null,
        authors:       info.authors || [],
        publisher:     info.publisher || null,
        publishedDate: info.publishedDate || null,
        year:          (info.publishedDate || "").slice(0, 4) || null,
        pageCount:     info.pageCount || null,
        language:      info.language || null,
        categories:    info.categories || [],
        description:   info.description || null,
        image:         cover,
        avgRating:     info.averageRating || null,
        ratingsCount:  info.ratingsCount || null,
        infoLink:      info.infoLink || null,
      };
    }

    async function gbSearch(query, apiKey, { maxResults = 20, langRestrict = null } = {}) {
      if (!query || !query.trim()) return [];
      const params = new URLSearchParams({
        q: query.trim(),
        maxResults: String(maxResults),
        printType: "books",
        key: apiKey,
      });
      if (langRestrict) params.append("langRestrict", langRestrict);
      const data = await gbFetch(`${GB_BASE}?${params.toString()}`);
      return (data.items || []).map(normalizeVolume);
    }

    async function gbGetVolume(volumeId, apiKey) {
      const data = await gbFetch(`${GB_BASE}/${volumeId}?key=${apiKey}`);
      return normalizeVolume(data);
    }

    async function validateApiKey(key) {
      try {
        const res = await fetch(`${GB_BASE}?q=dune&maxResults=1&key=${key}`);
        if (res.status === 400 || res.status === 403) {
          const body = await res.json().catch(() => ({}));
          return { valid: false, error: body.error?.message || `HTTP ${res.status}` };
        }
        if (!res.ok) return { valid: false, error: `HTTP ${res.status}` };
        return { valid: true };
      } catch (e) {
        return { valid: false, error: e.message };
      }
    }

    // UUID helper for custom (manual) entries
    const uuid = () => "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });

    const todayISO = () => new Date().toISOString().slice(0, 10);

    // ─── SearchModal ──────────────────────────────────────────────────────────
    // Clean up an ISBN: strip spaces, hyphens, "ISBN" prefix; uppercase final X.
    // Returns cleaned digits/X (10 or 13 long) if valid, otherwise null.
    const normalizeISBN = (raw) => {
      if (!raw) return null;
      const cleaned = String(raw).replace(/[\s\-]/g, "").replace(/^ISBN[:\s]*/i, "").toUpperCase();
      if (/^\d{13}$/.test(cleaned)) return cleaned;
      if (/^\d{9}[\dX]$/.test(cleaned)) return cleaned;
      return null;
    };

    // ─── ManualBookForm ───────────────────────────────────────────────────────
    // Form to add a book manually when Google Books has nothing relevant.
    // Used inside SearchModal when mode === "manual".
    function ManualBookForm({ defaultStatus, accentColor, currency = DEFAULT_CURRENCY, onCreate }) {
      const [title,     setTitle]     = useState("");
      const [authors,   setAuthors]   = useState("");
      const [year,      setYear]      = useState("");
      const [pages,     setPages]     = useState("");
      const [language,  setLanguage]  = useState("");
      const [publisher, setPublisher] = useState("");
      const [isbn,      setIsbn]      = useState("");
      const [price,     setPrice]     = useState("");
      const [description, setDescription] = useState("");
      const [image,     setImage]     = useState(null);
      const [imgDragging, setImgDragging] = useState(false);
      const imgInputRef = useRef();
      const titleRef = useRef();
      useEffect(() => { titleRef.current?.focus(); }, []);

      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => setImage(e.target.result);
        reader.readAsDataURL(file);
      };

      const canSubmit = title.trim().length > 0;

      const buildBook = () => {
        const authorsList = authors.split(",").map(a => a.trim()).filter(Boolean);
        const cleanedIsbn = (isbn || "").replace(/[\s\-]/g, "").toUpperCase();
        const isbn13 = /^\d{13}$/.test(cleanedIsbn) ? cleanedIsbn : null;
        const isbn10 = /^\d{9}[\dX]$/.test(cleanedIsbn) ? cleanedIsbn : null;
        const yearNum = (year || "").trim();
        const priceNum = price ? parseFloat(price) : NaN;
        return {
          title:         title.trim(),
          authors:       authorsList,
          year:          yearNum || null,
          publishedDate: yearNum || null,
          pageCount:     pages ? parseInt(pages, 10) || null : null,
          language:      language || null,
          publisher:     publisher.trim() || null,
          isbn13, isbn10,
          description:   description.trim() || null,
          image:         image,
          categories:    [],
          price:         (!isNaN(priceNum) && priceNum >= 0) ? priceNum : null,
          // No googleBooksId — leaves it undefined so we know it's manual
        };
      };

      const submit = (bucket) => {
        if (!canSubmit) return;
        onCreate(buildBook(), bucket);
      };

      const fieldStyle = {
        width: "100%", background: "#080f18", border: "1px solid #7a90a8",
        borderRadius: 8, padding: "9px 12px", color: "#e2e8f0", fontSize: 13
      };
      const labelStyle = {
        display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6,
        textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {/* Cover + main fields layout */}
          <div style={{ display: "grid", gridTemplateColumns: "100px 1fr", gap: 14 }}>
            {/* Cover dropzone */}
            <div
              style={{ aspectRatio: "2 / 3", borderRadius: 8, overflow: "hidden", cursor: "pointer", position: "relative", border: imgDragging ? `2px dashed ${accentColor}` : "2px solid #1a2535", transition: "border-color 0.2s" }}
              onClick={() => imgInputRef.current?.click()}
              onDragOver={(e) => { e.preventDefault(); setImgDragging(true); }}
              onDragLeave={() => setImgDragging(false)}
              onDrop={(e) => { e.preventDefault(); setImgDragging(false); handleImageFile(e.dataTransfer.files[0]); }}>
              {image
                ? <img src={image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                : <div style={{ width: "100%", height: "100%", background: "#080f18", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
                    <span style={{ fontSize: 24 }}>📖</span>
                    <span style={{ fontSize: 12, color: "#7a90a8", textAlign: "center", lineHeight: 1.3, padding: "0 6px" }}>Click or drop a cover</span>
                  </div>}
              <input ref={imgInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleImageFile(e.target.files[0])} />
            </div>

            {/* Title + Authors */}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div>
                <label style={labelStyle}>Title <span style={{ color: "#f87171" }}>*</span></label>
                <input ref={titleRef} value={title} onChange={(e) => setTitle(e.target.value)}
                  placeholder="Book title…"
                  style={{ ...fieldStyle, fontFamily: "'Playfair Display', serif", fontSize: 16 }} />
              </div>
              <div>
                <label style={labelStyle}>Authors</label>
                <input value={authors} onChange={(e) => setAuthors(e.target.value)}
                  placeholder="Comma separated, e.g. Author One, Author Two"
                  style={fieldStyle} />
              </div>
            </div>
          </div>

          {/* Year, pages, language */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.4fr", gap: 10 }}>
            <div>
              <label style={labelStyle}>Year</label>
              <input value={year} onChange={(e) => setYear(e.target.value.replace(/[^\d]/g, "").slice(0, 4))}
                placeholder="2023" inputMode="numeric"
                style={{ ...fieldStyle, fontFamily: "'DM Mono', monospace" }} />
            </div>
            <div>
              <label style={labelStyle}>Pages</label>
              <input value={pages} onChange={(e) => setPages(e.target.value.replace(/[^\d]/g, ""))}
                placeholder="320" inputMode="numeric"
                style={{ ...fieldStyle, fontFamily: "'DM Mono', monospace" }} />
            </div>
            <div>
              <label style={labelStyle}>Language</label>
              <select value={language} onChange={(e) => setLanguage(e.target.value)}
                style={{ ...fieldStyle, cursor: "pointer" }}>
                <option value="">—</option>
                <option value="es">Spanish (es)</option>
                <option value="ca">Catalan (ca)</option>
                <option value="en">English (en)</option>
                <option value="fr">French (fr)</option>
                <option value="de">German (de)</option>
                <option value="it">Italian (it)</option>
                <option value="pt">Portuguese (pt)</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          {/* Publisher + ISBN + Price */}
          <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1.2fr 1fr", gap: 10 }}>
            <div>
              <label style={labelStyle}>Publisher</label>
              <input value={publisher} onChange={(e) => setPublisher(e.target.value)}
                placeholder="Anagrama, Penguin…"
                style={fieldStyle} />
            </div>
            <div>
              <label style={labelStyle}>ISBN</label>
              <input value={isbn} onChange={(e) => setIsbn(e.target.value)}
                placeholder="978-…"
                style={{ ...fieldStyle, fontFamily: "'DM Mono', monospace" }} />
            </div>
            <div>
              <label style={labelStyle}>Price ({currency})</label>
              <input type="number" min="0" step="0.01" value={price}
                onChange={(e) => setPrice(e.target.value)}
                placeholder="—" inputMode="decimal"
                style={{ ...fieldStyle, fontFamily: "'DM Mono', monospace", textAlign: "right" }} />
            </div>
          </div>

          {/* Description */}
          <div>
            <label style={labelStyle}>Description</label>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)}
              placeholder="Optional description / blurb…" rows={3}
              style={{ ...fieldStyle, resize: "vertical", lineHeight: 1.5, fontFamily: "inherit" }} />
          </div>

          {/* Add buttons — same buckets as the search results */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "flex-end", marginTop: 4, paddingTop: 14, borderTop: "1px solid #1a2535" }}>
            {!canSubmit && (
              <span style={{ flex: 1, fontSize: 12, color: "#8baabf", alignSelf: "center" }}>Title is required</span>
            )}
            {defaultStatus === "wishlist" ? (
              <button onClick={() => submit("wishlist")} disabled={!canSubmit}
                style={{ background: canSubmit ? "#c084fc18" : "#0a1520", color: canSubmit ? "#c084fc" : "#7a90a8", border: `1px solid ${canSubmit ? "#c084fc44" : "#1a2535"}`, borderRadius: 8, padding: "8px 16px", cursor: canSubmit ? "pointer" : "default", fontWeight: 700, fontSize: 12 }}>
                🔖 Add to Wishlist
              </button>
            ) : (
              <>
                <button onClick={() => submit("sleeping")} disabled={!canSubmit} title="Owned but unread"
                  style={{ background: canSubmit ? "#f8717118" : "#0a1520", color: canSubmit ? "#f87171" : "#7a90a8", border: `1px solid ${canSubmit ? "#f8717144" : "#1a2535"}`, borderRadius: 8, padding: "8px 14px", cursor: canSubmit ? "pointer" : "default", fontWeight: 700, fontSize: 12 }}>
                  💤 Sleeping
                </button>
                <button onClick={() => submit("reading")} disabled={!canSubmit}
                  style={{ background: canSubmit ? "#fb923c18" : "#0a1520", color: canSubmit ? "#fb923c" : "#7a90a8", border: `1px solid ${canSubmit ? "#fb923c44" : "#1a2535"}`, borderRadius: 8, padding: "8px 14px", cursor: canSubmit ? "pointer" : "default", fontWeight: 700, fontSize: 12 }}>
                  📖 Reading
                </button>
                <button onClick={() => submit("read")} disabled={!canSubmit}
                  style={{ background: canSubmit ? "#e2c97e" : "#1a2535", color: canSubmit ? "#0f172a" : "#7a90a8", border: "none", borderRadius: 8, padding: "8px 16px", cursor: canSubmit ? "pointer" : "default", fontWeight: 700, fontSize: 12 }}>
                  ✓ Read

        </div>
      );
    }

    function SearchModal({ onAdd, existingIds, defaultStatus, apiKey, offlineMode = false, currency = DEFAULT_CURRENCY, onClose }) {
      const [mode,      setMode]     = useState(offlineMode ? "manual" : "text"); // "text" | "isbn" | "manual"
      const [query,     setQuery]    = useState("");
      const [results,   setResults]  = useState([]);
      const [added,     setAdded]    = useState(new Set(existingIds));
      const [searching, setSearching] = useState(false);
      const [error,     setError]    = useState(null);
      const [isbnInvalid, setIsbnInvalid] = useState(false);
      const inputRef = useRef();
      const timerRef = useRef();
      useEffect(() => { inputRef.current?.focus(); }, []);

      // Refocus input when mode changes, and reset results/errors
      useEffect(() => {
        setResults([]);
        setError(null);
        setIsbnInvalid(false);
        inputRef.current?.focus();
      }, [mode]);

      // Search effect — debounced for text, immediate once ISBN is valid
      useEffect(() => {
        clearTimeout(timerRef.current);
        const q = query.trim();

        if (mode === "manual") {
          // Manual entry — no API search
          return;
        }

        if (mode === "isbn") {
          if (!q) { setResults([]); setError(null); setIsbnInvalid(false); return; }
          const isbn = normalizeISBN(q);
          if (!isbn) {
            // User is still typing; mark invalid but don't hit the API
            setIsbnInvalid(true);
            setResults([]);
            setError(null);
            return;
          }
          setIsbnInvalid(false);
          // Valid ISBN — run right away, no debounce
          (async () => {
            setSearching(true);
            setError(null);
            try {
              const res = await gbSearch(`isbn:${isbn}`, apiKey, { maxResults: 10 });
              setResults(res);
            } catch (e) {
              setError(e.message);
              setResults([]);
            }
            setSearching(false);
          })();
          return;
        }

        // Text mode — debounced
        if (!q || q.length < 2) { setResults([]); setError(null); return; }
        timerRef.current = setTimeout(async () => {
          setSearching(true);
          setError(null);
          try {
            const res = await gbSearch(q, apiKey, { maxResults: 20 });
            setResults(res);
          } catch (e) {
            setError(e.message);
            setResults([]);
          }
          setSearching(false);
        }, 600);
        return () => clearTimeout(timerRef.current);
      }, [query, mode, apiKey]);

      // bucket: "wishlist" | "sleeping" | "reading" | "read"
      const handleAdd = (result, bucket) => {
        if (added.has(result.id)) return;
        let status;
        let extra = {};
        if (bucket === "wishlist")      status = { reading: "unread",  ownership: "wanted" };
        else if (bucket === "sleeping") status = { reading: "unread",  ownership: "owned"  };
        else if (bucket === "reading")  { status = { reading: "reading", ownership: "owned" }; extra.startDate = todayISO(); }
        else if (bucket === "read")     { status = { reading: "read",    ownership: "owned" }; extra.endDate = todayISO(); }
        onAdd({ ...result, ...extra, status, addedAt: new Date().toISOString() });
        setAdded(a => new Set([...a, result.id]));
      };

      const titleColor = defaultStatus === "wishlist" ? "#c084fc" : "#e2c97e";
      const titleLabel = defaultStatus === "wishlist" ? "Add to Wishlist" : "Add to Library";

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.88)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 18, width: 620, maxHeight: "85vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 40px 120px rgba(0,0,0,0.95)" }}>

            {/* Header: title + close */}
            <div style={{ padding: "20px 24px 14px", borderBottom: "1px solid #1a2535", flexShrink: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
                <h3 style={{ fontFamily: "'Playfair Display', serif", fontSize: 19, color: titleColor, margin: 0, flex: 1 }}>{titleLabel}</h3>
                <button onClick={onClose} style={{ background: "#0f1923", border: "1px solid #1a2535", color: "#64748b", borderRadius: 8, width: 32, height: 32, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✕</button>
              </div>

              {/* Mode toggle + input — toggle hidden when offline (only Manual makes sense) */}
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                {!offlineMode && (
                  <div style={{ display: "flex", background: "#080f18", border: "1px solid #7a90a8", borderRadius: 8, padding: 3, flexShrink: 0 }}>
                    {[
                      { val: "text",   label: "Title / Author" },
                      { val: "isbn",   label: "ISBN" },
                      { val: "manual", label: "Manual" },
                    ].map(({ val, label }) => {
                      const active = mode === val;
                      return (
                        <button key={val} onClick={() => { setMode(val); setQuery(""); }}
                          style={{ padding: "6px 12px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: active ? titleColor : "transparent", color: active ? "#0f172a" : "#8baabf", fontFamily: "inherit" }}>
                          {label}
                        </button>
                      );
                    })}
                  </div>
                )}
                {mode !== "manual" && (
                  <input ref={inputRef} value={query} onChange={(e) => setQuery(e.target.value)}
                    placeholder={mode === "isbn" ? "e.g. 978-84-339-9825-5" : "Title or author…"}
                    style={{ flex: 1, background: "#080f18", border: `1px solid ${isbnInvalid ? "#5a2a30" : "#7a90a8"}`, borderRadius: 10, padding: "10px 14px", color: "#e2e8f0", fontSize: 14, fontFamily: mode === "isbn" ? "'DM Mono', monospace" : "inherit" }}
                    onFocus={(e) => e.target.style.borderColor = isbnInvalid ? "#5a2a30" : `${titleColor}66`}
                    onBlur={(e) => e.target.style.borderColor = isbnInvalid ? "#5a2a30" : "#7a90a8"} />
                )}
                {mode === "manual" && (
                  <div style={{ flex: 1, fontSize: 12, color: "#8baabf", paddingLeft: offlineMode ? 0 : 8 }}>
                    {offlineMode
                      ? "Offline mode — fill in what you know. Only Title is required."
                      : "Fill in what you know — only Title is required."}
                  </div>
                )}
              </div>
            </div>

            <div style={{ flex: 1, overflowY: "auto", padding: "14px 24px 20px" }}>
              {mode === "manual" ? (
                <ManualBookForm
                  defaultStatus={defaultStatus}
                  accentColor={titleColor}
                  currency={currency}
                  onCreate={(book, bucket) => {
                    let status, extra = {};
                    if (bucket === "wishlist")      status = { reading: "unread",  ownership: "wanted" };
                    else if (bucket === "sleeping") status = { reading: "unread",  ownership: "owned"  };
                    else if (bucket === "reading")  { status = { reading: "reading", ownership: "owned" }; extra.startDate = todayISO(); }
                    else if (bucket === "read")     { status = { reading: "read",    ownership: "owned" }; extra.endDate = todayISO(); }
                    onAdd({
                      id: "manual_" + uuid(),
                      ...book,
                      ...extra,
                      status,
                      addedAt: new Date().toISOString(),
                    });
                    onClose();
                  }}
                />
              ) : (
                <>
              {error && (
                <div style={{ padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 13, marginBottom: 12 }}>
                  Error: {error}
                </div>
              )}
              {mode === "isbn" && isbnInvalid && query.trim().length > 0 && (
                <div style={{ color: "#f87171", fontSize: 12, padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, marginBottom: 12 }}>
                  Not a valid ISBN yet — expecting 10 or 13 digits (hyphens and spaces are fine).
                </div>
              )}
              {searching && <div style={{ color: "#8baabf", fontSize: 13, padding: "20px 0", textAlign: "center" }}>Searching…</div>}
              {!searching && mode === "text" && query.trim().length >= 2 && results.length === 0 && !error && (
                <div style={{ color: "#8baabf", fontSize: 13, padding: "20px 0", textAlign: "center" }}>
                  No results.
                  <div style={{ fontSize: 12, color: "#7a90a8", marginTop: 6 }}>
                    Can't find it? <button onClick={() => { setMode("manual"); setQuery(""); }} style={{ background: "none", border: "none", color: titleColor, cursor: "pointer", fontSize: 12, padding: 0, textDecoration: "underline" }}>Add it manually →</button>
                  </div>
                </div>
              )}
              {!searching && mode === "isbn" && !isbnInvalid && normalizeISBN(query) && results.length === 0 && !error && (
                <div style={{ color: "#8baabf", fontSize: 13, padding: "20px 0", textAlign: "center" }}>
                  No book found for this ISBN.
                  <div style={{ fontSize: 12, color: "#7a90a8", marginTop: 4 }}>Try the other ISBN format (10 vs 13 digits), Title / Author search, or <button onClick={() => { setMode("manual"); setQuery(""); }} style={{ background: "none", border: "none", color: titleColor, cursor: "pointer", fontSize: 12, padding: 0, textDecoration: "underline" }}>add it manually</button>.</div>
                </div>
              )}
              {results.map(r => {
                const isAdded = added.has(r.id);
                return (
                  <div key={r.id} style={{ display: "flex", gap: 12, padding: "10px 0", borderBottom: "1px solid #0f1923", alignItems: "center" }}>
                    <div style={{ width: 40, height: 60, borderRadius: 4, background: "#080f18", border: "1px solid #1a2535", flexShrink: 0, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {r.image
                        ? <img src={r.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={handleCoverError} />
                        : <span style={{ fontSize: 18 }}>📖</span>}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, fontFamily: "'Playfair Display', serif", color: "#e2e8f0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {r.title}
                        {r.year && <span style={{ color: "#8baabf", fontWeight: 400, fontSize: 12 }}> ({r.year})</span>}
                      </div>
                      <div style={{ fontSize: 12, color: "#7a90a8", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {(r.authors || []).join(", ") || "—"}
                        {r.publisher && <span style={{ color: "#7a90a8" }}> · {r.publisher}</span>}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                      {isAdded ? (
                        <button disabled style={{ background: "#0a1929", color: "#4ade80", border: "1px solid #1a3d1a", borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 700, minWidth: 80 }}>✓ Added</button>
                      ) : defaultStatus === "wishlist" ? (
                        <button onClick={() => handleAdd(r, "wishlist")}
                          style={{ background: "#c084fc18", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "7px 14px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>🔖 Wishlist</button>
                      ) : (
                        <>
                          <button onClick={() => handleAdd(r, "sleeping")} title="Owned but unread"
                            style={{ background: "#f8717118", color: "#f87171", border: "1px solid #f8717144", borderRadius: 8, padding: "7px 10px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>💤 Sleeping</button>
                          <button onClick={() => handleAdd(r, "reading")}
                            style={{ background: "#fb923c18", color: "#fb923c", border: "1px solid #fb923c44", borderRadius: 8, padding: "7px 10px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>📖 Reading</button>
                          <button onClick={() => handleAdd(r, "read")}
                            style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "7px 12px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>✓ Read</button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }


    // ─── BookModal (detail / edit) ────────────────────────────────────────────
    function BookModal({ entry, lists = [], currency = DEFAULT_CURRENCY, onToggleList, onSave, onDelete, onClose }) {
      const [edit, setEdit] = useState(() => {
        const migrated = migrateStatus(entry);
        return {
          rating: null, notes: "", readYear: null, startDate: null, endDate: null,
          advScores: {}, _infoOpen: false, _advOpen: false,
          ...migrated,
        };
      });
      const [imgDragging, setImgDragging] = useState(false);
      const imgInputRef = useRef();

      const set = (k, v) => setEdit(e => ({ ...e, [k]: v }));

      // Two-axis status setters. Business rules:
      //   reading=reading ⇒ ownership auto-upgraded to "owned" (you've clearly got it in hand)
      //   reading=read    ⇒ ownership left as-is (you can read a borrowed book without owning it)
      const setReading = (reading) => {
        setEdit(e => {
          const next = { ...e, status: { ...e.status, reading } };
          // Auto-upgrade ownership from wanted→owned only when actively reading or on hold
          if ((reading === "reading" || reading === "onhold") && next.status.ownership === "wanted") {
            next.status.ownership = "owned";
          }
          if (reading === "reading" && !next.startDate) next.startDate = todayISO();
          if (reading === "read" && !next.endDate) next.endDate = todayISO();
          return next;
        });
      };
      const setOwnership = (ownership) => {
        setEdit(e => ({ ...e, status: { ...e.status, ownership } }));
      };

      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => set("image", e.target.result);
        reader.readAsDataURL(file);
      };

      const setRating = (raw) => {
        if (raw === "" || raw == null) { set("rating", null); return; }
        let n = parseFloat(raw);
        if (isNaN(n)) return;
        n = Math.round(n * 10) / 10;
        n = Math.min(10, Math.max(0, n));
        set("rating", n);
      };

      // Advanced scores → rolled up to .rating when filled
      const ADV_FIELDS = [
        { key: "plot",         label: "Plot" },
        { key: "characters",   label: "Characters" },
        { key: "prose",        label: "Prose" },
        { key: "pacing",       label: "Pacing" },
        { key: "originality",  label: "Originality" },
        { key: "enjoyment",    label: "Enjoyment" },
      ];
      const adv = edit.advScores || {};
      const setAdv = (k, raw) => {
        let val = null;
        if (raw !== "" && raw !== null) {
          let n = parseFloat(raw);
          if (!isNaN(n)) val = Math.min(10, Math.max(0, Math.round(n * 10) / 10));
        }
        const newAdv = { ...adv, [k]: val };
        const filled = ADV_FIELDS.filter(f => newAdv[f.key] != null);
        const newAvg = filled.length > 0
          ? Math.round((filled.reduce((s,f) => s + newAdv[f.key], 0) / filled.length) * 10) / 10
          : null;
        setEdit(e => ({ ...e, advScores: newAdv, rating: newAvg ?? e.rating }));
      };
      const advFilled  = ADV_FIELDS.filter(f => adv[f.key] != null);
      const advOverall = advFilled.length > 0
        ? (advFilled.reduce((s,f) => s + adv[f.key], 0) / advFilled.length).toFixed(1)
        : null;

      const readingStatus = edit.status.reading;
      const ownership = edit.status.ownership;

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.9)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 18, width: 540, maxHeight: "92vh", overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 40px 120px rgba(0,0,0,0.95)" }}>

            {/* Header with cover */}
            <div style={{ position: "relative", padding: "22px 28px 20px", background: "linear-gradient(135deg, #0d1825, #0f2035)", borderBottom: "1px solid #1a2535", flexShrink: 0 }}>
              <button onClick={onClose} style={{ position: "absolute", top: 16, right: 16, background: "rgba(0,0,0,0.4)", border: "1px solid #7a90a8", color: "#94a3b8", borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 16 }}>
                {/* Clickable cover */}
                <div
                  style={{ width: 80, height: 120, borderRadius: 6, overflow: "hidden", flexShrink: 0, position: "relative", cursor: "pointer", border: imgDragging ? "2px dashed #e2c97e" : "2px solid #1a2535", transition: "border-color 0.2s" }}
                  onClick={() => imgInputRef.current?.click()}
                  onDragOver={(e) => { e.preventDefault(); setImgDragging(true); }}
                  onDragLeave={() => setImgDragging(false)}
                  onDrop={(e) => { e.preventDefault(); setImgDragging(false); handleImageFile(e.dataTransfer.files[0]); }}>
                  {edit.image
                    ? <img src={edit.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }}
                        onError={handleCoverError} />
                    : <div style={{ width: "100%", height: "100%", background: "#080f18", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
                        <span style={{ fontSize: 22 }}>📖</span>
                        <span style={{ fontSize: 12, color: "#7a90a8", textAlign: "center", lineHeight: 1.3 }}>Add<br/>cover</span>
                      </div>}
                  <input ref={imgInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleImageFile(e.target.files[0])} />
                </div>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <h2 style={{ margin: "0 0 4px", fontFamily: "'Playfair Display', serif", color: "#e2e8f0", fontSize: 20, lineHeight: 1.25 }}>{edit.title || entry.title}</h2>
                  {entry.subtitle && <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 6, fontStyle: "italic" }}>{entry.subtitle}</div>}
                  <div style={{ fontSize: 13, color: "#94a3b8", marginBottom: 6 }}>{(edit.authors || entry.authors || []).join(", ") || "—"}</div>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", fontSize: 12, color: "#8baabf" }}>
                    {(edit.year || entry.year) && <span>{edit.year || entry.year}</span>}
                    {(edit.publisher || entry.publisher) && <span>{edit.publisher || entry.publisher}</span>}
                    {(edit.pageCount || entry.pageCount) && <span>📄 {edit.pageCount || entry.pageCount}p</span>}
                    {(edit.language || entry.language) && <span style={{ textTransform: "uppercase" }}>{edit.language || entry.language}</span>}
                  </div>
                  <div style={{ marginTop: 8, fontSize: 12, color: "#2a3a4a" }}>
                    Click cover or drop an image to replace it
                    {edit.image && <button onClick={() => set("image", null)} style={{ marginLeft: 8, background: "none", border: "none", color: "#f87171", cursor: "pointer", fontSize: 12, padding: 0 }}>✕ Remove</button>}
                  </div>
                </div>
              </div>
            </div>

            <div style={{ overflowY: "auto", flex: 1, padding: "22px 28px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

                {/* Reading status */}
                <div>
                  <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Reading status</label>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {[
                      { val: "unread",  label: "Unread",     color: "#7a90a8" },
                      { val: "reading", label: "📖 Reading", color: "#fb923c" },
                      { val: "onhold",  label: "⏸ On hold",  color: "#f59e0b" },
                      { val: "read",    label: "✓ Read",     color: "#4ade80" },
                    ].map(({ val, label, color }) => {
                      const active = readingStatus === val;
                      return (
                        <button key={val} onClick={() => setReading(val)}
                          style={{ padding: "8px 16px", borderRadius: 8, border: `1px solid ${active ? color : "#1a2535"}`, background: active ? `${color}22` : "transparent", color: active ? color : "#8baabf", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
                          {label}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Ownership */}
                <div>
                  <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Ownership</label>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                    {[
                      { val: "owned",     label: "🏠 Owned",     color: "#e2c97e" },
                      { val: "not_owned", label: "✕ Not owned",  color: "#94a3b8" },
                      { val: "wanted",    label: "🔖 Wishlist",  color: "#c084fc" },
                    ].map(({ val, label, color }) => {
                      const active = ownership === val;
                      return (
                        <button key={val} onClick={() => setOwnership(val)}
                          style={{ padding: "8px 16px", borderRadius: 8, border: `1px solid ${active ? color : "#1a2535"}`, background: active ? `${color}22` : "transparent", color: active ? color : "#8baabf", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
                          {label}
                        </button>
                      );
                    })}
                    {readingStatus === "unread" && ownership === "owned" && (
                      <span style={{ marginLeft: 4, padding: "4px 10px", background: "#f8717118", border: "1px solid #f8717144", borderRadius: 20, fontSize: 12, color: "#f87171", fontWeight: 600 }}>💤 On your Sleeping Shelf</span>
                    )}
                  </div>
                </div>

                {/* Rating + dates row */}
                <div style={{ display: "flex", gap: 20, alignItems: "flex-start" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                      <label style={{ fontSize: 12, color: "#7a90a8", textTransform: "uppercase", letterSpacing: "0.08em" }}>Your Rating</label>
                      {advOverall !== null && <span style={{ fontSize: 12, color: "#8baabf" }}>adv. active</span>}
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <input type="number" min="0" max="10" step="0.1"
                        value={edit.rating ?? ""} placeholder="—"
                        onChange={(e) => setRating(e.target.value)}
                        style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2c97e", fontSize: 20, fontFamily: "'DM Mono', monospace", fontWeight: 700, textAlign: "center" }}
                        onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                        onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                      {edit.rating !== null && edit.rating !== undefined && (
                        <button onClick={() => set("rating", null)} style={{ background: "none", border: "none", color: "#7a90a8", cursor: "pointer", fontSize: 12, padding: 0, whiteSpace: "nowrap" }}>✕</button>
                      )}
                    </div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Started</label>
                    <input type="date" value={edit.startDate || ""} onChange={(e) => set("startDate", e.target.value || null)}
                      style={{ width: "100%", background: "#080f18", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13 }} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Finished</label>
                    <input type="date" value={edit.endDate || ""} onChange={(e) => set("endDate", e.target.value || null)}
                      style={{ width: "100%", background: "#080f18", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13 }} />
                  </div>
                </div>

                {/* Price (purchase) */}
                <div style={{ display: "flex", gap: 20, alignItems: "flex-end" }}>
                  <div style={{ width: 200 }}>
                    <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Purchase price</label>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <input type="number" min="0" step="0.01"
                        value={edit.price ?? ""} placeholder="—"
                        onChange={(e) => {
                          const raw = e.target.value;
                          if (raw === "") { set("price", null); return; }
                          const n = parseFloat(raw);
                          set("price", isNaN(n) ? null : Math.max(0, n));
                        }}
                        style={{ width: "100%", background: "#080f18", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 14, fontFamily: "'DM Mono', monospace", textAlign: "right" }}
                        onFocus={(e) => e.target.style.borderColor = "#60a5fa44"}
                        onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                      <span style={{ fontSize: 12, color: "#7a90a8", fontFamily: "'DM Mono', monospace", whiteSpace: "nowrap" }}>{currency}</span>
                      {edit.price != null && (
                        <button onClick={() => set("price", null)} style={{ background: "none", border: "none", color: "#7a90a8", cursor: "pointer", fontSize: 12, padding: 0 }}>✕</button>
                      )}
                    </div>
                  </div>
                  <div style={{ flex: 1, fontSize: 12, color: "#7a90a8", paddingBottom: 10 }}>
                    Optional. Counts toward your spend stats.
                  </div>
                </div>

                {/* Notes */}
                <div>
                  <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>Notes</label>
                  <textarea value={edit.notes || ""} onChange={(e) => set("notes", e.target.value)}
                    placeholder="Your thoughts on this book…" rows={4}
                    style={{ width: "100%", background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "10px 14px", color: "#e2e8f0", fontSize: 14, resize: "vertical", lineHeight: 1.6 }} />
                </div>

                {/* Lists (only shown if at least one custom list exists) */}
                {lists.length > 0 && (
                  <div>
                    <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Lists</label>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      {lists.map(l => {
                        const inList = l.bookIds.includes(entry.id);
                        return (
                          <button key={l.id} onClick={() => onToggleList && onToggleList(l.id)}
                            style={{ padding: "7px 14px", borderRadius: 20, border: `1px solid ${inList ? "#60a5fa" : "#1a2535"}`, background: inList ? "#60a5fa22" : "transparent", color: inList ? "#60a5fa" : "#7a90a8", cursor: "pointer", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
                            {inList && <span style={{ fontSize: 12 }}>✓</span>}
                            {l.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Advanced Scores (collapsible) */}
                <div style={{ border: "1px solid #1a2535", borderRadius: 8, overflow: "hidden" }}>
                  <button onClick={() => set("_advOpen", !edit._advOpen)}
                    style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", background: "#080f18", border: "none", cursor: "pointer", textAlign: "left" }}>
                    <span style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Advanced Scores</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {advOverall && <span style={{ fontSize: 12, color: "#e2c97e", fontFamily: "'DM Mono', monospace" }}>Overall {advOverall}</span>}
                      <span style={{ color: "#7a90a8", fontSize: 12, display: "inline-block", transform: edit._advOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>▾</span>
                    </div>
                  </button>
                  {edit._advOpen && (
                    <div style={{ padding: "14px", background: "#060d14", borderTop: "1px solid #1a2535", display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "12px 10px" }}>
                      {ADV_FIELDS.map(f => (
                        <div key={f.key}>
                          <div style={{ fontSize: 12, color: "#8baabf", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>{f.label}</div>
                          <input type="number" min="0" max="10" step="0.1"
                            value={adv[f.key] ?? ""} placeholder="—"
                            onChange={(e) => setAdv(f.key, e.target.value)}
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "7px 4px", color: "#e2c97e", fontSize: 15, fontFamily: "'DM Mono', monospace", fontWeight: 600, textAlign: "center" }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Book Info — editable metadata */}
                <div style={{ border: "1px solid #1a2535", borderRadius: 8, overflow: "hidden" }}>
                  <button onClick={() => set("_infoOpen", !edit._infoOpen)}
                    style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", background: "#080f18", border: "none", cursor: "pointer", textAlign: "left" }}>
                    <span style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Book Info</span>
                    <span style={{ color: "#7a90a8", fontSize: 12, display: "inline-block", transform: edit._infoOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>▾</span>
                  </button>
                  {edit._infoOpen && (
                    <div style={{ padding: "14px 16px", background: "#060d14", borderTop: "1px solid #1a2535", display: "flex", flexDirection: "column", gap: 12 }}>
                      {/* Title */}
                      <div>
                        <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Title</label>
                        <input value={edit.title || ""} onChange={(e) => set("title", e.target.value)}
                          style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 14, fontFamily: "'Playfair Display', serif" }}
                          onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                          onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                      </div>
                      {/* Authors */}
                      <div>
                        <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Authors <span style={{ textTransform: "none", fontWeight: 400, opacity: 0.6 }}>(comma separated)</span></label>
                        <input value={(edit.authors || []).join(", ")} onChange={(e) => set("authors", e.target.value.split(",").map(a => a.trim()).filter(Boolean))}
                          placeholder="Author One, Author Two"
                          style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13 }}
                          onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                          onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                      </div>
                      {/* Year + Pages row */}
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Year</label>
                          <input value={edit.year || ""} onChange={(e) => set("year", e.target.value || null)}
                            placeholder="e.g. 2021"
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13, fontFamily: "'DM Mono', monospace" }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Pages</label>
                          <input type="number" min="1" value={edit.pageCount ?? ""} onChange={(e) => { const n = parseInt(e.target.value, 10); set("pageCount", isNaN(n) ? null : n); }}
                            placeholder="—"
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13, fontFamily: "'DM Mono', monospace" }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                      </div>
                      {/* Publisher + Language row */}
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Publisher</label>
                          <input value={edit.publisher || ""} onChange={(e) => set("publisher", e.target.value || null)}
                            placeholder="—"
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13 }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Language</label>
                          <input value={edit.language || ""} onChange={(e) => set("language", e.target.value || null)}
                            placeholder="e.g. en"
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 13, fontFamily: "'DM Mono', monospace" }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                      </div>
                      {/* ISBNs row */}
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>ISBN-13</label>
                          <input value={edit.isbn13 || ""} onChange={(e) => set("isbn13", e.target.value || null)}
                            placeholder="—"
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#94a3b8", fontSize: 12, fontFamily: "'DM Mono', monospace" }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#8baabf", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>ISBN-10</label>
                          <input value={edit.isbn10 || ""} onChange={(e) => set("isbn10", e.target.value || null)}
                            placeholder="—"
                            style={{ width: "100%", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 6, padding: "8px 10px", color: "#94a3b8", fontSize: 12, fontFamily: "'DM Mono', monospace" }}
                            onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
                            onBlur={(e) => e.target.style.borderColor = "#1a2535"} />
                        </div>
                      </div>
                      {/* Description (read-only) */}
                      {entry.description && (
                        <div style={{ paddingTop: 10, borderTop: "1px solid #1a2535", color: "#7a90a8", fontSize: 12, lineHeight: 1.6 }}
                             dangerouslySetInnerHTML={{ __html: entry.description }} />
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Footer */}
            <div style={{ padding: "16px 24px", borderTop: "1px solid #1a2535", background: "#080f18", display: "flex", gap: 10, flexShrink: 0 }}>
              <button onClick={() => onDelete(entry.id)}
                style={{ background: "transparent", border: "1px solid #5a2a30", color: "#f87171", borderRadius: 8, padding: "9px 16px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
                Delete
              </button>
              <div style={{ flex: 1 }} />
              <button onClick={onClose}
                style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 8, padding: "9px 18px", cursor: "pointer", fontSize: 13 }}>
                Cancel
              </button>
              <button onClick={() => onSave(edit)}
                style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "9px 22px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>
