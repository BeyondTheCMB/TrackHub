    // ─── StatsPanel ───────────────────────────────────────────────────────────
    function StatsPanel({ library, currency = DEFAULT_CURRENCY }) {
      const read     = library.filter(b => effectiveBucket(b) === "read");
      const reading  = library.filter(b => effectiveBucket(b) === "reading");
      const onhold   = library.filter(b => effectiveBucket(b) === "onhold");
      const sleeping = library.filter(b => effectiveBucket(b) === "sleeping");
      const wishlist = library.filter(b => effectiveBucket(b) === "wishlist");

      const totalPages = read.reduce((s, b) => s + (b.pageCount || 0), 0);
      const rated = read.filter(b => b.rating != null);
      const avgRating = rated.length ? (rated.reduce((s, b) => s + b.rating, 0) / rated.length).toFixed(2) : "—";

      // Books per year (by endDate)
      const byYear = {};
      read.forEach(b => {
        const y = (b.endDate || "").slice(0, 4);
        if (y) byYear[y] = (byYear[y] || 0) + 1;
      });
      const years = Object.keys(byYear).sort().reverse();

      // Top categories
      const catCounts = {};
      library.forEach(b => (b.categories || []).forEach(c => { catCounts[c] = (catCounts[c] || 0) + 1; }));
      const topCats = Object.entries(catCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

      // Top authors
      const authCounts = {};
      library.forEach(b => (b.authors || []).forEach(a => { authCounts[a] = (authCounts[a] || 0) + 1; }));
      const topAuthors = Object.entries(authCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

      // Languages
      const langCounts = {};
      library.forEach(b => { if (b.language) langCounts[b.language] = (langCounts[b.language] || 0) + 1; });
      const langs = Object.entries(langCounts).sort((a, b) => b[1] - a[1]);

      // Spending — only count books the user owns (excludes wishlist & not_owned).
      // The price field is the purchase price the user entered manually.
      const ownedBooks = library.filter(b => migrateStatus(b).status.ownership === "owned");
      const pricedBooks = ownedBooks.filter(b => typeof b.price === "number" && b.price > 0);
      const totalSpend = pricedBooks.reduce((sum, b) => sum + b.price, 0);
      const avgPrice = pricedBooks.length > 0 ? totalSpend / pricedBooks.length : null;
      const spendSubtitle = pricedBooks.length > 0
        ? `across ${pricedBooks.length} of ${ownedBooks.length} owned`
        : "Add prices in any book's modal";

      const card = (title, content) => (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "18px 20px" }}>
          <div style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 12 }}>{title}</div>
          {content}
        </div>
      );

      const kpi = (label, value, color = "#e2c97e", subtitle = null) => (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "18px 20px" }}>
          <div style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 8 }}>{label}</div>
          <div style={{ fontSize: 30, fontFamily: "'DM Mono', monospace", fontWeight: 700, color }}>{value}</div>
          {subtitle && (
            <div style={{ fontSize: 12, color: "#8baabf", fontFamily: "'DM Mono', monospace", marginTop: 4 }}>{subtitle}</div>
          )}
        </div>
      );

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          {/* KPIs */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
            {kpi("Read", read.length)}
            {kpi("Reading", reading.length, "#fb923c")}
            {kpi("On hold", onhold.length, "#f59e0b")}
            {kpi("Sleeping Shelf", sleeping.length, "#f87171")}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
            {kpi("Wishlist", wishlist.length, "#c084fc")}
            {kpi("Avg rating", avgRating)}
            {kpi("Pages read (tot)", totalPages.toLocaleString(), "#60a5fa")}
            {kpi("Total spent", formatPrice(totalSpend, currency), "#a78bfa", spendSubtitle)}
          </div>
          {avgPrice !== null && pricedBooks.length >= 3 && (
            <div style={{ fontSize: 12, color: "#8baabf", textAlign: "right", marginTop: -8, fontFamily: "'DM Mono', monospace" }}>
              avg {formatPrice(avgPrice, currency)} per book (of those with a price)
            </div>
          )}

          {/* By year */}
          {years.length > 0 && card("Books read per year", (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {years.map(y => {
                const max = Math.max(...years.map(yy => byYear[yy]));
                const pct = (byYear[y] / max) * 100;
                return (
                  <div key={y} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ width: 48, fontFamily: "'DM Mono', monospace", fontSize: 13, color: "#7a90a8" }}>{y}</div>
                    <div style={{ flex: 1, height: 8, background: "#080f18", borderRadius: 4, overflow: "hidden" }}>
                      <div style={{ width: `${pct}%`, height: "100%", background: "#e2c97e" }} />
                    </div>
                    <div style={{ width: 36, textAlign: "right", fontFamily: "'DM Mono', monospace", fontSize: 13, color: "#e2c97e" }}>{byYear[y]}</div>
                  </div>
                );
              })}
            </div>
          ))}

          {/* Two-column: authors + categories */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            {card("Top authors", (
              topAuthors.length === 0 ? <div style={{ color: "#8baabf", fontSize: 13 }}>No data yet.</div> :
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {topAuthors.map(([a, n]) => (
                  <div key={a} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: "1px solid #0f1923" }}>
                    <span style={{ fontSize: 13, color: "#e2e8f0", fontFamily: "'Playfair Display', serif" }}>{a}</span>
                    <span style={{ fontSize: 12, color: "#60a5fa", fontFamily: "'DM Mono', monospace" }}>{n}</span>
                  </div>
                ))}
              </div>
            ))}
            {card("Top categories", (
              topCats.length === 0 ? <div style={{ color: "#8baabf", fontSize: 13 }}>No data yet.</div> :
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {topCats.map(([c, n]) => (
                  <span key={c} style={{ padding: "4px 10px", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 20, fontSize: 12, color: "#7a90a8" }}>
                    {c} <span style={{ color: "#e2c97e", fontFamily: "'DM Mono', monospace" }}>{n}</span>
                  </span>
                ))}
              </div>
            ))}
          </div>

          {/* Languages */}
          {langs.length > 0 && card("Languages", (
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              {langs.map(([l, n]) => (
                <div key={l} style={{ padding: "6px 12px", background: "#0a1520", border: "1px solid #1a2535", borderRadius: 8, display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 12, color: "#7a90a8", textTransform: "uppercase", fontFamily: "'DM Mono', monospace" }}>{l}</span>
                  <span style={{ fontSize: 14, color: "#4ade80", fontFamily: "'DM Mono', monospace", fontWeight: 700 }}>{n}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    // ─── ApiKeySetup (first run / reconfigure) ────────────────────────────────

      const [key, setKey] = useState(initialKey);
      const [validating, setValidating] = useState(false);
      const [error, setError] = useState(null);

      const save = async () => {
        setError(null);
        if (!key.trim()) { setError("Enter an API key, or work offline below."); return; }
        setValidating(true);
        const { valid, error } = await validateApiKey(key.trim());
        setValidating(false);
        if (!valid) { setError(`Invalid key: ${error}`); return; }
        // Preserve any existing config (e.g. activeProfileId, currency) when saving the key
        saveConfig({ ...loadConfig(), apiKey: key.trim(), offlineMode: false });
        onSaved(key.trim());
      };

      const goOffline = () => {
        saveConfig({ ...loadConfig(), apiKey: null, offlineMode: true });
        onWorkOffline && onWorkOffline();
      };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #060d14 0%, #0d1825 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>

    // ─── Main App ─────────────────────────────────────────────────────────────
    function App({ logoSlot, profileId, profileChip }) {
      const [ptLoading,      setPtLoading]      = useState(true);
      const [ptRefreshing,   setPtRefreshing]   = useState(false);
      const [ptRefreshProg,  setPtRefreshProg]  = useState(null);
      const [apiKey,      setApiKey]      = useState(null);
      const [offlineMode, setOfflineMode] = useState(false);
      const [currency,    setCurrency]    = useState("EUR");
      const [library,     setLibrary]    = useState([]);
      const [lists, setLists] = useState([]);
      const [activeList, setActiveList] = useState("all");
      const [selected, setSelected] = useState(null);
      const [showSearch, setShowSearch] = useState(false);
      const [searchAsWishlist, setSearchAsWishlist] = useState(false);
      const [activeTab, setActiveTab] = useState("library");
      const [filterQ, setFilterQ] = useState("");
      const [sortBy, setSortBy] = useState("added");
      const [newListName, setNewListName] = useState("");
      const [renamingId, setRenamingId] = useState(null);
      const [renameVal, setRenameVal] = useState("");
      const [confirmDeleteList, setConfirmDeleteList] = useState(null);
      const [profileMenuOpen, setProfileMenuOpen] = useState(false);

      const accent = "#e2c97e";

      // Load data from Supabase on mount and when profileId changes
      useEffect(() => {
        (async () => {
          setPtLoading(true);
          try {
            const pid = profileId || "default";
            const [cfg, lib, ls] = await Promise.all([loadConfig(), loadLibrary(pid), loadLists(pid)]);
            setApiKey(cfg.apiKey || null);
            setOfflineMode(cfg.offlineMode || false);
            setCurrency(cfg.currency || "EUR");
            setLibrary(lib.map(b => { const m = migrateStatus(b); if (m.image) m.image = upgradeCoverUrl(m.image); return m; }));
            setLists(ls);
            setActiveList("all"); setActiveTab("library"); setSelected(null); setFilterQ("");
          } catch(e) { console.error("PT load error:", e); }
          finally { setPtLoading(false); }
        })();
      }, [profileId]);

      // Persist library / lists whenever they change (skipped on first render of a profile)
      const lastSavedFor = useRef({ profile: null, library: false, lists: false });
      useEffect(() => {
        if (!profileId) return;
        if (lastSavedFor.current.profile !== profileId) {
          lastSavedFor.current = { profile: profileId, library: false, lists: false };
          return;
        }
        if (!lastSavedFor.current.library) { lastSavedFor.current.library = true; return; }
        saveLibrary(profileId || "default", library);
      }, [library, profileId]);

      useEffect(() => {
        if (!profileId) return;
        if (lastSavedFor.current.profile !== profileId) return;
        if (!lastSavedFor.current.lists) { lastSavedFor.current.lists = true; return; }
        saveLists(profileId || "default", lists);
      }, [lists, profileId]);

      // Persist profiles index
      const isFirstProfilesRender = useRef(true);
      // (profile persistence handled by shell)
      // (profile persistence removed)

      // Persist active profile id whenever it changes
      // (profile managed by TrackHub shell)

      // ── Refresh all books from Google Books ──────────────────────────────────
      // Fetches fresh metadata for every non-manual book, preserving user fields.
      // User-entered fields (rating, status, dates, notes, purchasePrice, ownership,
      // lists, pageCount if manually set) are never overwritten with null/0.
      const PT_API_FIELDS = ["title","subtitle","authors","publisher","publishedDate","year",
        "pageCount","language","categories","description","image","avgRating","ratingsCount",
        "infoLink","isbn13","isbn10","googleBooksId"];

      const refreshAllFromGB = async () => {
        if (!apiKey) return;
        const toFetch = library.filter(b => !b.isManual && (b.googleBooksId || b.isbn13 || b.isbn10));
        if (!toFetch.length) return;
        setPtRefreshing(true); setPtRefreshProg(0);

        const updates = {};
        let done = 0;
        const BATCH_SIZE = 5; // parallel requests per batch
        const BATCH_DELAY = 1200; // ms between batches

        const mergeBook = (book, fresh) => {
          const merged = { ...book };
          for (const field of PT_API_FIELDS) {
            const freshVal = fresh[field];
            if (field === "image") {
              if (freshVal) merged[field] = upgradeCoverUrl(freshVal);
            } else if (field === "pageCount") {
              if (!merged[field] && freshVal) merged[field] = freshVal;
            } else {
              if (freshVal !== null && freshVal !== undefined &&
                  !(Array.isArray(freshVal) && freshVal.length === 0)) {
                merged[field] = freshVal;
              }
            }
          }
          return merged;
        };

        const fetchOne = async (book) => {
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              let fresh = null;
              if (book.googleBooksId) {
                fresh = await gbGetVolume(book.googleBooksId, apiKey);
              } else if (book.isbn13 || book.isbn10) {
                const isbn = book.isbn13 || book.isbn10;
                const results = await gbSearch(`isbn:${isbn}`, apiKey, { maxResults: 1 });
                if (results && results.length) fresh = results[0];
                if (fresh) book.googleBooksId = fresh.googleBooksId || fresh.id;
              }
              if (fresh) updates[book.id] = mergeBook(book, fresh);
              return;
            } catch(e) {
              const isRetryable = e.message.includes("429") || e.message.includes("503") || e.message.includes("500");
              if (attempt < 2 && isRetryable) {
                await new Promise(r => setTimeout(r, 2000 * Math.pow(2, attempt)));
              } else {
                console.warn("PT refresh failed:", book.title, e.message);
                return;
              }
            }
          }
        };

        // Process in parallel batches
        for (let i = 0; i < toFetch.length; i += BATCH_SIZE) {
          const batch = toFetch.slice(i, i + BATCH_SIZE);
          await Promise.all(batch.map(book => fetchOne(book)));
          done += batch.length;
          setPtRefreshProg(Math.round((done / toFetch.length) * 100));
          if (i + BATCH_SIZE < toFetch.length) {
            await new Promise(r => setTimeout(r, BATCH_DELAY));
          }
        }

        setLibrary(cur => cur.map(b => updates[b.id] || b));
        setPtRefreshing(false); setPtRefreshProg(null);
      };

      const addBook = (book) => setLibrary(cur => {
        const idx = cur.findIndex(b => b.id === book.id);
        if (idx === -1) return [book, ...cur];
        const updated = [...cur];
        updated[idx] = { ...updated[idx], ...book };
        return updated;
      });

      const saveBook = (updated) => {
        setLibrary(cur => cur.map(b => b.id === updated.id ? updated : b));
        setSelected(null);
      };

      const deleteBook = (id) => {
        setLibrary(cur => cur.filter(b => b.id !== id));
        setLists(cur => cur.map(l => ({ ...l, bookIds: l.bookIds.filter(bid => bid !== id) })));
        setSelected(null);
      };

      // Lists CRUD
      const createList = () => {
        const name = newListName.trim();
        if (!name) return;
        const id = "list_" + Date.now();
        setLists(cur => [...cur, { id, name, bookIds: [] }]);
        setNewListName("");
        setActiveList(id);
      };
      const renameList = (id) => {
        const val = renameVal.trim();
        if (val) setLists(cur => cur.map(l => l.id === id ? { ...l, name: val } : l));
        setRenamingId(null);
      };
      const deleteList = (id) => {
        setLists(cur => cur.filter(l => l.id !== id));
        if (activeList === id) setActiveList("all");

      };

      // Toggle a book's membership in a custom list. If already in the list, remove it; otherwise add it.
      const toggleBookInList = (bookId, listId) => {
        setLists(cur => cur.map(l => {
          if (l.id !== listId) return l;
          const inList = l.bookIds.includes(bookId);
          return { ...l, bookIds: inList ? l.bookIds.filter(b => b !== bookId) : [...l.bookIds, bookId] };
        }));
      };

      // Built-in filters — use effectiveBucket to account for two-axis status
      const builtinFilter = {
        all:      (b) => true,
        reading:  (b) => effectiveBucket(b) === "reading",
        read:     (b) => effectiveBucket(b) === "read",
        onhold:   (b) => effectiveBucket(b) === "onhold",
        sleeping: (b) => effectiveBucket(b) === "sleeping",
        wishlist: (b) => effectiveBucket(b) === "wishlist",
      };

      const listCount = (listId) => {
        if (builtinFilter[listId]) return library.filter(builtinFilter[listId]).length;
        const l = lists.find(x => x.id === listId);
        return l ? l.bookIds.length : 0;
      };

      // Current filtered + sorted view
      const filtered = useMemo(() => {
        let items = library;
        if (builtinFilter[activeList]) {
          items = items.filter(builtinFilter[activeList]);
        } else {
          const l = lists.find(x => x.id === activeList);
          items = l ? items.filter(b => l.bookIds.includes(b.id)) : items;
        }
        if (filterQ) {
          const q = filterQ.toLowerCase();
          items = items.filter(b =>
            (b.title || "").toLowerCase().includes(q) ||
            (b.authors || []).some(a => a.toLowerCase().includes(q))
          );
        }
        const sorted = [...items];
        const dir = 1;
        if (sortBy === "title")  sorted.sort((a, b) => (a.title || "").localeCompare(b.title || "") * dir);
        else if (sortBy === "author") sorted.sort((a, b) => ((a.authors?.[0] || "").localeCompare(b.authors?.[0] || "")) * dir);
        else if (sortBy === "rating") sorted.sort((a, b) => ((b.rating ?? -1) - (a.rating ?? -1)));
        else if (sortBy === "year")   sorted.sort((a, b) => (b.year || "0").localeCompare(a.year || "0"));
        else sorted.sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || ""));  // added desc
        return sorted;
      }, [library, lists, activeList, filterQ, sortBy]);

      const activeCustom = lists.find(l => l.id === activeList);

      // ── Profile management handlers ──
      const createProfile = (name, colorId) => null;

      const renameProfile = (id, newName) => {};

      const setProfileColor = (id, colorId) => {};

      const deleteProfile = (id) => {};

      const switchProfile = (id) => { setProfileMenuOpen(false); };

      // ── Gating ──
      // (profile gating moved to shell)

      if (ptLoading) return (
        <div style={{ minHeight: "100vh", background: "#060d14", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ color: "#7a90a8", fontSize: 14 }}>Loading library…</div>
        </div>
      );

      return (
        <div style={{ minHeight: "100vh", background: "#060d14" }}>

          {/* ── Nav ── */}
          <nav style={{ background: "#080f18", borderBottom: "1px solid #1a2535", padding: "0 28px", display: "flex", alignItems: "center", height: 58, position: "sticky", top: 0, zIndex: 100 }}>
            {logoSlot}
            <div style={{ display: "flex", gap: 2 }}>
              {[["library","Library"],["stats","Stats"],["settings","Settings"]].map(([key, label]) => (
                <button key={key} onClick={() => setActiveTab(key)}

                  {label}

            </div>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ color: "#7a90a8", fontSize: 13 }}>{library.filter(b => effectiveBucket(b) !== "wishlist").length} in library</span>
              <button onClick={() => { setSearchAsWishlist(false); setShowSearch(true); }}
                style={{ background: "transparent", color: "#e2c97e", border: "1px solid #e2c97e44", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#e2c97e"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#e2c97e44"}>
                + Add to Library
              </button>
              <button onClick={() => { setSearchAsWishlist(true); setShowSearch(true); }}
                style={{ background: "transparent", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}

                  <span style={{ color: "#7a90a8", fontSize: 12, transform: profileMenuOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>▾</span>

                       <div style={{ padding: "6px 10px 4px", fontSize: 12, color: "#8baabf" }}>Switch profiles from the home screen.</div>
                      <div style={{ height: 1, background: "#1a2535", margin: "6px 4px" }} />
                      <button onClick={() => { setProfileMenuOpen(false); setActiveTab("settings"); }}
                        style={{ width: "100%", padding: "8px 10px", background: "transparent", border: "none", cursor: "pointer", borderRadius: 7, color: "#7a90a8", fontSize: 13, textAlign: "left", display: "flex", alignItems: "center", gap: 10 }}
                        onMouseEnter={(e) => e.currentTarget.style.background = "#0a1520"}
                        onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                        <span style={{ width: 28, textAlign: "center" }}>⚙</span>
                        Manage profiles
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          </nav>

          {activeTab === "stats" ? (

                library={library}
                lists={lists}
                onImport={(parsed, mode) => {
                  // parsed = { books, listAssignments, filename }
                  const result = applyImport(parsed, library, lists, mode);
                  // Run new books through migration + cover upgrade so they slot in cleanly
                  const cleanLib = result.library.map(b => {

                  setLists(result.lists);

            <div style={{ display: "flex", minHeight: "calc(100vh - 58px)" }}>

              {/* ── Sidebar ── */}
              <aside style={{ width: 210, flexShrink: 0, background: "#080f18", borderRight: "1px solid #0f1923", padding: "20px 0", display: "flex", flexDirection: "column", gap: 1, position: "sticky", top: 58, height: "calc(100vh - 58px)", overflowY: "auto" }}>

                {/* All */}
                {[
                  { id: "all",      label: "All",       activeColor: "#e2c97e", activeBg: "#e2c97e18", dim: "#7a90a8" },
                ].map(({ id, label, activeColor, activeBg, dim }) => {
                  const active = activeList === id;
                  return (
                    <button key={id} onClick={() => setActiveList(id)}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px", padding: "8px 12px", borderRadius: 8, border: "none", cursor: "pointer", background: active ? activeBg : "transparent", color: active ? activeColor : dim, fontSize: 13, fontWeight: active ? 700 : 500, textAlign: "left" }}
                      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                      <span>{label}</span>
                      <span style={{ fontSize: 12, fontFamily: "'DM Mono', monospace", opacity: 0.55 }}>{listCount(id)}</span>
                    </button>
                  );
                })}

                {/* Status subcollections */}
                <div style={{ padding: "10px 12px 4px 16px", fontSize: 12, color: "#8baabf", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Status</div>
                {[
                  { id: "reading",  label: "Reading",        color: "#fb923c" },
                  { id: "onhold",   label: "On hold",        color: "#f59e0b" },
                  { id: "read",     label: "Read",           color: "#4ade80" },
                  { id: "sleeping", label: "Sleeping Shelf", color: "#f87171" },
                  { id: "wishlist", label: "Wishlist",       color: "#c084fc" },
                ].map(({ id, label, color }) => {
                  const active = activeList === id;
                  return (
                    <button key={id} onClick={() => setActiveList(id)}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px 0 20px", padding: "7px 12px", borderRadius: 7, border: "none", cursor: "pointer", background: active ? `${color}18` : "transparent", color: active ? color : "#8baabf", fontSize: 12, fontWeight: active ? 700 : 400, textAlign: "left" }}
                      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                      <span>{label}</span>
                      <span style={{ fontSize: 12, fontFamily: "'DM Mono', monospace", opacity: 0.5 }}>{listCount(id)}</span>
                    </button>
                  );
                })}

                {/* Custom lists */}
                <div style={{ padding: "14px 12px 4px 16px", fontSize: 12, color: "#8baabf", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Lists</div>
                {lists.map(l => {
                  const active = activeList === l.id;
                  return (
                    <div key={l.id} style={{ margin: "0 8px 0 28px" }}>
                      {renamingId === l.id ? (
                        <div style={{ display: "flex", gap: 4, padding: "3px 4px" }}>
                          <input autoFocus value={renameVal} onChange={(e) => setRenameVal(e.target.value)}
                            onKeyDown={(e) => { if (e.key === "Enter") renameList(l.id); if (e.key === "Escape") setRenamingId(null); }}
                            style={{ flex: 1, background: "#0d1825", border: "1px solid #e2c97e44", borderRadius: 5, padding: "4px 8px", color: "#e2e8f0", fontSize: 12, minWidth: 0 }} />
                          <button onClick={() => renameList(l.id)} style={{ background: "#e2c97e22", border: "none", borderRadius: 5, color: "#e2c97e", cursor: "pointer", padding: "4px 7px", fontSize: 12 }}>✓</button>
                        </div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "center", borderRadius: 7, background: active ? "#60a5fa15" : "transparent" }}>
                          <button onClick={() => setActiveList(l.id)}
                            style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 6px 7px 10px", border: "none", cursor: "pointer", background: "transparent", color: active ? "#60a5fa" : "#4a6070", fontSize: 12, fontWeight: active ? 700 : 400, textAlign: "left", minWidth: 0 }}>
                            <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name}</span>
                            <span style={{ fontSize: 12, fontFamily: "'DM Mono', monospace", opacity: 0.5, flexShrink: 0, marginLeft: 4 }}>{l.bookIds.length}</span>
                          </button>
                          <button title="Rename" onClick={() => { setRenamingId(l.id); setRenameVal(l.name); }}
                            style={{ background: "none", border: "none", color: "#8baabf", cursor: "pointer", padding: "4px 4px", fontSize: 12, borderRadius: 4, flexShrink: 0 }}
                            onMouseEnter={(e) => e.currentTarget.style.color = "#9aaabb"}
                            onMouseLeave={(e) => e.currentTarget.style.color = "#8baabf"}>✎</button>
                          <button title="Delete" onClick={() => setConfirmDeleteList(l.id)}
                            style={{ background: "none", border: "none", color: "#8baabf", cursor: "pointer", padding: "4px 6px 4px 2px", fontSize: 12, borderRadius: 4, flexShrink: 0 }}
                            onMouseEnter={(e) => e.currentTarget.style.color = "#f87171"}
                            onMouseLeave={(e) => e.currentTarget.style.color = "#8baabf"}>✕</button>
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* New list input */}
                <div style={{ marginTop: "auto", padding: "16px 10px 4px", borderTop: "1px solid #0f1923" }}>
                  <div style={{ display: "flex", gap: 5 }}>
                    <input value={newListName} onChange={(e) => setNewListName(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && createList()}
                      placeholder="New list…"
                      style={{ flex: 1, background: "#0a1520", border: "1px solid #1a2535", borderRadius: 7, padding: "7px 10px", color: "#e2e8f0", fontSize: 12, minWidth: 0 }} />
                    <button onClick={createList}
                      style={{ background: "#e2c97e22", border: "1px solid #e2c97e44", borderRadius: 7, color: "#e2c97e", cursor: "pointer", padding: "0 10px", fontSize: 14, fontWeight: 700, flexShrink: 0 }}>+</button>
                  </div>
                </div>
              </aside>

              {/* ── Main grid ── */}
              <main style={{ flex: 1, minWidth: 0, padding: "24px 28px 60px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20, flexWrap: "wrap" }}>
                  <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 26, color: "#e2c97e", margin: 0 }}>
                    {activeList === "all"      ? "All books"
                    : activeList === "reading" ? "Currently reading"
                    : activeList === "onhold"  ? "On hold"
                    : activeList === "read"    ? "Read"
                    : activeList === "sleeping"? "Sleeping Shelf"
                    : activeList === "wishlist"? "Wishlist"
                    : activeCustom ? activeCustom.name : "Library"}
                  </h1>
                  <span style={{ color: "#7a90a8", fontSize: 14 }}>{filtered.length} {filtered.length === 1 ? "book" : "books"}</span>

                  <div style={{ marginLeft: "auto", display: "flex", gap: 10, alignItems: "center" }}>
                    <input value={filterQ} onChange={(e) => setFilterQ(e.target.value)}
                      placeholder="Filter…"
                      style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "7px 12px", color: "#e2e8f0", fontSize: 13, width: 180 }} />
                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)}
                      style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "7px 10px", color: "#e2e8f0", fontSize: 13, cursor: "pointer" }}>
                      <option value="added">Sort: Recent</option>
                      <option value="title">Sort: Title</option>
                      <option value="author">Sort: Author</option>
                      <option value="rating">Sort: Rating</option>
                      <option value="year">Sort: Year</option>
                    </select>
                  </div>
                </div>

                {filtered.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "80px 20px", color: "#7a90a8" }}>
                    <div style={{ fontSize: 48, marginBottom: 10, opacity: 0.5 }}>📖</div>
                    <div style={{ fontSize: 15 }}>
                      {library.length === 0
                        ? "Your library is empty. Click + Add to Library to start."
                        : "No books match this view."}
                    </div>
                  </div>
                ) : (() => {
                  const useGrouped = activeList === "all" && !filterQ;
                  if (!useGrouped) {
                    return (
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(175px, 1fr))", gap: 18 }}>
                        {filtered.map(b => (
                          <BookCard key={b.id} entry={b}
                            onSelect={() => setSelected(b)}
                            inList={activeCustom ? activeCustom.bookIds.includes(b.id) : undefined} />
                        ))}
                      </div>
                    );
                  }
                  // Grouped view
                  const BOOK_GROUPS = [
                    { id: "reading",  label: "Reading",       color: "#fb923c" },
                    { id: "onhold",   label: "On Hold",       color: "#f59e0b" },
                    { id: "read",     label: "Read",          color: "#4ade80" },
                    { id: "sleeping", label: "Sleeping Shelf", color: "#f87171" },
                    { id: "wishlist", label: "Wishlist",      color: "#c084fc" },
                  ];
                  const bucketMap = {};
                  filtered.forEach(b => {
                    const bucket = effectiveBucket(b);
                    if (!bucketMap[bucket]) bucketMap[bucket] = [];
                    bucketMap[bucket].push(b);
                  });
                  const customBuckets = lists.map(l => ({
                    id: l.id,
                    label: l.name,
                    color: "#e2c97e",
                    books: filtered.filter(b => l.bookIds.includes(b.id)),

                  const sections = [];
                  BOOK_GROUPS.forEach(({ id, label, color }) => {
                    const books = bucketMap[id] || [];
                    if (!books.length) return;
                    sections.push({ label, color, books });

                  customBuckets.forEach(({ label, color, books }) => {
                    sections.push({ label, color, books });
                  });

              offlineMode={!apiKey}
              currency={currency}
              defaultStatus={searchAsWishlist ? "wishlist" : "reading"}
              existingIds={new Set(library.map(b => b.id))}
              onAdd={addBook}
              onClose={() => setShowSearch(false)} />
          )}
          {selected && (
            <BookModal
              entry={selected}
              lists={lists}
              currency={currency}
              onToggleList={(listId) => toggleBookInList(selected.id, listId)}
              onSave={saveBook}
              onDelete={deleteBook}
              onClose={() => setSelected(null)} />
          )}
          {confirmDeleteList && (
            <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,0.88)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
              onClick={(e) => e.target === e.currentTarget && setConfirmDeleteList(null)}>
              <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 12, padding: 24, width: 380 }}>
                <div style={{ fontSize: 15, color: "#e2e8f0", marginBottom: 6, fontWeight: 600 }}>Delete list?</div>
                <div style={{ fontSize: 13, color: "#7a90a8", marginBottom: 18 }}>The list will be removed. Books in it will remain in your library.</div>
                <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                  <button onClick={() => setConfirmDeleteList(null)}
                    style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  <button onClick={() => deleteList(confirmDeleteList)}
                    style={{ background: "#f87171", border: "none", color: "#0f172a", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── SettingsPanel ────────────────────────────────────────────────────────
    // ─── ExportImportPanel ────────────────────────────────────────────────────
    // Lives inside SettingsPanel. Lets the user save the active profile's
    // collection to CSV/XML, or import one back (replace or merge).
    function ExportImportPanel({ library, lists, profileName, onImport }) {
      const [exported,    setExported]    = useState(null);
      const [importData,  setImportData]  = useState(null);
      const [importError, setImportError] = useState(null);
      const [importMode,  setImportMode]  = useState("merge");
      const [dragging,    setDragging]    = useState(false);
      const fileRef = useRef();

      const doExport = (fmt) => {
        setExported(null);
        const ts = new Date().toISOString().slice(0, 10);
        const safeName = (profileName || "library").replace(/[^a-zA-Z0-9_-]/g, "_");
        const filename = `plottwist-${safeName}-${ts}.${fmt}`;
        const content = fmt === "csv" ? collectionToCSV(library, lists) : collectionToXML(library, lists);
        const mime    = fmt === "csv" ? "text/csv" : "application/xml";
        const result  = downloadFile(content, filename, mime);
        setExported({ filename, dir: result?.dir });
      };

      const handleFile = (file) => {
        setImportError(null);
        setImportData(null);
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          try {
            const parsed = file.name.toLowerCase().endsWith(".xml")
              ? importFromXML(text)
              : importFromCSV(text);
            if (!parsed.books.length) {
              setImportError("File parsed but no books found.");
              return;
            }
            setImportData({ ...parsed, filename: file.name });
          } catch (err) {
            setImportError(`Could not parse file: ${err.message}`);
          }
        };
        reader.onerror = () => setImportError("Could not read file.");
        reader.readAsText(file);
      };

      const confirmImport = () => {
        if (!importData) return;
        onImport(importData, importMode);
        setImportData(null);
        setExported(null);
      };

      const card = (children) => (
        <div style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 10, padding: "14px 16px" }}>{children}</div>
      );

      return (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
          <div style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 4 }}>Backup & sharing</div>
          <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 14 }}>
            Export {profileName ? <span style={{ color: "#94a3b8" }}>{profileName}</span> : "this profile"}'s library and lists, or import a previously-exported file.
          </div>

          {/* Export */}
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 8, fontWeight: 600 }}>EXPORT</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <button onClick={() => doExport("csv")}
                style={{ background: "#0a1520", border: "1px solid #1a2535", color: "#e2e8f0", borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#e2c97e66"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#1a2535"}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 2 }}>CSV</div>
                <div style={{ fontSize: 12, color: "#8baabf" }}>Spreadsheet-friendly. Covers excluded.</div>
              </button>
              <button onClick={() => doExport("xml")}
                style={{ background: "#0a1520", border: "1px solid #1a2535", color: "#e2e8f0", borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#60a5fa66"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#1a2535"}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 2 }}>XML</div>
                <div style={{ fontSize: 12, color: "#8baabf" }}>Complete. Includes covers and descriptions.</div>
              </button>
            </div>

            {exported && (
              <div style={{ marginTop: 12, padding: "10px 14px", background: "#0a1f0a", border: "1px solid #1a3d1a", borderRadius: 8, fontSize: 12 }}>
                <div style={{ color: "#4ade80", fontWeight: 600 }}>✓ Exported</div>
                <div style={{ color: "#7a90a8", fontFamily: "'DM Mono', monospace", fontSize: 12, marginTop: 4 }}>
                  {exported.dir ? <>Saved to <code style={{ color: "#60a5fa" }}>plottwist-exports/{exported.filename}</code></> : exported.filename}
                </div>
              </div>
            )}
          </div>

          {/* Import */}
          <div>
            <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 8, fontWeight: 600 }}>IMPORT</div>

            {!importData ? (
              <>
                <div
                  onClick={() => fileRef.current?.click()}
                  onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                  onDragLeave={() => setDragging(false)}
                  onDrop={(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
                  style={{ padding: "20px 16px", borderRadius: 10, cursor: "pointer", textAlign: "center",
                    background: dragging ? "#0a1929" : "#0a1520",
                    border: dragging ? "2px dashed #60a5fa" : "2px dashed #7a90a8",
                    transition: "border-color 0.15s, background 0.15s" }}
                  onMouseEnter={(e) => { if (!dragging) e.currentTarget.style.borderColor = "#7a90a8"; }}
                  onMouseLeave={(e) => { if (!dragging) e.currentTarget.style.borderColor = "#7a90a8"; }}>
                  <div style={{ fontSize: 22, marginBottom: 4 }}>📥</div>
                  <div style={{ color: "#94a3b8", fontWeight: 600, fontSize: 13, marginBottom: 2 }}>Drop a CSV or XML file here</div>
                  <div style={{ color: "#7a90a8", fontSize: 12 }}>or click to browse</div>
                </div>
                <input ref={fileRef} type="file" accept=".csv,.xml" style={{ display: "none" }}
                  onChange={(e) => handleFile(e.target.files[0])} />
                {importError && (
                  <div style={{ marginTop: 10, padding: "9px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 12 }}>
                    ⚠ {importError}
                  </div>
                )}
              </>
            ) : (
              <div>
                {card(
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ fontSize: 22 }}>📦</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ color: "#4ade80", fontWeight: 600, fontSize: 13 }}>{importData.books.length} books found</div>
                      <div style={{ color: "#7a90a8", fontSize: 12, marginTop: 2, fontFamily: "'DM Mono', monospace" }}>{importData.filename}</div>
                    </div>
                  </div>
                )}

                <div style={{ marginTop: 12 }}>
                  <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Mode</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {[
                      { val: "merge",   label: "Merge", desc: "Add new entries, update existing ones (matched by ID). Keeps your other books." },
                      { val: "replace", label: "Replace", desc: "Wipe the current library and lists, then import." },
                    ].map(({ val, label, desc }) => {
                      const active = importMode === val;
                      return (
                        <label key={val} style={{ display: "flex", gap: 10, padding: "10px 12px", borderRadius: 8, border: `1px solid ${active ? "#e2c97e44" : "#1a2535"}`, background: active ? "#e2c97e10" : "#0a1520", cursor: "pointer" }}>
                          <input type="radio" name="importMode" checked={active} onChange={() => setImportMode(val)}
                            style={{ accentColor: "#e2c97e", marginTop: 2 }} />
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 700, color: active ? "#e2c97e" : "#e2e8f0" }}>{label}</div>
                            <div style={{ fontSize: 12, color: "#7a90a8", marginTop: 2 }}>{desc}</div>
                          </div>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {importMode === "replace" && (
                  <div style={{ marginTop: 12, padding: "9px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 12 }}>
                    ⚠ This will permanently delete your current {library.length} books and {lists.length} lists for this profile.
                  </div>
                )}

                <div style={{ display: "flex", gap: 8, marginTop: 14, justifyContent: "flex-end" }}>
                  <button onClick={() => { setImportData(null); setImportError(null); }}
                    style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  <button onClick={confirmImport}
                    style={{ background: "#e2c97e", border: "none", color: "#0f172a", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>
                    {importMode === "replace" ? "Replace library" : "Merge import"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SettingsPanel({ apiKey, offlineMode, currency, onApiKeyChange, onGoOffline, onCurrencyChange, library, lists, onImport }) {
      const [key, setKey] = useState(apiKey || "");
      const [msg, setMsg] = useState(null);
      const [validating, setValidating] = useState(false);

      const update = async () => {
        setMsg(null);
        if (!key.trim()) { setMsg({ type: "error", text: "Enter an API key." }); return; }
        setValidating(true);
        const { valid, error } = await validateApiKey(key.trim());
        setValidating(false);
        if (!valid) { setMsg({ type: "error", text: `Invalid key: ${error}` }); return; }
        onApiKeyChange(key.trim());
        setMsg({ type: "ok", text: "API key updated." });
      };


      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>

          {/* Mode + API key */}
          <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
              <div style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Google Books API Key</div>
              <span style={{ fontSize: 12, padding: "2px 8px", borderRadius: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em",
                background: offlineMode ? "#94a3b822" : "#4ade8022",
                color:      offlineMode ? "#94a3b8" : "#4ade80",
                border:     offlineMode ? "1px solid #94a3b844" : "1px solid #4ade8044" }}>
                {offlineMode ? "● Offline" : "● Online"}
              </span>
            </div>
            <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 12 }}>
              {offlineMode
                ? "You're working offline — only manual entry is available. Add a key to enable search."
                : "Shared across all profiles. Enables Title / Author and ISBN search."}
            </div>
            <input type="password" value={key} onChange={(e) => setKey(e.target.value)}
              placeholder={offlineMode ? "Paste a key to switch to online mode…" : "AIzaSy…"}
              style={{ width: "100%", background: "#080f18", border: "1px solid #7a90a8", borderRadius: 8, padding: "10px 12px", color: "#e2e8f0", fontSize: 13, fontFamily: "'DM Mono', monospace" }}
              onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
              onBlur={(e) => e.target.style.borderColor = "#7a90a8"} />
            <div style={{ marginTop: 12, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <button onClick={update} disabled={validating}
                style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "9px 20px", cursor: validating ? "default" : "pointer", fontWeight: 700, fontSize: 13, opacity: validating ? 0.6 : 1 }}>
                {validating ? "Validating…" : (offlineMode ? "Save & go online" : "Update")}
              </button>
              {!offlineMode && onGoOffline && (
                <button onClick={() => { onGoOffline(); setKey(""); setMsg({ type: "ok", text: "Switched to offline mode." }); }}
                  style={{ background: "transparent", color: "#7a90a8", border: "1px solid #7a90a8", borderRadius: 8, padding: "9px 16px", cursor: "pointer", fontSize: 13 }}
                  onMouseEnter={(e) => { e.currentTarget.style.borderColor = "#7a90a8"; e.currentTarget.style.color = "#94a3b8"; }}
                  onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#7a90a8"; e.currentTarget.style.color = "#7a90a8"; }}>
                  Go offline
                </button>
              )}
            </div>
            {msg && (
              <div style={{ marginTop: 12, padding: "9px 14px", borderRadius: 8, fontSize: 13,
                background: msg.type === "error" ? "#2d1518" : "#0a1f0a",
                border: msg.type === "error" ? "1px solid #5a2a30" : "1px solid #1a3d1a",
                color: msg.type === "error" ? "#f87171" : "#4ade80" }}>
                {msg.text}
              </div>
            )}
          </div>

          {/* Currency */}
          <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
            <div style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 4 }}>Currency</div>
            <div style={{ fontSize: 12, color: "#7a90a8", marginBottom: 12 }}>
              Used for purchase prices and spending stats. Existing prices keep their numeric value — only the symbol changes.
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <select value={currency} onChange={(e) => onCurrencyChange && onCurrencyChange(e.target.value)}
                style={{ background: "#080f18", border: "1px solid #7a90a8", borderRadius: 8, padding: "10px 12px", color: "#e2e8f0", fontSize: 13, cursor: "pointer", minWidth: 220 }}>
                {CURRENCIES.map(c => (
                  <option key={c.code} value={c.code}>{c.label}</option>
                ))}
              </select>
              <span style={{ fontSize: 12, color: "#8baabf", fontFamily: "'DM Mono', monospace" }}>
                e.g. {formatPrice(19.95, currency)}
              </span>
            </div>
          </div>

          {/* Data summary */}
          <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
            <div style={{ fontSize: 12, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 12 }}>Data (this profile)</div>
            <div style={{ fontSize: 13, color: "#7a90a8", marginBottom: 4 }}>
              Synced to cloud
            </div>
            <div style={{ fontSize: 12, color: "#8baabf", fontFamily: "'DM Mono', monospace", marginTop: 10 }}>
              {library.length} books · {library.filter(b => effectiveBucket(b) === "read").length} read · {library.filter(b => effectiveBucket(b) === "reading").length} reading · {library.filter(b => effectiveBucket(b) === "onhold").length} on hold · {library.filter(b => effectiveBucket(b) === "sleeping").length} sleeping · {library.filter(b => effectiveBucket(b) === "wishlist").length} wishlist
            </div>
          </div>

          {/* Backup & sharing */}
          <ExportImportPanel
            library={library}
            lists={lists}
            profileName={undefined}
            onImport={onImport}
          />

        </div>
      );
    }

      return App;
    })();
    // ─── Module switcher ──────────────────────────────────────────────────────
    function ModuleSwitcher({ active, modules, onChange }) {
      const [open, setOpen] = useState(false);
      const mod = modules.find(m => m.id === active);
      return (
        <div style={{ position: "relative", marginRight: 28 }}>
          <button onClick={() => setOpen(o => !o)}
            style={{ display: "flex", alignItems: "center", gap: 10, background: "none", border: "none", cursor: "pointer", padding: "4px 8px 4px 0", borderRadius: 8 }}>
            <span style={{ fontSize: 20 }}>{mod.icon}</span>
            <span style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 19, letterSpacing: "-0.02em" }}>
              <span style={{ color: mod.accentA }}>{mod.label.slice(0, Math.ceil(mod.label.length / 2))}</span>
              <span style={{ color: mod.accentB }}>{mod.label.slice(Math.ceil(mod.label.length / 2))}</span>
            </span>
            <span style={{ color: "#8baabf", fontSize: 12, marginLeft: 2, display: "inline-block", transform: open ? "rotate(180deg)" : "none", transition: "transform 0.15s" }}>▾</span>
          </button>
          {open && (
            <>
              <div onClick={() => setOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 98 }} />
              <div style={{ position: "absolute", top: "calc(100% + 8px)", left: 0, background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: 6, zIndex: 99, minWidth: 200, boxShadow: "0 20px 60px rgba(0,0,0,0.7)" }}>
                <div style={{ padding: "6px 12px 4px", fontSize: 12, color: "#8baabf", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Switch tracker</div>
                {modules.map(m => {
                  const isActive = m.id === active;
                  return (
                    <button key={m.id} onClick={() => { onChange(m.id); setOpen(false); }}
                      style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", background: isActive ? "#e2c97e12" : "transparent", border: "none", cursor: "pointer", borderRadius: 8, textAlign: "left" }}
                      onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = "#0a1520"; }}
                      onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = "transparent"; }}>
                      <span style={{ fontSize: 18 }}>{m.icon}</span>
                      <span style={{ fontSize: 13, fontWeight: isActive ? 700 : 500, color: isActive ? m.accentA : "#94a3b8" }}>{m.label}</span>
                      {isActive && <span style={{ marginLeft: "auto", color: m.accentA, fontSize: 12 }}>●</span>}
                    </button>
                  );
                })}
                <div style={{ borderTop: "1px solid #1a2535", margin: "6px 0" }} />
                <div style={{ padding: "6px 12px 2px", fontSize: 12, color: "#7a90a8", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Coming soon</div>
                <div style={{ padding: "8px 12px", fontSize: 12, color: "#7a90a8", fontStyle: "italic" }}>New trackers will appear here</div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ─── TrackHub shell ────────────────────────────────────────────────────────
    // ─── Password reset screen (shown after clicking email link) ────────────
    function PasswordResetScreen({ onDone }) {
      const [password,  setPassword]  = useState("");
      const [confirm,   setConfirm]   = useState("");
      const [loading,   setLoading]   = useState(false);
      const [error,     setError]     = useState(null);
      const [success,   setSuccess]   = useState(false);

      const handle = async () => {
        setError(null);
        if (!password) { setError("Enter a new password."); return; }
        if (password.length < 6) { setError("Password must be at least 6 characters."); return; }
        if (password !== confirm) { setError("Passwords don't match."); return; }
        setLoading(true);
        try {
          const { error: e } = await _sb.auth.updateUser({ password });
          if (e) throw e;
          setSuccess(true);
          setTimeout(onDone, 1500);
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const inputStyle = { width: "100%", background: "#080f18", border: "1px solid #7a90a8", borderRadius: 10, padding: "11px 14px", color: "#e2e8f0", fontSize: 14 };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #060d14 0%, #0d1825 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#0d1825", border: "1px solid #7a90a8", borderRadius: 18, padding: "40px 44px", width: 420, boxShadow: "0 40px 120px rgba(0,0,0,0.7)" }}>
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <div style={{ fontSize: 44, marginBottom: 8 }}>🔑</div>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 28, letterSpacing: "-0.02em", margin: 0, color: "#e2e8f0" }}>Set new password</h1>
              <div style={{ color: "#8baabf", fontSize: 13, marginTop: 6 }}>Choose a new password for your account</div>
            </div>

            {success ? (
              <div style={{ textAlign: "center", padding: "20px 0" }}>
                <div style={{ fontSize: 36, marginBottom: 12 }}>✓</div>
                <div style={{ color: "#4ade80", fontSize: 15, fontWeight: 600 }}>Password updated!</div>
                <div style={{ color: "#7a90a8", fontSize: 13, marginTop: 6 }}>Taking you to the app…</div>
              </div>
            ) : (
              <>
                <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>New password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handle()} placeholder="••••••••"
                  autoComplete="new-password" autoFocus
                  style={{ ...inputStyle, marginBottom: 14 }}
                  onFocus={e => e.target.style.borderColor = "#e2c97e66"}
                  onBlur={e => e.target.style.borderColor = "#7a90a8"} />
                <label style={{ display: "block", fontSize: 12, color: "#7a90a8", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>Confirm password</label>
                <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handle()} placeholder="••••••••"

      try { return new Intl.NumberFormat(undefined, { style: "currency", currency: currency || "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n); }
      catch { return (currency || "EUR") + " " + Number(n).toFixed(2); }
    };
    const slMonthKey  = (date) => date.slice(0, 7); // "YYYY-MM"
    const slMonthLabel = (key) => {
      const [y, m] = key.split("-");
      return new Date(Number(y), Number(m) - 1, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
    };
    const slTodayKey  = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
    const slMonthlyCost = (sub) => {
      const a = Number(sub.amount) || 0;
      if (sub.cycle === "annual") return a / 12;
      if (sub.cycle === "weekly") return a * 4.33;
      return a; // monthly
    };
    // Returns ISO dates (YYYY-MM-DD) when a subscription bills in a given month
    const slSubBilledInMonth = (sub, monthKey) => {
      if (!sub.active) return false;
      if (!sub.nextBilling) return false;
      if (sub.startDate && slMonthKey(sub.startDate) > monthKey) return false;
      const [ty, tm] = monthKey.split("-").map(Number);
      const [ny, nm, nd] = sub.nextBilling.split("-").map(Number);
      if (sub.cycle === "monthly") {
        return true; // bills every month; startDate already checked above
      }
      if (sub.cycle === "annual") {
        return nm === tm; // same calendar month each year
      }
      if (sub.cycle === "weekly") {
        const nextDate   = new Date(ny, nm - 1, nd);
        const monthStart = new Date(ty, tm - 1, 1);
        const monthEnd   = new Date(ty, tm, 0);
        let d = new Date(nextDate);
        while (d > monthEnd) d.setDate(d.getDate() - 7);
        if (d >= monthStart) return true;
        d = new Date(nextDate);
        while (d < monthStart) d.setDate(d.getDate() + 7);
        return d <= monthEnd;
      }
      return slMonthKey(sub.nextBilling) === monthKey;
    };

    const slNextBillingDate = (sub) => {
      if (!sub.nextBilling) return null;
      const [ny, nm, nd] = sub.nextBilling.split("-").map(Number);
      const today = new Date(); today.setHours(0,0,0,0);
      let d = new Date(ny, nm - 1, nd);
      if (d >= today) return d;
      if (sub.cycle === "monthly") {
        // Advance month by month until >= today
        while (d < today) d.setMonth(d.getMonth() + 1);
      } else if (sub.cycle === "annual") {
        while (d < today) d.setFullYear(d.getFullYear() + 1);
      } else if (sub.cycle === "weekly") {
        while (d < today) d.setDate(d.getDate() + 7);
      } else {
        return d; // unknown cycle, return as-is
      }
      return d;
    };

    function SlIncome({ income, currency, monthKey, onAdd, onEdit, onDelete }) {

                      <button onClick={() => setConfirmDel(null)} style={{ background: "transparent", color: "#7a90a8", border: "1px solid #8baabf", borderRadius: 6, padding: "4px 12px", cursor: "pointer", fontSize: 12 }}>Cancel</button>

    // ─── SL Dashboard tab ─────────────────────────────────────────────────────
    // ─── SL Dashboard widgets ─────────────────────────────────────────────────

    const SL_WIDGET_DEFS = [

      { id: "year_heatmap",       label: "Year Heatmap",             icon: "📅" },
      { id: "balance_status",     label: "Balance",                  icon: "⚖️" },

      { id: "top_categories",     label: "Top Categories",           icon: "🏆" },
      { id: "monthly_trend",      label: "Monthly Trend",            icon: "📈" },
      { id: "category_vs_last",   label: "Category vs Last Month",   icon: "↕️"  },
      { id: "recent_transactions",label: "Recent Transactions",      icon: "🧾" },
      { id: "upcoming_billings",  label: "Upcoming Billings",        icon: "📆" },
      { id: "subscriptions_month",label: "Subscriptions This Month", icon: "🔁" },

    const SL_DEFAULT_COLS = { monthly_summary: 1, year_heatmap: 1, category_breakdown: 1 };
    const SL_DEFAULT_LAYOUT = SL_WIDGET_DEFS.map((w, i) => ({ id: w.id, order: i, visible: true, cols: SL_DEFAULT_COLS[w.id] || 1 }));

    // Donut chart component
    function SlDonut({ data, size = 160 }) {
      const r = 54; const cx = size / 2; const cy = size / 2;
      const circ = 2 * Math.PI * r;
      const total = data.reduce((s, d) => s + d.value, 0) || 1;
      let offset = 0;
      const slices = data.map(d => {
        const pct = d.value / total;
        const dash = pct * circ;
        const slice = { ...d, dash, offset: circ - offset, pct };
        offset += dash;
        return slice;
      });
      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="#0d1825" strokeWidth={20} />
          {slices.map((s, i) => (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none"
              stroke={s.color} strokeWidth={20}
              strokeDasharray={`${s.dash} ${circ - s.dash}`}
              strokeDashoffset={s.offset} />
          ))}
          <circle cx={cx} cy={cy} r={44} fill="#060d14" />
        </svg>
      );
    }

    // Widget card wrapper
    function SlWidgetCard({ children, title, editMode, dragHandleProps, colButtons }) {
