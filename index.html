    function SearchModal({ onAdd, existingIds, defaultStatus, apiKey, offlineMode = false, currency = DEFAULT_CURRENCY, onClose }) {
      const [mode,      setMode]     = useState(offlineMode ? "manual" : "text"); // "text" | "isbn" | "manual"
      const [query,     setQuery]    = useState("");
      const [results,   setResults]  = useState([]);
      const [added,     setAdded]    = useState(new Set(existingIds));
      const [searching, setSearching] = useState(false);
      const [error,     setError]    = useState(null);
      const [isbnInvalid, setIsbnInvalid] = useState(false);
      const inputRef = useRef();
      const timerRef = useRef();
      useEffect(() => { inputRef.current?.focus(); }, []);

      // Refocus input when mode changes, and reset results/errors
      useEffect(() => {
        setResults([]);
        setError(null);
        setIsbnInvalid(false);
        inputRef.current?.focus();
      }, [mode]);

      // Search effect — debounced for text, immediate once ISBN is valid
      useEffect(() => {
        clearTimeout(timerRef.current);
        const q = query.trim();

        if (mode === "manual") {
          // Manual entry — no API search
          return;
        }

        if (mode === "isbn") {
          if (!q) { setResults([]); setError(null); setIsbnInvalid(false); return; }
          const isbn = normalizeISBN(q);
          if (!isbn) {
            // User is still typing; mark invalid but don't hit the API
            setIsbnInvalid(true);
            setResults([]);
            setError(null);
            return;
          }
          setIsbnInvalid(false);
          // Valid ISBN — run right away, no debounce
          (async () => {
            setSearching(true);
            setError(null);
            try {
              const res = await gbSearch(`isbn:${isbn}`, apiKey, { maxResults: 10 });
              setResults(res);
            } catch (e) {
              setError(e.message);
              setResults([]);
            }
            setSearching(false);
          })();
          return;
        }

        // Text mode — debounced
        if (!q || q.length < 2) { setResults([]); setError(null); return; }
        timerRef.current = setTimeout(async () => {
          setSearching(true);
          setError(null);
          try {
            const res = await gbSearch(q, apiKey, { maxResults: 20 });
            setResults(res);
          } catch (e) {
            setError(e.message);
            setResults([]);
          }
          setSearching(false);
        }, 600);
        return () => clearTimeout(timerRef.current);
      }, [query, mode, apiKey]);

      // bucket: "wishlist" | "sleeping" | "reading" | "read"
      const handleAdd = (result, bucket) => {
        if (added.has(result.id)) return;
        let status;
        let extra = {};
        if (bucket === "wishlist")      status = { reading: "unread",  ownership: "wanted" };
        else if (bucket === "sleeping") status = { reading: "unread",  ownership: "owned"  };
        else if (bucket === "reading")  { status = { reading: "reading", ownership: "owned" }; extra.startDate = todayISO(); }
        else if (bucket === "read")     { status = { reading: "read",    ownership: "owned" }; extra.endDate = todayISO(); }
        onAdd({ ...result, ...extra, status, addedAt: new Date().toISOString() });
        setAdded(a => new Set([...a, result.id]));
      };

      const titleColor = defaultStatus === "wishlist" ? "#c084fc" : "#e2c97e";
      const titleLabel = defaultStatus === "wishlist" ? "Add to Wishlist" : "Add to Library";

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.88)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 18, width: 620, maxHeight: "85vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 40px 120px rgba(0,0,0,0.95)" }}>

            {/* Header: title + close */}
            <div style={{ padding: "20px 24px 14px", borderBottom: "1px solid #1a2535", flexShrink: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
                <h3 style={{ fontFamily: "'Playfair Display', serif", fontSize: 19, color: titleColor, margin: 0, flex: 1 }}>{titleLabel}</h3>
                <button onClick={onClose} style={{ background: "#0f1923", border: "1px solid #1a2535", color: "#64748b", borderRadius: 8, width: 32, height: 32, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✕</button>
              </div>

              {/* Mode toggle + input — toggle hidden when offline (only Manual makes sense) */}
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                {!offlineMode && (
                  <div style={{ display: "flex", background: "#080f18", border: "1px solid #1e2d3d", borderRadius: 8, padding: 3, flexShrink: 0 }}>
                    {[
                      { val: "text",   label: "Title / Author" },
                      { val: "isbn",   label: "ISBN" },
                      { val: "manual", label: "Manual" },
                    ].map(({ val, label }) => {
                      const active = mode === val;
                      return (
                        <button key={val} onClick={() => { setMode(val); setQuery(""); }}
                          style={{ padding: "6px 12px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: active ? titleColor : "transparent", color: active ? "#0f172a" : "#4a6080", fontFamily: "inherit" }}>
                          {label}
                        </button>
                      );
                    })}
                  </div>
                )}
                {mode !== "manual" && (
                  <input ref={inputRef} value={query} onChange={(e) => setQuery(e.target.value)}
                    placeholder={mode === "isbn" ? "e.g. 978-84-339-9825-5" : "Title or author…"}
                    style={{ flex: 1, background: "#080f18", border: `1px solid ${isbnInvalid ? "#5a2a30" : "#1e2d3d"}`, borderRadius: 10, padding: "10px 14px", color: "#e2e8f0", fontSize: 14, fontFamily: mode === "isbn" ? "'DM Mono', monospace" : "inherit" }}
                    onFocus={(e) => e.target.style.borderColor = isbnInvalid ? "#5a2a30" : `${titleColor}66`}
                    onBlur={(e) => e.target.style.borderColor = isbnInvalid ? "#5a2a30" : "#1e2d3d"} />
                )}
                {mode === "manual" && (
                  <div style={{ flex: 1, fontSize: 12, color: "#4a6080", paddingLeft: offlineMode ? 0 : 8 }}>
                    {offlineMode
                      ? "Offline mode — fill in what you know. Only Title is required."
                      : "Fill in what you know — only Title is required."}
                  </div>
                )}
              </div>
            </div>

            <div style={{ flex: 1, overflowY: "auto", padding: "14px 24px 20px" }}>
              {mode === "manual" ? (
                <ManualBookForm
                  defaultStatus={defaultStatus}
                  accentColor={titleColor}
                  currency={currency}
                  onCreate={(book, bucket) => {
                    let status, extra = {};
                    if (bucket === "wishlist")      status = { reading: "unread",  ownership: "wanted" };
                    else if (bucket === "sleeping") status = { reading: "unread",  ownership: "owned"  };
                    else if (bucket === "reading")  { status = { reading: "reading", ownership: "owned" }; extra.startDate = todayISO(); }
                    else if (bucket === "read")     { status = { reading: "read",    ownership: "owned" }; extra.endDate = todayISO(); }
                    onAdd({
                      id: "manual_" + uuid(),
                      ...book,
                      ...extra,
                      status,
                      addedAt: new Date().toISOString(),
                    });
                    onClose();
                  }}
                />
              ) : (
                <>
              {error && (
                <div style={{ padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 13, marginBottom: 12 }}>
                  Error: {error}
                </div>
              )}
              {mode === "isbn" && isbnInvalid && query.trim().length > 0 && (
                <div style={{ color: "#f87171", fontSize: 12, padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, marginBottom: 12 }}>
                  Not a valid ISBN yet — expecting 10 or 13 digits (hyphens and spaces are fine).
                </div>
              )}
              {searching && <div style={{ color: "#4a6080", fontSize: 13, padding: "20px 0", textAlign: "center" }}>Searching…</div>}
              {!searching && mode === "text" && query.trim().length >= 2 && results.length === 0 && !error && (
                <div style={{ color: "#4a6080", fontSize: 13, padding: "20px 0", textAlign: "center" }}>
                  No results.
                  <div style={{ fontSize: 11, color: "#3d526a", marginTop: 6 }}>
                    Can't find it? <button onClick={() => { setMode("manual"); setQuery(""); }} style={{ background: "none", border: "none", color: titleColor, cursor: "pointer", fontSize: 11, padding: 0, textDecoration: "underline" }}>Add it manually →</button>
                  </div>
                </div>
              )}
              {!searching && mode === "isbn" && !isbnInvalid && normalizeISBN(query) && results.length === 0 && !error && (
                <div style={{ color: "#4a6080", fontSize: 13, padding: "20px 0", textAlign: "center" }}>
                  No book found for this ISBN.
                  <div style={{ fontSize: 11, color: "#3d526a", marginTop: 4 }}>Try the other ISBN format (10 vs 13 digits), Title / Author search, or <button onClick={() => { setMode("manual"); setQuery(""); }} style={{ background: "none", border: "none", color: titleColor, cursor: "pointer", fontSize: 11, padding: 0, textDecoration: "underline" }}>add it manually</button>.</div>
                </div>
              )}
              {results.map(r => {
                const isAdded = added.has(r.id);
                return (
                  <div key={r.id} style={{ display: "flex", gap: 12, padding: "10px 0", borderBottom: "1px solid #0f1923", alignItems: "center" }}>
                    <div style={{ width: 40, height: 60, borderRadius: 4, background: "#080f18", border: "1px solid #1a2535", flexShrink: 0, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {r.image
                        ? <img src={r.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={handleCoverError} />
                        : <span style={{ fontSize: 18 }}>📖</span>}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, fontFamily: "'Playfair Display', serif", color: "#e2e8f0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {r.title}
                        {r.year && <span style={{ color: "#4a6080", fontWeight: 400, fontSize: 12 }}> ({r.year})</span>}
                      </div>
                      <div style={{ fontSize: 12, color: "#7a90a8", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {(r.authors || []).join(", ") || "—"}
                        {r.publisher && <span style={{ color: "#3d526a" }}> · {r.publisher}</span>}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                      {isAdded ? (
                        <button disabled style={{ background: "#0a1929", color: "#4ade80", border: "1px solid #1a3d1a", borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 700, minWidth: 80 }}>✓ Added</button>
                      ) : defaultStatus === "wishlist" ? (
                        <button onClick={() => handleAdd(r, "wishlist")}
                          style={{ background: "#c084fc18", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "7px 14px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>🔖 Wishlist</button>
                      ) : (
                        <>
                          <button onClick={() => handleAdd(r, "sleeping")} title="Owned but unread"
                            style={{ background: "#f8717118", color: "#f87171", border: "1px solid #f8717144", borderRadius: 8, padding: "7px 10px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>💤 Sleeping</button>
                          <button onClick={() => handleAdd(r, "reading")}
                            style={{ background: "#fb923c18", color: "#fb923c", border: "1px solid #fb923c44", borderRadius: 8, padding: "7px 10px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>📖 Reading</button>
                          <button onClick={() => handleAdd(r, "read")}
                            style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "7px 12px", cursor: "pointer", fontWeight: 700, fontSize: 12 }}>✓ Read</button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }


    // ─── BookModal (detail / edit) ────────────────────────────────────────────
    function BookModal({ entry, lists = [], currency = DEFAULT_CURRENCY, onToggleList, onSave, onDelete, onClose }) {
      const [edit, setEdit] = useState(() => {
        const migrated = migrateStatus(entry);
        return {
          rating: null, notes: "", readYear: null, startDate: null, endDate: null,
          advScores: {}, _infoOpen: false, _advOpen: false,
          ...migrated,
        };
      });
      const [imgDragging, setImgDragging] = useState(false);
      const imgInputRef = useRef();

      const set = (k, v) => setEdit(e => ({ ...e, [k]: v }));

      // Two-axis status setters. Business rules:
      //   reading=reading ⇒ ownership auto-upgraded to "owned" (you've clearly got it in hand)
      //   reading=read    ⇒ ownership left as-is (you can read a borrowed book without owning it)
      const setReading = (reading) => {
        setEdit(e => {
          const next = { ...e, status: { ...e.status, reading } };
          // Auto-upgrade ownership from wanted→owned only when actively reading or on hold
          if ((reading === "reading" || reading === "onhold") && next.status.ownership === "wanted") {
            next.status.ownership = "owned";
          }
          if (reading === "reading" && !next.startDate) next.startDate = todayISO();
          if (reading === "read" && !next.endDate) next.endDate = todayISO();
          return next;
        });
      };
      const setOwnership = (ownership) => {
        setEdit(e => ({ ...e, status: { ...e.status, ownership } }));
      };

      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => set("image", e.target.result);
        reader.readAsDataURL(file);
      };

      const setRating = (raw) => {
        if (raw === "" || raw == null) { set("rating", null); return; }
        let n = parseFloat(raw);
        if (isNaN(n)) return;
        n = Math.round(n * 10) / 10;
        n = Math.min(10, Math.max(0, n));
        set("rating", n);
      };

      // Advanced scores → rolled up to .rating when filled
      const ADV_FIELDS = [
        { key: "plot",         label: "Plot" },
        { key: "characters",   label: "Characters" },
        { key: "prose",        label: "Prose" },
        { key: "pacing",       label: "Pacing" },
        { key: "originality",  label: "Originality" },
        { key: "enjoyment",    label: "Enjoyment" },
      ];
      const adv = edit.advScores || {};
      const setAdv = (k, raw) => {
        let val = null;
        if (raw !== "" && raw !== null) {
          let n = parseFloat(raw);
          if (!isNaN(n)) val = Math.min(10, Math.max(0, Math.round(n * 10) / 10));
        }
        const newAdv = { ...adv, [k]: val };
        const filled = ADV_FIELDS.filter(f => newAdv[f.key] != null);
        const newAvg = filled.length > 0
          ? Math.round((filled.reduce((s,f) => s + newAdv[f.key], 0) / filled.length) * 10) / 10
          : null;
        setEdit(e => ({ ...e, advScores: newAdv, rating: newAvg ?? e.rating }));
      };
      const advFilled  = ADV_FIELDS.filter(f => adv[f.key] != null);
      const advOverall = advFilled.length > 0
        ? (advFilled.reduce((s,f) => s + adv[f.key], 0) / advFilled.length).toFixed(1)
        : null;

      const readingStatus = edit.status.reading;
      const ownership = edit.status.ownership;

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.9)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 18, width: 540, maxHeight: "92vh", overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 40px 120px rgba(0,0,0,0.95)" }}>

            {/* Header with cover */}
            <div style={{ position: "relative", padding: "22px 28px 20px", background: "linear-gradient(135deg, #0d1825, #0f2035)", borderBottom: "1px solid #1a2535", flexShrink: 0 }}>
              <button onClick={onClose} style={{ position: "absolute", top: 16, right: 16, background: "rgba(0,0,0,0.4)", border: "1px solid #1e2d3d", color: "#94a3b8", borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 16 }}>
                {/* Clickable cover */}
                <div
                  style={{ width: 80, height: 120, borderRadius: 6, overflow: "hidden", flexShrink: 0, position: "relative", cursor: "pointer", border: imgDragging ? "2px dashed #e2c97e" : "2px solid #1a2535", transition: "border-color 0.2s" }}
                  onClick={() => imgInputRef.current?.click()}
                  onDragOver={(e) => { e.preventDefault(); setImgDragging(true); }}
                  onDragLeave={() => setImgDragging(false)}
                  onDrop={(e) => { e.preventDefault(); setImgDragging(false); handleImageFile(e.dataTransfer.files[0]); }}>
                  {edit.image
                    ? <img src={edit.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }}
                        onError={handleCoverError} />

    // ─── StatsPanel ───────────────────────────────────────────────────────────
    function StatsPanel({ library, currency = DEFAULT_CURRENCY }) {
      const read     = library.filter(b => effectiveBucket(b) === "read");
      const reading  = library.filter(b => effectiveBucket(b) === "reading");
      const onhold   = library.filter(b => effectiveBucket(b) === "onhold");
      const sleeping = library.filter(b => effectiveBucket(b) === "sleeping");
      const wishlist = library.filter(b => effectiveBucket(b) === "wishlist");

      const totalPages = read.reduce((s, b) => s + (b.pageCount || 0), 0);
      const rated = read.filter(b => b.rating != null);
      const avgRating = rated.length ? (rated.reduce((s, b) => s + b.rating, 0) / rated.length).toFixed(2) : "—";

      // Books per year (by endDate)
      const byYear = {};
      read.forEach(b => {
        const y = (b.endDate || "").slice(0, 4);
        if (y) byYear[y] = (byYear[y] || 0) + 1;
      });
      const years = Object.keys(byYear).sort().reverse();

      // Top categories
      const catCounts = {};
      library.forEach(b => (b.categories || []).forEach(c => { catCounts[c] = (catCounts[c] || 0) + 1; }));
      const topCats = Object.entries(catCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

      // Top authors
      const authCounts = {};
      library.forEach(b => (b.authors || []).forEach(a => { authCounts[a] = (authCounts[a] || 0) + 1; }));
      const topAuthors = Object.entries(authCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

      // Languages
      const langCounts = {};
      library.forEach(b => { if (b.language) langCounts[b.language] = (langCounts[b.language] || 0) + 1; });
      const langs = Object.entries(langCounts).sort((a, b) => b[1] - a[1]);

      // Spending — only count books the user owns (excludes wishlist & not_owned).
      // The price field is the purchase price the user entered manually.
      const ownedBooks = library.filter(b => migrateStatus(b).status.ownership === "owned");
      const pricedBooks = ownedBooks.filter(b => typeof b.price === "number" && b.price > 0);
      const totalSpend = pricedBooks.reduce((sum, b) => sum + b.price, 0);
      const avgPrice = pricedBooks.length > 0 ? totalSpend / pricedBooks.length : null;
      const spendSubtitle = pricedBooks.length > 0
        ? `across ${pricedBooks.length} of ${ownedBooks.length} owned`
        : "Add prices in any book's modal";

      const card = (title, content) => (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "18px 20px" }}>
          <div style={{ fontSize: 11, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 12 }}>{title}</div>
          {content}
        </div>
      );

      const kpi = (label, value, color = "#e2c97e", subtitle = null) => (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "18px 20px" }}>

    // ─── ApiKeySetup (first run / reconfigure) ────────────────────────────────
    function ApiKeySetup({ onSaved, onWorkOffline, initialKey = "" }) {
      const [key, setKey] = useState(initialKey);
      const [validating, setValidating] = useState(false);
      const [error, setError] = useState(null);

      const save = async () => {
        setError(null);
        if (!key.trim()) { setError("Enter an API key, or work offline below."); return; }
        setValidating(true);
        const { valid, error } = await validateApiKey(key.trim());
        setValidating(false);
        if (!valid) { setError(`Invalid key: ${error}`); return; }
        // Preserve any existing config (e.g. activeProfileId, currency) when saving the key
        saveConfig({ ...loadConfig(), apiKey: key.trim(), offlineMode: false });
        onSaved(key.trim());
      };

      const goOffline = () => {
        saveConfig({ ...loadConfig(), apiKey: null, offlineMode: true });
        onWorkOffline && onWorkOffline();
      };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #060d14 0%, #0d1825 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 18, padding: "40px 44px", width: 500, boxShadow: "0 40px 120px rgba(0,0,0,0.7)" }}>

              <div style={{ fontSize: 44, marginBottom: 6 }}>📖</div>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 900, fontSize: 32, letterSpacing: "-0.02em", margin: 0 }}>
                <span style={{ color: "#e2c97e" }}>Plot</span><span style={{ color: "#60a5fa" }}>Twist</span>
              </h1>
              <div style={{ color: "#4a6080", fontSize: 13, fontStyle: "italic", marginTop: 4 }}>Your reading journal</div>
            </div>
            <h2 style={{ fontSize: 15, color: "#e2e8f0", marginBottom: 10, fontWeight: 600 }}>Initial setup</h2>
            <p style={{ color: "#7a90a8", fontSize: 13, lineHeight: 1.6, marginBottom: 6 }}>
              Add a Google Books API key to search and import books automatically.
            </p>
            <p style={{ color: "#4a6080", fontSize: 12, lineHeight: 1.6, marginBottom: 18 }}>
              Get one free at <code style={{ background: "#080f18", padding: "1px 6px", borderRadius: 3, color: "#60a5fa", fontFamily: "'DM Mono', monospace" }}>console.cloud.google.com</code> — enable the Books API and create an API key.
            </p>

            <label style={{ display: "block", fontSize: 11, color: "#3d526a", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Google Books API Key</label>

              onKeyDown={(e) => e.key === "Enter" && save()}
              placeholder="AIzaSy..."
              style={{ width: "100%", background: "#080f18", border: "1px solid #1e2d3d", borderRadius: 10, padding: "11px 14px", color: "#e2e8f0", fontSize: 14, fontFamily: "'DM Mono', monospace" }}
              onFocus={(e) => e.target.style.borderColor = "#e2c97e66"}
              onBlur={(e) => e.target.style.borderColor = "#1e2d3d"} />

              <div style={{ marginTop: 12, padding: "10px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 13 }}>

            <button onClick={save} disabled={validating}
              style={{ width: "100%", marginTop: 18, background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 10, padding: "12px 20px", cursor: validating ? "default" : "pointer", fontWeight: 700, fontSize: 14, opacity: validating ? 0.6 : 1 }}>
              {validating ? "Validating…" : "Save & start reading"}

            {/* Divider */}

    // ─── Main App ─────────────────────────────────────────────────────────────
    function App({ logoSlot }) {
      const initialConfig = useMemo(() => loadConfig(), []);
      const [apiKey, setApiKey]    = useState(initialConfig.apiKey);
      const [offlineMode, setOfflineMode] = useState(initialConfig.offlineMode);
      const [currency, setCurrency] = useState(initialConfig.currency);
      const [profiles, setProfiles] = useState(() => loadProfiles());
      const [activeProfileId, setActiveProfileId] = useState(initialConfig.activeProfileId);
      const [library, setLibrary] = useState([]);
      const [lists, setLists] = useState([]);
      const [activeList, setActiveList] = useState("all");
      const [selected, setSelected] = useState(null);
      const [showSearch, setShowSearch] = useState(false);
      const [searchAsWishlist, setSearchAsWishlist] = useState(false);
      const [activeTab, setActiveTab] = useState("library");
      const [filterQ, setFilterQ] = useState("");
      const [sortBy, setSortBy] = useState("added");
      const [newListName, setNewListName] = useState("");
      const [renamingId, setRenamingId] = useState(null);
      const [renameVal, setRenameVal] = useState("");
      const [confirmDeleteList, setConfirmDeleteList] = useState(null);
      const [profileMenuOpen, setProfileMenuOpen] = useState(false);

      const activeProfile = profiles.find(p => p.id === activeProfileId) || null;
      const accent = activeProfile ? colorOf(activeProfile.color) : "#e2c97e";

      // Re-load library + lists whenever the active profile changes
      useEffect(() => {
        if (!activeProfileId) {
          setLibrary([]);
          setLists([]);
          return;
        }
        setLibrary(loadLibrary(activeProfileId).map(b => {
          const migrated = migrateStatus(b);
          if (migrated.image) migrated.image = upgradeCoverUrl(migrated.image);
          return migrated;
        }));
        setLists(loadLists(activeProfileId));
        // Reset transient view state when switching profiles
        setActiveList("all");
        setActiveTab("library");
        setSelected(null);
        setFilterQ("");
      }, [activeProfileId]);

      // Persist library / lists whenever they change (skipped on first render of a profile)
      const lastSavedFor = useRef({ profile: null, library: false, lists: false });
      useEffect(() => {
        if (!activeProfileId) return;
        if (lastSavedFor.current.profile !== activeProfileId) {
          lastSavedFor.current = { profile: activeProfileId, library: false, lists: false };
          return;
        }
        if (!lastSavedFor.current.library) { lastSavedFor.current.library = true; return; }
        saveLibrary(activeProfileId, library);
      }, [library, activeProfileId]);

      useEffect(() => {
        if (!activeProfileId) return;
        if (lastSavedFor.current.profile !== activeProfileId) return;
        if (!lastSavedFor.current.lists) { lastSavedFor.current.lists = true; return; }
        saveLists(activeProfileId, lists);
      }, [lists, activeProfileId]);

      // Persist profiles index
      const isFirstProfilesRender = useRef(true);
      useEffect(() => {
        if (isFirstProfilesRender.current) { isFirstProfilesRender.current = false; return; }
        saveProfiles(profiles);
      }, [profiles]);

      // Persist active profile id whenever it changes
      useEffect(() => {
        if (activeProfileId) {
          const cfg = loadConfig();
          saveConfig({ ...cfg, activeProfileId });
        }
      }, [activeProfileId]);

      const addBook = (book) => setLibrary(cur => {
        const idx = cur.findIndex(b => b.id === book.id);
        if (idx === -1) return [book, ...cur];
        const updated = [...cur];
        updated[idx] = { ...updated[idx], ...book };
        return updated;
      });

      const saveBook = (updated) => {
        setLibrary(cur => cur.map(b => b.id === updated.id ? updated : b));
        setSelected(null);
      };

      const deleteBook = (id) => {
        setLibrary(cur => cur.filter(b => b.id !== id));
        setLists(cur => cur.map(l => ({ ...l, bookIds: l.bookIds.filter(bid => bid !== id) })));
        setSelected(null);
      };

      // Lists CRUD
      const createList = () => {
        const name = newListName.trim();
        if (!name) return;
        const id = "list_" + Date.now();
        setLists(cur => [...cur, { id, name, bookIds: [] }]);
        setNewListName("");
        setActiveList(id);
      };
      const renameList = (id) => {
        const val = renameVal.trim();
        if (val) setLists(cur => cur.map(l => l.id === id ? { ...l, name: val } : l));
        setRenamingId(null);
      };
      const deleteList = (id) => {
        setLists(cur => cur.filter(l => l.id !== id));
        if (activeList === id) setActiveList("all");
        setConfirmDeleteList(null);
      };

      // Toggle a book's membership in a custom list. If already in the list, remove it; otherwise add it.
      const toggleBookInList = (bookId, listId) => {
        setLists(cur => cur.map(l => {
          if (l.id !== listId) return l;
          const inList = l.bookIds.includes(bookId);
          return { ...l, bookIds: inList ? l.bookIds.filter(b => b !== bookId) : [...l.bookIds, bookId] };
        }));
      };

      // Built-in filters — use effectiveBucket to account for two-axis status
      const builtinFilter = {
        all:      (b) => true,
        reading:  (b) => effectiveBucket(b) === "reading",
        read:     (b) => effectiveBucket(b) === "read",
        onhold:   (b) => effectiveBucket(b) === "onhold",
        sleeping: (b) => effectiveBucket(b) === "sleeping",
        wishlist: (b) => effectiveBucket(b) === "wishlist",
      };

      const listCount = (listId) => {
        if (builtinFilter[listId]) return library.filter(builtinFilter[listId]).length;
        const l = lists.find(x => x.id === listId);
        return l ? l.bookIds.length : 0;
      };

      // Current filtered + sorted view
      const filtered = useMemo(() => {
        let items = library;
        if (builtinFilter[activeList]) {
          items = items.filter(builtinFilter[activeList]);
        } else {
          const l = lists.find(x => x.id === activeList);
          items = l ? items.filter(b => l.bookIds.includes(b.id)) : items;
        }
        if (filterQ) {
          const q = filterQ.toLowerCase();
          items = items.filter(b =>
            (b.title || "").toLowerCase().includes(q) ||
            (b.authors || []).some(a => a.toLowerCase().includes(q))
          );
        }
        const sorted = [...items];
        const dir = 1;
        if (sortBy === "title")  sorted.sort((a, b) => (a.title || "").localeCompare(b.title || "") * dir);
        else if (sortBy === "author") sorted.sort((a, b) => ((a.authors?.[0] || "").localeCompare(b.authors?.[0] || "")) * dir);
        else if (sortBy === "rating") sorted.sort((a, b) => ((b.rating ?? -1) - (a.rating ?? -1)));
        else if (sortBy === "year")   sorted.sort((a, b) => (b.year || "0").localeCompare(a.year || "0"));
        else sorted.sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || ""));  // added desc
        return sorted;
      }, [library, lists, activeList, filterQ, sortBy]);

      const activeCustom = lists.find(l => l.id === activeList);

      // ── Profile management handlers ──
      const createProfile = (name, colorId) => {
        const trimmed = (name || "").trim();
        if (!trimmed) return null;
        const id = "prof_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const p = { id, name: trimmed, color: colorId || "gold", createdAt: new Date().toISOString() };
        setProfiles(cur => [...cur, p]);
        return p;
      };

      const renameProfile = (id, newName) => {
        const trimmed = (newName || "").trim();
        if (!trimmed) return;
        setProfiles(cur => cur.map(p => p.id === id ? { ...p, name: trimmed } : p));
      };

      const setProfileColor = (id, colorId) => {
        setProfiles(cur => cur.map(p => p.id === id ? { ...p, color: colorId } : p));
      };

      const deleteProfile = (id) => {
        // Never allow deleting the last profile
        if (profiles.length <= 1) return;
        // Wipe profile data on disk
        deleteProfileData(id);
        const remaining = profiles.filter(p => p.id !== id);
        setProfiles(remaining);
        // If we deleted the active profile, switch to another one
        if (activeProfileId === id) {
          setActiveProfileId(remaining[0].id);
        }
      };

      const switchProfile = (id) => {
        if (id !== activeProfileId) setActiveProfileId(id);
        setProfileMenuOpen(false);
      };

      // ── Gating ──
      // 1. If no API key AND not explicitly offline → setup screen
      if (!apiKey && !offlineMode) {
        return <ApiKeySetup
          onSaved={(k) => { setApiKey(k); setOfflineMode(false); }}
          onWorkOffline={() => { setOfflineMode(true); setApiKey(null); }}
        />;
      }
      // 2. If we have an API key but no profiles or no active profile → profile picker
      if (profiles.length === 0 || !activeProfile) {
        return (
          <ProfilePicker
            profiles={profiles}
            onCreate={(name, colorId) => {
              const p = createProfile(name, colorId);
              if (p) setActiveProfileId(p.id);
            }}
            onSelect={(id) => setActiveProfileId(id)}
          />
        );
      }

      return (
        <div style={{ minHeight: "100vh", background: "#060d14" }}>

          {/* ── Nav ── */}
          <nav style={{ background: "#080f18", borderBottom: "1px solid #1a2535", padding: "0 28px", display: "flex", alignItems: "center", height: 58, position: "sticky", top: 0, zIndex: 100 }}>
            {logoSlot}
            <div style={{ display: "flex", gap: 2 }}>
              {[["library","Library"],["stats","Stats"],["settings","Settings"]].map(([key, label]) => (
                <button key={key} onClick={() => setActiveTab(key)}
                  style={{ background: "none", border: "none", padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600, color: activeTab === key ? "#e2c97e" : "#3d526a", borderRadius: 6 }}>
                  {label}
                </button>
              ))}
            </div>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ color: "#3d526a", fontSize: 13 }}>{library.filter(b => effectiveBucket(b) !== "wishlist").length} in library</span>
              <button onClick={() => { setSearchAsWishlist(false); setShowSearch(true); }}
                style={{ background: "transparent", color: "#e2c97e", border: "1px solid #e2c97e44", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#e2c97e"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#e2c97e44"}>
                + Add to Library
              </button>
              <button onClick={() => { setSearchAsWishlist(true); setShowSearch(true); }}
                style={{ background: "transparent", color: "#c084fc", border: "1px solid #c084fc44", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#c084fc"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#c084fc44"}>
                + Add to Wishlist
              </button>

              {/* Profile menu */}
              <div style={{ position: "relative", marginLeft: 4 }}>
                <button onClick={() => setProfileMenuOpen(o => !o)}
                  style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
                  <ProfileChip profile={activeProfile} size={36} />
                  <span style={{ color: "#3d526a", fontSize: 11, transform: profileMenuOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>▾</span>
                </button>

                {profileMenuOpen && (
                  <>
                    {/* Click-out catcher */}
                    <div onClick={() => setProfileMenuOpen(false)}
                      style={{ position: "fixed", inset: 0, zIndex: 90 }} />
                    <div style={{ position: "absolute", top: "100%", right: 0, marginTop: 8, background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 12, minWidth: 220, padding: 6, zIndex: 91, boxShadow: "0 16px 48px rgba(0,0,0,0.6)" }}>
                      <div style={{ padding: "8px 12px 4px", fontSize: 10, color: "#3d526a", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Profiles</div>
                      {profiles.map(p => {
                        const isActive = p.id === activeProfileId;
                        const c = colorOf(p.color);
                        return (
                          <button key={p.id} onClick={() => switchProfile(p.id)}
                            style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: isActive ? `${c}15` : "transparent", border: "none", cursor: "pointer", borderRadius: 7, textAlign: "left" }}
                            onMouseEnter={(e) => { if (!isActive) e.currentTarget.style.background = "#0a1520"; }}
                            onMouseLeave={(e) => { if (!isActive) e.currentTarget.style.background = "transparent"; }}>
                            <ProfileChip profile={p} size={28} />
                            <span style={{ flex: 1, fontSize: 13, color: isActive ? c : "#94a3b8", fontWeight: isActive ? 700 : 500 }}>{p.name}</span>
                            {isActive && <span style={{ fontSize: 11, color: c }}>✓</span>}
                          </button>
                        );
                      })}
                      <div style={{ height: 1, background: "#1a2535", margin: "6px 4px" }} />
                      <button onClick={() => { setProfileMenuOpen(false); setActiveTab("settings"); }}
                        style={{ width: "100%", padding: "8px 10px", background: "transparent", border: "none", cursor: "pointer", borderRadius: 7, color: "#7a90a8", fontSize: 13, textAlign: "left", display: "flex", alignItems: "center", gap: 10 }}
                        onMouseEnter={(e) => e.currentTarget.style.background = "#0a1520"}
                        onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                        <span style={{ width: 28, textAlign: "center" }}>⚙</span>
                        Manage profiles
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          </nav>

          {/* ── Body ── */}
          {activeTab === "stats" ? (
            <main style={{ maxWidth: 1320, margin: "0 auto", padding: "28px 28px 60px" }}>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, color: "#e2c97e", marginBottom: 24 }}>Your reading stats</h1>
              <StatsPanel library={library} currency={currency} />
            </main>
          ) : activeTab === "settings" ? (
            <main style={{ maxWidth: 720, margin: "0 auto", padding: "28px 28px 60px" }}>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, color: "#e2c97e", marginBottom: 24 }}>Settings</h1>
              <SettingsPanel
                apiKey={apiKey}
                offlineMode={offlineMode}
                currency={currency}
                onApiKeyChange={(k) => {
                  // Setting a key always exits offline mode
                  saveConfig({ ...loadConfig(), apiKey: k, offlineMode: false });
                  setApiKey(k);
                  setOfflineMode(false);
                }}
                onGoOffline={() => {
                  saveConfig({ ...loadConfig(), apiKey: null, offlineMode: true });
                  setApiKey(null);
                  setOfflineMode(true);
                }}
                onCurrencyChange={(c) => {
                  saveConfig({ ...loadConfig(), currency: c });
                  setCurrency(c);
                }}
                library={library}
                lists={lists}
                onImport={(parsed, mode) => {
                  // parsed = { books, listAssignments, filename }
                  const result = applyImport(parsed, library, lists, mode);
                  // Run new books through migration + cover upgrade so they slot in cleanly
                  const cleanLib = result.library.map(b => {
                    const m = migrateStatus(b);
                    if (m.image) m.image = upgradeCoverUrl(m.image);
                    return m;
                  });
                  setLibrary(cleanLib);
                  setLists(result.lists);
                }}
                profiles={profiles}
                activeProfileId={activeProfileId}
                onCreateProfile={(name, colorId) => { createProfile(name, colorId); }}
                onRenameProfile={renameProfile}
                onSetProfileColor={setProfileColor}
                onDeleteProfile={deleteProfile}
                onSwitchProfile={switchProfile}
              />
            </main>
          ) : (
            <div style={{ display: "flex", minHeight: "calc(100vh - 58px)" }}>

              {/* ── Sidebar ── */}
              <aside style={{ width: 210, flexShrink: 0, background: "#080f18", borderRight: "1px solid #0f1923", padding: "20px 0", display: "flex", flexDirection: "column", gap: 1, position: "sticky", top: 58, height: "calc(100vh - 58px)", overflowY: "auto" }}>

                {/* All */}
                {[
                  { id: "all",      label: "All",       activeColor: "#e2c97e", activeBg: "#e2c97e18", dim: "#7a90a8" },
                ].map(({ id, label, activeColor, activeBg, dim }) => {
                  const active = activeList === id;
                  return (
                    <button key={id} onClick={() => setActiveList(id)}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px", padding: "8px 12px", borderRadius: 8, border: "none", cursor: "pointer", background: active ? activeBg : "transparent", color: active ? activeColor : dim, fontSize: 13, fontWeight: active ? 700 : 500, textAlign: "left" }}
                      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                      <span>{label}</span>
                      <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.55 }}>{listCount(id)}</span>
                    </button>
                  );
                })}

                {/* Status subcollections */}
                <div style={{ padding: "10px 12px 4px 16px", fontSize: 10, color: "#2d3f55", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Status</div>
                {[
                  { id: "reading",  label: "Reading",        color: "#fb923c" },
                  { id: "onhold",   label: "On hold",        color: "#f59e0b" },
                  { id: "read",     label: "Read",           color: "#4ade80" },
                  { id: "sleeping", label: "Sleeping Shelf", color: "#f87171" },
                  { id: "wishlist", label: "Wishlist",       color: "#c084fc" },
                ].map(({ id, label, color }) => {
                  const active = activeList === id;
                  return (
                    <button key={id} onClick={() => setActiveList(id)}
                      style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 8px 0 20px", padding: "7px 12px", borderRadius: 7, border: "none", cursor: "pointer", background: active ? `${color}18` : "transparent", color: active ? color : "#5a7080", fontSize: 12, fontWeight: active ? 700 : 400, textAlign: "left" }}
                      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "#0d1825"; }}
                      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                      <span>{label}</span>
                      <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.5 }}>{listCount(id)}</span>
                    </button>
                  );
                })}

                {/* Custom lists */}
                <div style={{ padding: "14px 12px 4px 16px", fontSize: 10, color: "#2d3f55", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 }}>Lists</div>
                {lists.map(l => {
                  const active = activeList === l.id;
                  return (
                    <div key={l.id} style={{ margin: "0 8px 0 28px" }}>
                      {renamingId === l.id ? (
                        <div style={{ display: "flex", gap: 4, padding: "3px 4px" }}>
                          <input autoFocus value={renameVal} onChange={(e) => setRenameVal(e.target.value)}
                            onKeyDown={(e) => { if (e.key === "Enter") renameList(l.id); if (e.key === "Escape") setRenamingId(null); }}
                            style={{ flex: 1, background: "#0d1825", border: "1px solid #e2c97e44", borderRadius: 5, padding: "4px 8px", color: "#e2e8f0", fontSize: 12, minWidth: 0 }} />
                          <button onClick={() => renameList(l.id)} style={{ background: "#e2c97e22", border: "none", borderRadius: 5, color: "#e2c97e", cursor: "pointer", padding: "4px 7px", fontSize: 12 }}>✓</button>
                        </div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "center", borderRadius: 7, background: active ? "#60a5fa15" : "transparent" }}>
                          <button onClick={() => setActiveList(l.id)}
                            style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 6px 7px 10px", border: "none", cursor: "pointer", background: "transparent", color: active ? "#60a5fa" : "#4a6070", fontSize: 12, fontWeight: active ? 700 : 400, textAlign: "left", minWidth: 0 }}>
                            <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name}</span>
                            <span style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.5, flexShrink: 0, marginLeft: 4 }}>{l.bookIds.length}</span>
                          </button>
                          <button title="Rename" onClick={() => { setRenamingId(l.id); setRenameVal(l.name); }}
                            style={{ background: "none", border: "none", color: "#2d3f55", cursor: "pointer", padding: "4px 4px", fontSize: 11, borderRadius: 4, flexShrink: 0 }}
                            onMouseEnter={(e) => e.currentTarget.style.color = "#8899aa"}
                            onMouseLeave={(e) => e.currentTarget.style.color = "#2d3f55"}>✎</button>
                          <button title="Delete" onClick={() => setConfirmDeleteList(l.id)}
                            style={{ background: "none", border: "none", color: "#2d3f55", cursor: "pointer", padding: "4px 6px 4px 2px", fontSize: 11, borderRadius: 4, flexShrink: 0 }}
                            onMouseEnter={(e) => e.currentTarget.style.color = "#f87171"}
                            onMouseLeave={(e) => e.currentTarget.style.color = "#2d3f55"}>✕</button>
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* New list input */}
                <div style={{ marginTop: "auto", padding: "16px 10px 4px", borderTop: "1px solid #0f1923" }}>
                  <div style={{ display: "flex", gap: 5 }}>
                    <input value={newListName} onChange={(e) => setNewListName(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && createList()}
                      placeholder="New list…"
                      style={{ flex: 1, background: "#0a1520", border: "1px solid #1a2535", borderRadius: 7, padding: "7px 10px", color: "#e2e8f0", fontSize: 12, minWidth: 0 }} />
                    <button onClick={createList}
                      style={{ background: "#e2c97e22", border: "1px solid #e2c97e44", borderRadius: 7, color: "#e2c97e", cursor: "pointer", padding: "0 10px", fontSize: 14, fontWeight: 700, flexShrink: 0 }}>+</button>
                  </div>
                </div>
              </aside>

              {/* ── Main grid ── */}
              <main style={{ flex: 1, minWidth: 0, padding: "24px 28px 60px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20, flexWrap: "wrap" }}>
                  <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 26, color: "#e2c97e", margin: 0 }}>
                    {activeList === "all"      ? "All books"
                    : activeList === "reading" ? "Currently reading"
                    : activeList === "onhold"  ? "On hold"
                    : activeList === "read"    ? "Read"
                    : activeList === "sleeping"? "Sleeping Shelf"
                    : activeList === "wishlist"? "Wishlist"
                    : activeCustom ? activeCustom.name : "Library"}
                  </h1>
                  <span style={{ color: "#3d526a", fontSize: 14 }}>{filtered.length} {filtered.length === 1 ? "book" : "books"}</span>

                  <div style={{ marginLeft: "auto", display: "flex", gap: 10, alignItems: "center" }}>
                    <input value={filterQ} onChange={(e) => setFilterQ(e.target.value)}
                      placeholder="Filter…"
                      style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "7px 12px", color: "#e2e8f0", fontSize: 13, width: 180 }} />
                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)}
                      style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 8, padding: "7px 10px", color: "#e2e8f0", fontSize: 13, cursor: "pointer" }}>
                      <option value="added">Sort: Recent</option>
                      <option value="title">Sort: Title</option>
                      <option value="author">Sort: Author</option>
                      <option value="rating">Sort: Rating</option>
                      <option value="year">Sort: Year</option>
                    </select>
                  </div>
                </div>

                {filtered.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "80px 20px", color: "#3d526a" }}>
                    <div style={{ fontSize: 48, marginBottom: 10, opacity: 0.5 }}>📖</div>
                    <div style={{ fontSize: 15 }}>
                      {library.length === 0
                        ? "Your library is empty. Click + Add to Library to start."
                        : "No books match this view."}
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(175px, 1fr))", gap: 18 }}>
                    {filtered.map(b => (
                      <BookCard key={b.id} entry={b}
                        onSelect={() => setSelected(b)}
                        inList={activeCustom ? activeCustom.bookIds.includes(b.id) : undefined} />
                    ))}
                  </div>
                )}
              </main>
            </div>
          )}

          {/* ── Modals ── */}
          {showSearch && (
            <SearchModal
              apiKey={apiKey}
              offlineMode={!apiKey}
              currency={currency}
              defaultStatus={searchAsWishlist ? "wishlist" : "reading"}
              existingIds={new Set(library.map(b => b.id))}
              onAdd={addBook}
              onClose={() => setShowSearch(false)} />
          )}
          {selected && (
            <BookModal
              entry={selected}
              lists={lists}
              currency={currency}
              onToggleList={(listId) => toggleBookInList(selected.id, listId)}
              onSave={saveBook}
              onDelete={deleteBook}
              onClose={() => setSelected(null)} />
          )}
          {confirmDeleteList && (
            <div style={{ position: "fixed", inset: 0, zIndex: 300, background: "rgba(0,0,0,0.88)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
              onClick={(e) => e.target === e.currentTarget && setConfirmDeleteList(null)}>
              <div style={{ background: "#0d1825", border: "1px solid #1e2d3d", borderRadius: 12, padding: 24, width: 380 }}>
                <div style={{ fontSize: 15, color: "#e2e8f0", marginBottom: 6, fontWeight: 600 }}>Delete list?</div>
                <div style={{ fontSize: 13, color: "#7a90a8", marginBottom: 18 }}>The list will be removed. Books in it will remain in your library.</div>
                <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                  <button onClick={() => setConfirmDeleteList(null)}
                    style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  <button onClick={() => deleteList(confirmDeleteList)}
                    style={{ background: "#f87171", border: "none", color: "#0f172a", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── SettingsPanel ────────────────────────────────────────────────────────
    // ─── ExportImportPanel ────────────────────────────────────────────────────
    // Lives inside SettingsPanel. Lets the user save the active profile's
    // collection to CSV/XML, or import one back (replace or merge).
    function ExportImportPanel({ library, lists, profileName, onImport }) {
      const [exported,    setExported]    = useState(null);
      const [importData,  setImportData]  = useState(null);
      const [importError, setImportError] = useState(null);
      const [importMode,  setImportMode]  = useState("merge");
      const [dragging,    setDragging]    = useState(false);
      const fileRef = useRef();

      const doExport = (fmt) => {
        setExported(null);
        const ts = new Date().toISOString().slice(0, 10);
        const safeName = (profileName || "library").replace(/[^a-zA-Z0-9_-]/g, "_");
        const filename = `plottwist-${safeName}-${ts}.${fmt}`;
        const content = fmt === "csv" ? collectionToCSV(library, lists) : collectionToXML(library, lists);
        const mime    = fmt === "csv" ? "text/csv" : "application/xml";
        const result  = downloadFile(content, filename, mime);
        setExported({ filename, dir: result?.dir });
      };

      const handleFile = (file) => {
        setImportError(null);
        setImportData(null);
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          try {
            const parsed = file.name.toLowerCase().endsWith(".xml")
              ? importFromXML(text)
              : importFromCSV(text);
            if (!parsed.books.length) {
              setImportError("File parsed but no books found.");
              return;
            }
            setImportData({ ...parsed, filename: file.name });
          } catch (err) {
            setImportError(`Could not parse file: ${err.message}`);
          }
        };
        reader.onerror = () => setImportError("Could not read file.");
        reader.readAsText(file);
      };

      const confirmImport = () => {
        if (!importData) return;
        onImport(importData, importMode);
        setImportData(null);
        setExported(null);
      };

      const card = (children) => (
        <div style={{ background: "#080f18", border: "1px solid #1a2535", borderRadius: 10, padding: "14px 16px" }}>{children}</div>
      );

      return (
        <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
          <div style={{ fontSize: 11, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 4 }}>Backup & sharing</div>
          <div style={{ fontSize: 11, color: "#3d526a", marginBottom: 14 }}>
            Export {profileName ? <span style={{ color: "#94a3b8" }}>{profileName}</span> : "this profile"}'s library and lists, or import a previously-exported file.
          </div>

          {/* Export */}
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 11, color: "#7a90a8", marginBottom: 8, fontWeight: 600 }}>EXPORT</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <button onClick={() => doExport("csv")}
                style={{ background: "#0a1520", border: "1px solid #1a2535", color: "#e2e8f0", borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#e2c97e66"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#1a2535"}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 2 }}>CSV</div>
                <div style={{ fontSize: 11, color: "#4a6080" }}>Spreadsheet-friendly. Covers excluded.</div>
              </button>
              <button onClick={() => doExport("xml")}
                style={{ background: "#0a1520", border: "1px solid #1a2535", color: "#e2e8f0", borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "#60a5fa66"}
                onMouseLeave={(e) => e.currentTarget.style.borderColor = "#1a2535"}>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 2 }}>XML</div>
                <div style={{ fontSize: 11, color: "#4a6080" }}>Complete. Includes covers and descriptions.</div>
              </button>
            </div>

            {exported && (
              <div style={{ marginTop: 12, padding: "10px 14px", background: "#0a1f0a", border: "1px solid #1a3d1a", borderRadius: 8, fontSize: 12 }}>
                <div style={{ color: "#4ade80", fontWeight: 600 }}>✓ Exported</div>
                <div style={{ color: "#7a90a8", fontFamily: "'DM Mono', monospace", fontSize: 11, marginTop: 4 }}>
                  {exported.dir ? <>Saved to <code style={{ color: "#60a5fa" }}>plottwist-exports/{exported.filename}</code></> : exported.filename}
                </div>
              </div>
            )}
          </div>

          {/* Import */}
          <div>
            <div style={{ fontSize: 11, color: "#7a90a8", marginBottom: 8, fontWeight: 600 }}>IMPORT</div>

            {!importData ? (
              <>
                <div
                  onClick={() => fileRef.current?.click()}
                  onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                  onDragLeave={() => setDragging(false)}
                  onDrop={(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
                  style={{ padding: "20px 16px", borderRadius: 10, cursor: "pointer", textAlign: "center",
                    background: dragging ? "#0a1929" : "#0a1520",
                    border: dragging ? "2px dashed #60a5fa" : "2px dashed #1e2d3d",
                    transition: "border-color 0.15s, background 0.15s" }}
                  onMouseEnter={(e) => { if (!dragging) e.currentTarget.style.borderColor = "#3d526a"; }}
                  onMouseLeave={(e) => { if (!dragging) e.currentTarget.style.borderColor = "#1e2d3d"; }}>
                  <div style={{ fontSize: 22, marginBottom: 4 }}>📥</div>
                  <div style={{ color: "#94a3b8", fontWeight: 600, fontSize: 13, marginBottom: 2 }}>Drop a CSV or XML file here</div>
                  <div style={{ color: "#3d526a", fontSize: 11 }}>or click to browse</div>
                </div>
                <input ref={fileRef} type="file" accept=".csv,.xml" style={{ display: "none" }}
                  onChange={(e) => handleFile(e.target.files[0])} />
                {importError && (
                  <div style={{ marginTop: 10, padding: "9px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 12 }}>
                    ⚠ {importError}
                  </div>
                )}
              </>
            ) : (
              <div>
                {card(
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ fontSize: 22 }}>📦</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ color: "#4ade80", fontWeight: 600, fontSize: 13 }}>{importData.books.length} books found</div>
                      <div style={{ color: "#3d526a", fontSize: 11, marginTop: 2, fontFamily: "'DM Mono', monospace" }}>{importData.filename}</div>
                    </div>
                  </div>
                )}

                <div style={{ marginTop: 12 }}>
                  <div style={{ fontSize: 11, color: "#3d526a", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Mode</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {[
                      { val: "merge",   label: "Merge", desc: "Add new entries, update existing ones (matched by ID). Keeps your other books." },
                      { val: "replace", label: "Replace", desc: "Wipe the current library and lists, then import." },
                    ].map(({ val, label, desc }) => {
                      const active = importMode === val;
                      return (
                        <label key={val} style={{ display: "flex", gap: 10, padding: "10px 12px", borderRadius: 8, border: `1px solid ${active ? "#e2c97e44" : "#1a2535"}`, background: active ? "#e2c97e10" : "#0a1520", cursor: "pointer" }}>
                          <input type="radio" name="importMode" checked={active} onChange={() => setImportMode(val)}
                            style={{ accentColor: "#e2c97e", marginTop: 2 }} />
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 700, color: active ? "#e2c97e" : "#e2e8f0" }}>{label}</div>
                            <div style={{ fontSize: 11, color: "#7a90a8", marginTop: 2 }}>{desc}</div>
                          </div>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {importMode === "replace" && (
                  <div style={{ marginTop: 12, padding: "9px 14px", background: "#2d1518", border: "1px solid #5a2a30", borderRadius: 8, color: "#f87171", fontSize: 12 }}>
                    ⚠ This will permanently delete your current {library.length} books and {lists.length} lists for this profile.
                  </div>
                )}

                <div style={{ display: "flex", gap: 8, marginTop: 14, justifyContent: "flex-end" }}>
                  <button onClick={() => { setImportData(null); setImportError(null); }}
                    style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  <button onClick={confirmImport}
                    style={{ background: "#e2c97e", border: "none", color: "#0f172a", borderRadius: 8, padding: "8px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>
                    {importMode === "replace" ? "Replace library" : "Merge import"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SettingsPanel({ apiKey, offlineMode, currency, onApiKeyChange, onGoOffline, onCurrencyChange, library, lists, onImport,
                              profiles, activeProfileId,
                              onCreateProfile, onRenameProfile, onSetProfileColor,
                              onDeleteProfile, onSwitchProfile }) {
      const [key, setKey] = useState(apiKey || "");
      const [msg, setMsg] = useState(null);
      const [validating, setValidating] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState("");
      const [creatingNew, setCreatingNew] = useState(false);
      const [newName, setNewName] = useState("");
      const [newColor, setNewColor] = useState("blue");
      const [confirmDelete, setConfirmDelete] = useState(null);

      const update = async () => {
        setMsg(null);
        if (!key.trim()) { setMsg({ type: "error", text: "Enter an API key." }); return; }
        setValidating(true);
        const { valid, error } = await validateApiKey(key.trim());
        setValidating(false);
        if (!valid) { setMsg({ type: "error", text: `Invalid key: ${error}` }); return; }
        onApiKeyChange(key.trim());
        setMsg({ type: "ok", text: "API key updated." });
      };

      const submitRename = (id) => {
        if (editName.trim()) onRenameProfile(id, editName.trim());
        setEditingId(null);
      };
      const submitNew = () => {
        if (!newName.trim()) return;
        onCreateProfile(newName.trim(), newColor);
        setNewName(""); setNewColor("blue"); setCreatingNew(false);
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>

          {/* Profiles */}

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, gap: 10 }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    {PROFILE_COLORS.map(col => (
                      <button key={col.id} onClick={() => setNewColor(col.id)}
                        style={{ width: 18, height: 18, borderRadius: "50%", background: col.value, border: newColor === col.id ? "2px solid #e2e8f0" : "2px solid transparent", cursor: "pointer", padding: 0, opacity: newColor === col.id ? 1 : 0.5 }} />
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => { setCreatingNew(false); setNewName(""); }}
                      style={{ background: "transparent", border: "1px solid #1a2535", color: "#94a3b8", borderRadius: 6, padding: "6px 14px", cursor: "pointer", fontSize: 12 }}>Cancel</button>
                    <button onClick={submitNew} disabled={!newName.trim()}
                      style={{ background: newName.trim() ? colorOf(newColor) : "#1a2535", color: newName.trim() ? "#0f172a" : "#3d526a", border: "none", borderRadius: 6, padding: "6px 14px", cursor: newName.trim() ? "pointer" : "default", fontWeight: 700, fontSize: 12 }}>Create</button>
                  </div>

              </div>
            ) : (
              <button onClick={() => setCreatingNew(true)}
                style={{ marginTop: 12, background: "transparent", border: "1px dashed #2d3f55", color: "#7a90a8", borderRadius: 8, padding: "9px 16px", cursor: "pointer", fontSize: 12, width: "100%" }}
                onMouseEnter={(e) => { e.currentTarget.style.borderColor = "#e2c97e66"; e.currentTarget.style.color = "#e2c97e"; }}
                onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#2d3f55"; e.currentTarget.style.color = "#7a90a8"; }}>
                + Add profile
              </button>
            )}
          </div>

          {/* Mode + API key */}
          <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
              <div style={{ fontSize: 11, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Google Books API Key</div>
              <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em",
                background: offlineMode ? "#94a3b822" : "#4ade8022",
                color:      offlineMode ? "#94a3b8" : "#4ade80",
                border:     offlineMode ? "1px solid #94a3b844" : "1px solid #4ade8044" }}>
                {offlineMode ? "● Offline" : "● Online"}
              </span>
            </div>
            <div style={{ fontSize: 11, color: "#3d526a", marginBottom: 12 }}>
              {offlineMode
                ? "You're working offline — only manual entry is available. Add a key to enable search."
                : "Shared across all profiles. Enables Title / Author and ISBN search."}
            </div>
            <input type="password" value={key} onChange={(e) => setKey(e.target.value)}
              placeholder={offlineMode ? "Paste a key to switch to online mode…" : "AIzaSy…"}
              style={{ width: "100%", background: "#080f18", border: "1px solid #1e2d3d", borderRadius: 8, padding: "10px 12px", color: "#e2e8f0", fontSize: 13, fontFamily: "'DM Mono', monospace" }}
              onFocus={(e) => e.target.style.borderColor = "#e2c97e44"}
              onBlur={(e) => e.target.style.borderColor = "#1e2d3d"} />
            <div style={{ marginTop: 12, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <button onClick={update} disabled={validating}
                style={{ background: "#e2c97e", color: "#0f172a", border: "none", borderRadius: 8, padding: "9px 20px", cursor: validating ? "default" : "pointer", fontWeight: 700, fontSize: 13, opacity: validating ? 0.6 : 1 }}>
                {validating ? "Validating…" : (offlineMode ? "Save & go online" : "Update")}
              </button>
              {!offlineMode && onGoOffline && (
                <button onClick={() => { onGoOffline(); setKey(""); setMsg({ type: "ok", text: "Switched to offline mode." }); }}
                  style={{ background: "transparent", color: "#7a90a8", border: "1px solid #1e2d3d", borderRadius: 8, padding: "9px 16px", cursor: "pointer", fontSize: 13 }}
                  onMouseEnter={(e) => { e.currentTarget.style.borderColor = "#3d526a"; e.currentTarget.style.color = "#94a3b8"; }}
                  onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#1e2d3d"; e.currentTarget.style.color = "#7a90a8"; }}>
                  Go offline

            {msg && (
              <div style={{ marginTop: 12, padding: "9px 14px", borderRadius: 8, fontSize: 13,

          {/* Currency */}
          <div style={{ background: "#0d1825", border: "1px solid #1a2535", borderRadius: 12, padding: "20px 22px" }}>
            <div style={{ fontSize: 11, color: "#6b8199", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700, marginBottom: 4 }}>Currency</div>
            <div style={{ fontSize: 11, color: "#3d526a", marginBottom: 12 }}>

            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <select value={currency} onChange={(e) => onCurrencyChange && onCurrencyChange(e.target.value)}

                  <option key={c.code} value={c.code}>{c.label}</option>

              </select>
              <span style={{ fontSize: 12, color: "#4a6080", fontFamily: "'DM Mono', monospace" }}>
